  if(b.broken>0){ b.broken--; if(b.broken===0){ b.poise=b.poiseMax; b.stagger=Math.max(b.stagger,16); b.st='idle'; b.t=0; } }
  if(b.stagger>0 || b.broken>0){
    b.stagger=Math.max(0,b.stagger-1);
    b.vx*=0.88; b.vy=Math.min(b.vy+0.46,9); b.tell=''; moveEnt(b); return;
  }
  const dx=(P.x+P.w/2)-(b.x+b.w/2), adx=Math.abs(dx);
  b.t++;
  const F=n=>Math.round(n*(b.phase===2?0.74:1));
  if(b.st==='idle'){
    b.face = dx>0?1:-1;
    b.vx = (dx>0?1:-1)*(adx>70?1.05:0.4)*(b.phase===2?1.3:1);
    if(b.cd>0) b.cd--;
    else {
      const r=rnd();
      if(adx<72 && r<0.40) b.st='cleaveWind';
      else if(r<0.62) b.st='goreWind';
      else if(b.phase===2 && r<0.82) b.st='stampWind';
      else b.st='hurlWind';
      b.t=0;
      if(b.lineT<=0 && rnd()<0.45){ b.line=EK_LINES[(b.said++)%EK_LINES.length]; b.lineT=160; }
    }
  }
  else if(b.st==='cleaveWind'){ b.tell='white'; b.vx*=0.8; if(b.t>=F(28)){ b.st='cleave1'; b.t=0; b.tell=''; } }
  else if(b.st==='cleave1'||b.st==='cleave2'){
    b.vx=b.face*1.3;
    if(b.t<=11){
      const box={x:b.face>0?b.x+b.w-6:b.x-38, y:b.y+4, w:44, h:36};
      if(rects(box,P)){ if(!tryParry(b,b.x)) hurtPlayer(22,b.face); }
    }
    if(b.t>=F(18)){ if(b.st==='cleave1'){ b.st='cleave2'; b.t=0; } else { b.st='rec'; b.t=0; } }
  }
  else if(b.st==='goreWind'){ b.tell='gold'; b.vx*=0.7; if(b.t>=F(30)){ b.st='gore'; b.t=0; b.tell=''; b.vx=b.face*4.2; } }
  else if(b.st==='gore'){
    b.vx=b.face*4.2;
    if(rects(b,P)) hurtPlayer(26,b.face,true);
    if(b.t>=F(34)){ b.st='rec'; b.t=0; shake(7); }
  }
  else if(b.st==='stampWind'){ b.tell='gold'; b.vx*=0.6; if(b.t>=F(26)){ b.st='stamp'; b.t=0; b.tell=''; b.vy=-6.6; } }
  else if(b.st==='stamp'){
    if(b.onGround && b.t>6){
      shake(11); stop(9); nz(.36,.09,150); b.st='rec'; b.t=0;
      burst(b.x+b.w/2,b.y+b.h,34,C.earthLit,3.4,36);
      for(const d of [-1,1]) shots.push({x:b.x+b.w/2,y:b.y+b.h-8,w:11,h:11,vx:d*3,vy:0,wave:true,t:0});
    }
  }
  else if(b.st==='hurlWind'){ b.tell='white'; b.vx*=0.8;
    if(b.t>=F(32)){
      b.st='rec'; b.t=0; b.tell=''; nz(.14,.05,600);
      for(let k=-2;k<=2;k++) shots.push({x:b.x+b.w/2,y:b.y+14,w:7,h:7,vx:b.face*2.6,vy:k*0.8,t:0,ember:true});
    }
  }
  else if(b.st==='rec'){ b.tell=''; b.vx*=0.82; if(b.t>=F(40)){ b.st='idle'; b.t=0; b.cd=F(32); } }
  b.vy=Math.min(b.vy+0.46,9);
  moveEnt(b);
}

// -- ONWE: the child you were supposed to be. It copies you. -------------------
const ON_LINES=[
  "\"You dug me up.\"",
  "\"They buried the charm so I would stay. You wanted me.\"",
  "\"Put the blade down and we can both go home.\"",
  "\"I am the ninth. You are the tenth. There is no eleventh.\""
];
function onweUpdate(b){
  if(b.hp < b.maxhp*0.60 && b.phase===1){
    b.phase=2; b.stagger=30; shake(8); G.flash=14; S.brk();
    say("\"Then we do it the way you taught me.\"",160);
  }
  if(b.hp < b.maxhp*0.25 && b.phase===2){
    b.phase=3; b.stagger=26; shake(10); G.flash=16;
    say("It stops copying you. It starts remembering you.",170);
  }
  if(b.broken>0){ b.broken--; if(b.broken===0){ b.poise=b.poiseMax; b.stagger=Math.max(b.stagger,14); b.st='idle'; b.t=0; } }
  if(b.stagger>0 || b.broken>0){
    b.stagger=Math.max(0,b.stagger-1);
    b.vx*=0.88; b.vy=Math.min(b.vy+0.46,9); b.tell=''; moveEnt(b); return;
  }
  const dx=(P.x+P.w/2)-(b.x+b.w/2), adx=Math.abs(dx);
  b.t++;
  const F=n=>Math.round(n*(b.phase>=2?0.78:1)*(b.phase>=3?0.86:1));
  if(b.st==='idle'){
    b.face=dx>0?1:-1;
    b.vx=(dx>0?1:-1)*(adx>44?1.5:0.5);
    if(b.cd>0) b.cd--;
    else {
      const r=rnd();
      if(adx<54 && r<0.42) b.st='chainWind';
      else if(r<0.60) b.st='mirrorWind';
      else if(b.phase>=2 && r<0.80) b.st='splitWind';
      else b.st='reachWind';
      b.t=0;
      if(b.lineT<=0 && rnd()<0.5){ b.line=ON_LINES[(b.said++)%ON_LINES.length]; b.lineT=170; }
    }
  }
  else if(b.st==='chainWind'){ b.tell='white'; b.vx*=0.7; if(b.t>=F(22)){ b.st='chain1'; b.t=0; b.tell=''; } }
  else if(b.st==='chain1'||b.st==='chain2'||b.st==='chain3'){
    b.vx=b.face*1.6;
    if(b.t<=9){
      const box={x:b.face>0?b.x+b.w-4:b.x-28, y:b.y+4, w:32, h:26};
      if(rects(box,P)){ if(!tryParry(b,b.x)) hurtPlayer(16,b.face); }
    }
    if(b.t>=F(14)){
      if(b.st==='chain1'){ b.st='chain2'; b.t=0; }
      else if(b.st==='chain2' && b.phase>=2){ b.st='chain3'; b.t=0; }
      else { b.st='rec'; b.t=0; }
    }
  }
  else if(b.st==='mirrorWind'){
    // it rolls the way you roll, and comes out behind you
    b.tell='gold'; b.vx*=0.6;
    if(b.t>=F(24)){
      b.st='mirror'; b.t=0; b.tell='';
      b.x = clamp(P.x + (dx>0?1:-1)*30, 16, R.w*T-b.w-16);
      b.face = (P.x>b.x)?1:-1;
      burst(b.x+b.w/2,b.y+b.h/2,22,C.glass,2.6,30); nz(.1,.04,900);
    }
  }
  else if(b.st==='mirror'){
    if(b.t<=12){
      const box={x:b.face>0?b.x+b.w-4:b.x-26, y:b.y+6, w:30, h:24};
      if(rects(box,P)) hurtPlayer(20,b.face,true);
    }
    if(b.t>=F(30)){ b.st='rec'; b.t=0; }
  }
  else if(b.st==='splitWind'){ b.tell='white'; b.vx*=0.8;
    if(b.t>=F(28)){
      b.st='rec'; b.t=0; b.tell=''; nz(.12,.04,800);
      for(let k=-1;k<=1;k++) shots.push({x:b.x+b.w/2,y:b.y+12,w:6,h:6,vx:b.face*3,vy:k*1.1,t:0,ember:true});
      for(let k=-1;k<=1;k++) shots.push({x:b.x+b.w/2,y:b.y+12,w:6,h:6,vx:-b.face*3,vy:k*1.1,t:0,ember:true});
    }
  }
  else if(b.st==='reachWind'){ b.tell='gold'; b.vx=0;
    if(b.t>=F(30)){ b.st='reach'; b.t=0; b.tell=''; } }
  else if(b.st==='reach'){
    // it puts a hand through the ground where you are standing
    if(b.t===1){ b.reachX=P.x+P.w/2; burst(b.reachX,P.y+P.h,14,C.indigo,2,30); }
    if(b.t>18 && b.t<=30){
      const box={x:b.reachX-12,y:P.y-6,w:24,h:P.h+18};
      if(rects(box,P)) hurtPlayer(19,(P.x>b.reachX?1:-1),true);
      if(b.t===19){ shake(6); nz(.2,.06,300); burst(b.reachX,P.y+P.h,20,C.uhie,3,32); }
    }
    if(b.t>=F(46)){ b.st='rec'; b.t=0; }
  }
  else if(b.st==='rec'){ b.tell=''; b.vx*=0.8; if(b.t>=F(34)){ b.st='idle'; b.t=0; b.cd=F(26); } }
  b.vy=Math.min(b.vy+0.46,9);
  moveEnt(b);
}

// -- projectiles -------------------------------------------------------------
function shotsUpdate(){
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i]; s.t++;
    if(!s.wave && !s.ember) s.vy += 0.09;
    s.x+=s.vx; s.y+=s.vy;
    if(s.wave){
      while(!solidAt(s.x+s.w/2, s.y+s.h+2, null) && s.y<R.h*T) s.y+=2;
    }

    if(s.back){
      let struck=false;
      for(const e of enemies) if(!e.dead && rects(s,e)){
        damage(e,18,s.vx>0?1:-1,2,false,20); burst(s.x,s.y,10,C.uhie,2.4,22); struck=true; break;
      }
      if(!struck && boss && !boss.dead && rects(s,boss)){
        const bd=boss.bound>0;
        damage(boss, bd?18:1.8, s.vx>0?1:-1, .6, !bd, bd?20:0); struck=true;
      }
      if(struck){ shots.splice(i,1); continue; }
    }
    else if(rects(s,P)){
      if(parryWindow() && ((s.x>P.x)===(P.face>0))){
        s.vx*=-1.8; s.vy=-1.0; s.t=0; s.back=true;
        stop(12); shake(4); G.flash=7; S.parry();
        P.ofo=Math.min(100,P.ofo+10);
        burst(s.x,s.y,16,C.chalk,2.8,26);
      } else {
        hurtPlayer(s.wave?14:10, s.vx>0?1:-1);
        shots.splice(i,1); continue;
      }
    }

    if(!s.wave && solidAt(s.x+3,s.y+3,null)){ burst(s.x,s.y,8,C.gold,2,20); shots.splice(i,1); continue; }
    if(s.t>240 || s.x<-20 || s.x>R.w*T+20){ shots.splice(i,1); }
  }
}

// ── update ───────────────────────────────────────────────────────────────────
function update(){
  G.t++;
  if(G.mode==='play') G.playT++;
  if(G.noteT>0) G.noteT--; else G.note='';
  if(G.outroT>0){ G.outroT--; if(G.outroT===0){
    saveGame();
    const who=G.outroWho||'ogbunabali';
    if(who==='ekwensu') playCut(EK_OUT);
    else if(who==='onwe') playCut(ON_OUT, ()=>{ G.mode='ending'; ENDW.t=0; });
    else playCut(BOSS_OUT);
    return; } }
  if(tap('KeyM')||tap('Tab')){ G.mode='map'; return; }
  if(tap('Escape')){ openPause(); return; }
  if(tap('KeyP')) musicToggle();
  if(tap('KeyK')){
    if(G.cheat) relock();
    else { unlockAll(); say('Cheats on. Everything open, nothing can touch you.',150); }
    G.flash=8; S.name();
  }
  tutUpdate();
  // if the browser only unlocked audio after the room loaded, catch up
  if(G.t%45===0 && AC && AC.state==='running' && !MUS.track) musicForRoom();
  if(G.msgT>0) G.msgT--; else G.msg=null;
  if(G.flash>0) G.flash--;
  if(G.slow>0) G.slow--;
  if(G.shake>0) G.shake*=0.86;
  if(G.fade>0) G.fade-=0.08;

  if(!P.dead) playerUpdate();
  ambientUpdate();
  for(const e of enemies) enemyUpdate(e);
  if(boss) bossUpdate(boss);
  shotsUpdate();

  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=0.98; p.life--;
    if(p.life<=0) parts.splice(i,1);
  }

  // camera
  const tx = clamp(P.x+P.w/2-W/2, 0, Math.max(0,R.w*T-W));
  const ty = clamp(P.y+P.h/2-H/2, 0, Math.max(0,R.h*T-H));
  cam.x += (tx-cam.x)*0.11; cam.y += (ty-cam.y)*0.13;
}

// ── drawing ──────────────────────────────────────────────────────────────────
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x*3)/3, Math.round(y*3)/3, w, h); }
// fine detail: lands on a real device pixel at 2x
function pxf(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }


// -- a tree that grew instead of a rectangle ---------------------------------
// Tapered leaning trunk, buttress roots, limbs that fork three deep, and a
// canopy built from overlapping masses with light sitting on top of it.
function treeShape(x, baseY, h, o){
  o = o || {};
  const bark = o.bark || ['#1a241d','#101711','#070c09'];
  const leaf = o.leaf || ['#132018','#1b2c1e','#0c1510'];
  const rim  = o.rim  || '#33502f';
  const sd   = (o.seed||1)|0;
  const dead = !!o.dead;
  const rw   = h*0.085;
  const lean = (((sd%7)-3)/3)*0.09;

  ctx.save(); ctx.translate(x, baseY);

  // buttress roots spreading into the ground
  ctx.fillStyle = bark[2];
  for(let i=-3;i<=3;i++){
    if(!i) continue;
    const sp = rw*(1.5+Math.abs(i)*0.9), dp = rw*(0.5+((sd*i)%3)*0.25);
    ctx.beginPath();
    ctx.moveTo(0, -rw*0.9);
    ctx.quadraticCurveTo(i*sp*0.5, -dp, i*sp, 1.5);
    ctx.lineTo(i*sp*0.62, 1.5);
    ctx.quadraticCurveTo(i*sp*0.28, -dp*0.7, 0, -rw*0.4);
    ctx.closePath(); ctx.fill();
  }

  // trunk
  ctx.beginPath();
  ctx.moveTo(-rw*1.25, 0);
  ctx.bezierCurveTo(-rw*1.0, -h*0.32, -rw*0.62+lean*h*0.5, -h*0.66, -rw*0.30+lean*h, -h);
  ctx.lineTo(rw*0.30+lean*h, -h);
  ctx.bezierCurveTo(rw*0.62+lean*h*0.5, -h*0.66, rw*1.0, -h*0.32, rw*1.25, 0);
  ctx.closePath();
  const tg = ctx.createLinearGradient(-rw*1.25, 0, rw*1.25, 0);
  tg.addColorStop(0, bark[2]); tg.addColorStop(.38, bark[1]);
  tg.addColorStop(.78, bark[0]); tg.addColorStop(1, bark[1]);
  ctx.fillStyle = tg; ctx.fill();

  // bark: vertical striation and a few knots
  ctx.save(); ctx.clip();
  for(let i=0;i<20;i++){
    const fx = -rw*1.2 + ((sd*(i+3)*11)%(rw*2.4));
    const fy = -h*(((sd*i*7)%92)/100);
    ctx.globalAlpha = .30;
    ctx.fillStyle = (i%2) ? bark[2] : '#26332a';
    ctx.fillRect(fx, fy, .5, h*0.22*(0.4+((i*5)%6)/10));
  }
  for(let i=0;i<3;i++){
    const ky=-h*(0.18+((sd*i)%5)*0.13);
    ctx.globalAlpha=.5; ctx.fillStyle=bark[2];
    ctx.beginPath(); ctx.ellipse(((sd*i)%3-1)*rw*0.5, ky, rw*0.32, rw*0.5, 0,0,7); ctx.fill();
    ctx.globalAlpha=.35; ctx.fillStyle=bark[0];
    ctx.beginPath(); ctx.ellipse(((sd*i)%3-1)*rw*0.5, ky, rw*0.16, rw*0.28, 0,0,7); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.restore();

  // limbs
  ctx.lineCap='round';
  const tips=[];
  (function limb(bx,by,ang,len,wid,d){
    if(d<=0 || len<2){ tips.push([bx,by,len]); return; }
    const cxp = bx+Math.cos(ang-0.22)*len*0.55, cyp = by+Math.sin(ang-0.22)*len*0.55;
    const ex  = bx+Math.cos(ang)*len,           ey  = by+Math.sin(ang)*len;
    ctx.strokeStyle = d>2 ? bark[1] : bark[2];
    ctx.lineWidth = Math.max(.6, wid);
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.quadraticCurveTo(cxp,cyp,ex,ey); ctx.stroke();
    const j = ((sd*d*13)%7)/40;
    limb(ex,ey, ang-0.46-j, len*0.66, wid*0.58, d-1);
    limb(ex,ey, ang+0.40+j, len*0.62, wid*0.56, d-1);
    if(d===3) limb(ex,ey, ang-0.05, len*0.5, wid*0.44, d-2);
  })(lean*h, -h*0.94, -1.57, h*0.30, rw*1.1, dead?4:3);

  if(!dead){
    // canopy: overlapping masses, densest at the crown
    const cy = -h*1.10;
    for(let i=0;i<14;i++){
      const a = (i/14)*6.283 + sd*0.7;
      const rr = h*(0.14 + ((sd*(i+1))%5)*0.022);
      const cxp = Math.cos(a)*h*0.30 + lean*h;
      const cyp = cy + Math.sin(a)*h*0.15 + (i%3)*2;
      ctx.fillStyle = leaf[i%3];
      ctx.beginPath(); ctx.ellipse(cxp, cyp, rr, rr*0.70, a*0.3, 0, 7); ctx.fill();
    }
    // clumps of leaves catching light on the upper left
    ctx.globalAlpha=.26; ctx.fillStyle=rim;
    for(let i=0;i<7;i++){
      const a=-2.75+i*0.42, rr=h*0.105;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a)*h*0.28+lean*h, cy+Math.sin(a)*h*0.14-rr*0.5, rr, rr*0.46, a*0.3,0,7);
      ctx.fill();
    }
    // a scatter of individual leaves on the silhouette edge
    ctx.globalAlpha=.5;
    for(let i=0;i<18;i++){
      const a=(sd*i*0.91)%6.283, rr=h*(0.30+((i*7)%9)*0.012);
      pxf(Math.cos(a)*rr+lean*h, cy+Math.sin(a)*rr*0.55, 1, 1, i%3?leaf[1]:rim);
    }
    ctx.globalAlpha=1;
  } else {
    // dead: a few hanging strands where leaves used to be
    ctx.globalAlpha=.55; ctx.strokeStyle=bark[2]; ctx.lineWidth=.5;
    for(const t of tips){
      ctx.beginPath(); ctx.moveTo(t[0],t[1]);
      ctx.lineTo(t[0]+Math.sin(G.t/40+t[0])*2, t[1]+4+((sd+t[0]|0)%6));
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

// -- a carved column, for the places with roofs ------------------------------
function stoneColumn(x, baseY, h, w, o){
  o=o||{};
  const c = o.col || ['#232b26','#161d19','#0c110e'];
  ctx.save(); ctx.translate(x, baseY);
  const g=ctx.createLinearGradient(-w/2,0,w/2,0);
  g.addColorStop(0,c[2]); g.addColorStop(.42,c[1]); g.addColorStop(.85,c[0]); g.addColorStop(1,c[2]);
  ctx.fillStyle=g;
  ctx.fillRect(-w/2, -h, w, h);
  // base and capital
  ctx.fillStyle=c[1];
  ctx.fillRect(-w*0.78, -6, w*1.56, 6);
  ctx.fillRect(-w*0.72, -h-7, w*1.44, 7);
  ctx.fillStyle=c[0];
  pxf(-w*0.78, -6, w*1.56, .5); pxf(-w*0.72, -h-7, w*1.44, .5);
  // fluting
  ctx.globalAlpha=.4;
  for(let i=0;i<4;i++){
    pxf(-w/2 + w*(i+0.5)/4, -h, .5, h, c[2]);
    pxf(-w/2 + w*(i+0.5)/4 + .5, -h, .5, h, c[0]);
  }
  // carved bands of nsibidi
  ctx.globalAlpha=.55;
  for(let b=0;b<3;b++){
    const by=-h*(0.25+b*0.28);
    pxf(-w/2, by, w, .5, c[0]);
    for(let i=0;i<3;i++) pxf(-w/2+2+i*(w-4)/3, by-2.5, .5, 2, o.mark||'#4a4030');
  }
  ctx.globalAlpha=1;
  ctx.restore();
}


// -- the far background is baked once per room, then slid past the camera ----
// Trees this detailed are too expensive to redraw sixty times a second, and
// they never move, so they only get painted when the room changes.
let bgLayers=null, bgRoom=-1;
const LAYER_K=[0.16,0.30,0.48];
function buildBackLayers(){
  bgLayers=[]; bgRoom=G.room;
  const WOODED=(G.room===0||G.room===1), BONES=(G.room===6);
  const keepSeed=G.seed;
  for(let layer=0;layer<3;layer++){
    const k=LAYER_K[layer];
    const cw=Math.ceil(R.w*T*k + W) + 120, ch=H;
    let c2, g2;
    try{
      c2=document.createElement('canvas');
      c2.width=Math.max(1,cw*SC); c2.height=Math.max(1,ch*SC);
      g2=c2.getContext('2d');
      if(!g2) throw 0;
      g2.setTransform(SC,0,0,SC,0,0);
      g2.imageSmoothingEnabled=false;
    }catch(e){ bgLayers=null; return; }

    const real=ctx; ctx=g2;
    G.seed = 99 + G.room*7 + layer*13;
    ctx.globalAlpha=[.34,.55,.82][layer];
    for(let i=0;i<12;i++){
      const bx=((i*97 + layer*41 + G.room*31)%(R.w*T))*k + 60;
      const by=H - ((i*7)%18);
      const hh=78 + ((i*29 + layer*17)%120)*(0.6+layer*0.24);
      if(WOODED || BONES){
        const dim = layer===0 ? 1 : layer===1 ? 0 : 2;
        treeShape(bx, by, hh, {
          seed:i*7+layer*3+G.room, dead:BONES,
          bark: BONES ? ['#2a2419','#1a160f','#0c0a06']
                      : [['#16201a','#0e1511','#070b08'],
                         ['#1a241d','#101711','#070c09'],
                         ['#202c23','#141d17','#090f0b']][dim],
          leaf: [['#0d1611','#121e15','#080f0b'],
                 ['#132018','#1b2c1e','#0c1510'],
                 ['#18291d','#213525','#101b13']][dim],
          rim:  ['#24381f','#33502f','#3f6238'][dim]
        });
      } else if(G.room===5){
        ctx.fillStyle='#0b1a1e';
        ctx.beginPath(); ctx.ellipse(bx, by-hh*0.4, 10+layer*4, hh*0.5, 0,0,7); ctx.fill();
      } else {
        stoneColumn(bx, by, hh, 9+layer*4, {
          col:[['#181f1b','#101511','#080c09'],
               ['#1e2620','#141b16','#0a0f0c'],
               ['#242d26','#18201a','#0d1210']][layer],
          mark: G.room===7 ? '#6a5a34' : '#4a4030'
        });
      }
    }
    if(WOODED && layer===2){
      ctx.globalAlpha=.85;
      for(let i=0;i<26;i++){
        const bx=((i*71+G.room*29)%(R.w*T))*k + 60;
        const rr=22+((i*13)%20);
        ctx.fillStyle=i%2?'#0b1310':'#0e1813';
        ctx.beginPath(); ctx.ellipse(bx, -8+((i*17)%18), rr, rr*0.6, 0,0,7); ctx.fill();
      }
    }
    ctx.globalAlpha=1;
    ctx=real;
    bgLayers.push({c:c2, k:k, w:cw, h:ch});
  }
  G.seed=keepSeed;
}
function drawBackLayers(){
  if(bgRoom!==G.room || !bgLayers) buildBackLayers();
  if(!bgLayers) return;
  for(const L of bgLayers){
    const ox = -cam.x*L.k + 60*0, oy = -cam.y*L.k*0.4;
    try{ ctx.drawImage(L.c, Math.round(ox*SC)/SC - 60, Math.round(oy*SC)/SC); }catch(e){}
    if(oy<0){ px(0, H+oy, W, -oy+2, '#050807'); }
  }
}

function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, R.tint); g.addColorStop(.62,'#080b0c'); g.addColorStop(1,'#040506');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const keep=G.seed; G.seed = 99 + G.room*7;

  // shafts of light through whatever is above
  if(G.room===1||G.room===4||G.room===5){
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<4;i++){
      const bx = ((i*163 + G.room*53)%(R.w*T)) - cam.x*0.5;
      const gg=ctx.createLinearGradient(bx,0,bx+34,H);
      const tintc = G.room===5?'90,190,205':(G.room===4?'214,150,72':'150,170,120');
      gg.addColorStop(0,'rgba('+tintc+',0.10)');
      gg.addColorStop(1,'rgba('+tintc+',0)');
      ctx.fillStyle=gg;
      ctx.beginPath(); ctx.moveTo(bx,0); ctx.lineTo(bx+22,0);
      ctx.lineTo(bx+58,H); ctx.lineTo(bx+8,H); ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }

  if(G.room===8){
    // heat: the whole room breathes
    const hb = 0.5 + Math.sin(G.t/26)*0.12;
    const fg2=ctx.createLinearGradient(0,H*0.35,0,H);
    fg2.addColorStop(0,'rgba(120,26,6,0)');
    fg2.addColorStop(.55,'rgba(176,52,10,'+(0.20*hb+0.10)+')');
    fg2.addColorStop(1,'rgba(255,150,50,'+(0.34*hb+0.14)+')');
    ctx.fillStyle=fg2; ctx.fillRect(0,0,W,H);
    // far cliffs of black rock, lit from below
    for(let L=0;L<2;L++){
      const k=[0.2,0.36][L];
      ctx.fillStyle=L?'#1b0d09':'#120705';
      ctx.beginPath(); ctx.moveTo(-20,H);
      for(let i=0;i<=10;i++){
        const px2=-20+i*(W+40)/10;
        const py2=H-42-((i*53+L*31)%56)-L*14 - cam.y*k*0.3;
        ctx.lineTo(px2,py2);
      }
      ctx.lineTo(W+20,H); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=.35; ctx.fillStyle=L?'#8a2f0e':'#5e1f08';
      ctx.beginPath(); ctx.moveTo(-20,H);
      for(let i=0;i<=10;i++){
        const px2=-20+i*(W+40)/10;
        const py2=H-42-((i*53+L*31)%56)-L*14 - cam.y*k*0.3;
        ctx.lineTo(px2,py2+3);
      }
      ctx.lineTo(W+20,H); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
    }
    // sparks lifting off the floor
    for(let i=0;i<26;i++){
      const sxp=((i*79 - G.t*0.25)%(W+40))-20;
      const syp=H-((G.t*0.9+i*37)%(H*0.9));
      ctx.globalAlpha=Math.max(0,.6-(H-syp)/H*0.6);
      pxf(sxp+Math.sin(G.t/12+i)*3, syp, 1, 1.5, i%3?'#ffb347':'#ff7a2a');
    }
    ctx.globalAlpha=1;
  }

  if(G.room===9){
    // a real sky: sun low, banded cloud, hills, and birds
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#101a2c'); sky.addColorStop(.34,'#2b3a52');
    sky.addColorStop(.62,'#6d5a5a'); sky.addColorStop(.82,'#c07a45'); sky.addColorStop(1,'#3a2a20');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    const sunx=W*0.72-cam.x*0.04, suny=H*0.66-cam.y*0.04;
    ctx.globalAlpha=.16; ctx.fillStyle='#ffca7a';
    ctx.beginPath(); ctx.arc(sunx,suny,54,0,7); ctx.fill();
    ctx.globalAlpha=.9; ctx.fillStyle='#ffd9a0';
    ctx.beginPath(); ctx.arc(sunx,suny,15,0,7); ctx.fill();
    ctx.globalAlpha=1;
    // stars still out at the top
    for(let i=0;i<30;i++){
      const h1=hash2(i*11,5), h2=hash2(i*17,7);
      ctx.globalAlpha=.35+Math.sin(G.t/30+i)*.2;
      pxf(h1*W, h2*70, .5, .5, '#dfe6f2');
    }
    ctx.globalAlpha=1;
    // cloud banks, lit along their tops
    for(let L=0;L<3;L++){
      const k=[0.05,0.12,0.22][L], base=54+L*34;
      for(let i=0;i<7;i++){
        const cxp=((i*137+L*61)%(W+240))-120-cam.x*k;
        const cyp=base+((i*29+L*13)%22)-cam.y*k*0.4;
        const cw=48+((i*23)%44), chh=8+((i*7)%7);
        ctx.globalAlpha=[.30,.45,.62][L];
        ctx.fillStyle=['#33405c','#4a5064','#6b5f60'][L];
        ctx.beginPath(); ctx.ellipse(cxp,cyp,cw,chh,0,0,7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cxp+cw*0.45,cyp+2,cw*0.6,chh*0.8,0,0,7); ctx.fill();
        ctx.globalAlpha=[.14,.22,.34][L]; ctx.fillStyle='#ffcf9a';
        ctx.beginPath(); ctx.ellipse(cxp-cw*0.15,cyp-chh*0.5,cw*0.7,chh*0.4,0,0,7); ctx.fill();
      }
    }
    ctx.globalAlpha=1;
    // hills below the cloud line
    for(let L=0;L<2;L++){
      ctx.fillStyle=L?'#241e22':'#312a2c';
      ctx.beginPath(); ctx.moveTo(-20,H);
      for(let i=0;i<=8;i++){
        const px2=-20+i*(W+40)/8;
        const py2=H*0.62+((i*67+L*41)%40)+L*26-cam.y*(0.10+L*0.06);
        ctx.lineTo(px2,py2);
      }
      ctx.lineTo(W+20,H); ctx.closePath(); ctx.fill();
    }
    // birds
    ctx.strokeStyle='#1a1a20'; ctx.lineWidth=.5;
    for(let i=0;i<5;i++){
      const bxp=((i*163 + G.t*0.28)%(W+80))-40, byp=48+((i*31)%40)+Math.sin(G.t/40+i)*4;
      const fl=Math.sin(G.t/7+i)*2;
      ctx.beginPath();
      ctx.moveTo(bxp-3,byp+fl); ctx.lineTo(bxp,byp); ctx.lineTo(bxp+3,byp+fl); ctx.stroke();
    }
  }

  // a moon over the buried charm; lanterns over the market; caustics under water
  if(G.room===0){
    const mx2=W-96+(-cam.x*0.05), my2=42+(-cam.y*0.05);
    ctx.globalAlpha=.10; ctx.fillStyle='#cfc6ad';
    ctx.beginPath(); ctx.arc(mx2,my2,26,0,7); ctx.fill();
    ctx.globalAlpha=.75; ctx.fillStyle='#d8d0b6';
    ctx.beginPath(); ctx.arc(mx2,my2,13,0,7); ctx.fill();
    ctx.fillStyle='#0b0f10';
    ctx.beginPath(); ctx.arc(mx2+5,my2-4,12,0,7); ctx.fill();
    ctx.globalAlpha=.5;
    for(let i=0;i<24;i++){ const h1=hash2(i*7,3), h2=hash2(i*13,9);
      pxf((h1*W)|0, (h2*110)|0, .5, .5, '#cfc6ad'); }
    ctx.globalAlpha=1;
  }
  if(G.room===4){
    for(let i=0;i<7;i++){
      const lx=((i*141)%(R.w*T))-cam.x*0.62, ly=26+((i*37)%34)-cam.y*0.3;
      const sw=Math.sin(G.t/34+i)*3;
      pxf(lx+sw, 0, .5, ly, '#1a1512');
      ctx.globalAlpha=.85; px(lx-3+sw, ly, 7, 8, '#2a1d12');
      pxf(lx-3+sw, ly, 7, .5, '#4a3520');
      ctx.globalAlpha=.9; px(lx-1.5+sw, ly+2, 4, 4, '#d8922e');
      ctx.globalAlpha=.16; ctx.fillStyle='#d8922e';
      ctx.beginPath(); ctx.arc(lx+sw+0.5, ly+4, 16, 0, 7); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  if(G.room===5){
    // a surface line with light crawling along it
    const wy=64-cam.y*0.5;
    ctx.globalAlpha=.20; px(0,wy,W,1,'#7fd0dc');
    ctx.globalAlpha=.10; px(0,wy+1,W,10,'#2a6b78');
    for(let i=0;i<20;i++){
      const rx=((i*57 - G.t*0.35)%(W+40))-20;
      ctx.globalAlpha=.16+Math.sin(G.t/9+i)*.08;
      pxf(rx, wy-1+Math.sin(G.t/13+i)*1.2, 6, .5, '#bfeef6');
    }
    ctx.globalAlpha=.13;
    for(let i=0;i<9;i++){
      const cxx=((i*97)%(R.w*T))-cam.x*0.5;
      const wob=Math.sin(G.t/26+i*1.3)*7;
      ctx.fillStyle='#7fd0dc';
      ctx.beginPath();
      ctx.moveTo(cxx+wob,0); ctx.lineTo(cxx+wob+9,0);
      ctx.lineTo(cxx-wob+16,H); ctx.lineTo(cxx-wob+2,H); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(G.room===3){
    ctx.globalAlpha=.12+Math.sin(G.t/40)*.04;
    const eg=ctx.createRadialGradient(W/2,H*0.8,10,W/2,H*0.8,W*0.6);
    eg.addColorStop(0,'rgba(160,28,44,0.5)'); eg.addColorStop(1,'rgba(160,28,44,0)');
    ctx.fillStyle=eg; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }

  drawBackLayers();
  // distant fog band
  ctx.globalAlpha=.5;
  const fg=ctx.createLinearGradient(0,H*0.45,0,H);
  fg.addColorStop(0,'rgba(20,26,28,0)'); fg.addColorStop(1,'rgba(22,28,30,0.75)');
  ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1; G.seed=keep;
  drawAmbient(false);
}

const STONE=[
 {base:'#1c1614', lit:'#2c2320', top:'#463630', side:'#241c1a', fleck:'#2a201d', moss:'#3a2a24'},
 {base:'#12121e', lit:'#1e1e30', top:'#2e2e4a', side:'#191926', fleck:'#1b1b2a', moss:'#282844'},
 {base:'#1b1f1a', lit:'#2a2f24', top:'#3c4436', side:'#232a20', fleck:'#232821', moss:'#2f3b2c'},
 {base:'#1a2018', lit:'#2b3324', top:'#414b36', side:'#212a1e', fleck:'#242c20', moss:'#37472f'},
 {base:'#161a1e', lit:'#242a30', top:'#333c44', side:'#1d2228', fleck:'#1f242a', moss:'#26323a'},
 {base:'#1d1618', lit:'#2c2124', top:'#3d2c30', side:'#241a1c', fleck:'#261c1e', moss:'#3a262c'},
 {base:'#211a1e', lit:'#33272c', top:'#4a3730', side:'#291f24', fleck:'#2b2126', moss:'#4a3524'},
 {base:'#12222a', lit:'#1d3a44', top:'#2b5560', side:'#16262e', fleck:'#183038', moss:'#1f4a52'},
 {base:'#241310', lit:'#3a1d13', top:'#5e2c15', side:'#1a0d0a', fleck:'#301810', moss:'#7a3410'},
 {base:'#1e2430', lit:'#2e3648', top:'#4a5468', side:'#161b24', fleck:'#242b38', moss:'#3a4458'}
];
function drawTiles(){
  const P0=STONE[G.room<6?G.room+2:(G.room===6?0:G.room===7?1:G.room===8?8:9)]||STONE[2];
  const x0=Math.floor(cam.x/T), x1=Math.ceil((cam.x+W)/T), y0=Math.floor(cam.y/T), y1=Math.ceil((cam.y+H)/T);
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const ch=tileAt(R,x,y);
    if('.wltWKBSNMhrvXOakiF'.indexOf(ch)>=0) continue;
    const sx=x*T-cam.x, sy=y*T-cam.y;

    if(ch==='E'){
      px(sx,sy,T,T,'#04060a');
      const gd=ctx.createLinearGradient(sx,sy,sx,sy+T);
      gd.addColorStop(0,'rgba(216,164,66,0.16)'); gd.addColorStop(1,'rgba(216,164,66,0)');
      ctx.fillStyle=gd; ctx.fillRect(sx,sy,T,T);
      px(sx,sy,1,T,'#1b211d'); px(sx+T-1,sy,1,T,'#1b211d');
      continue;
    }
    if(ch==='-'){
      px(sx,sy,T,3,P0.moss); px(sx,sy,T,1,P0.top);
      for(let i=2;i<T;i+=5) px(sx+i,sy+1,1,2,P0.side);
      ctx.globalAlpha=.35; px(sx,sy+3,T,1,'#000'); ctx.globalAlpha=1;
      continue;
    }
    if(ch==='^'){
      if(G.room===8){
        // molten rock: it moves, it lights the room, it does not forgive
        const gl=ctx.createLinearGradient(sx,sy,sx,sy+T);
        gl.addColorStop(0,'#ffcf6a'); gl.addColorStop(.30,'#f07818');
        gl.addColorStop(.72,'#a02a08'); gl.addColorStop(1,'#3a0e04');
        ctx.fillStyle=gl; ctx.fillRect(sx,sy,T,T);
        for(let q=0;q<3;q++){
          const wob=Math.sin(G.t/14 + x*0.7 + q*2)*2;
          ctx.globalAlpha=.55;
          pxf(sx+2+q*5, sy+2+wob, 3, 1, '#fff0bc');
          ctx.globalAlpha=1;
        }
        if(!SOLID(tileAt(R,x,y-1))){
          ctx.globalAlpha=.5; pxf(sx,sy,T,1,'#ffe08a'); ctx.globalAlpha=1;
          if((x+((G.t/9)|0))%5===0)
            burst(x*T+8, y*T, 1, '#ffb347', 1.1, 26);
        }
      } else {
        px(sx,sy,T,T,'#0a0c10');
        for(let q=0;q<3;q++){
          ctx.fillStyle=q%2?'#3a4048':'#222830';
          ctx.beginPath();
          ctx.moveTo(sx+q*5.4, sy+T); ctx.lineTo(sx+2.7+q*5.4, sy+2); ctx.lineTo(sx+5.4+q*5.4, sy+T);
          ctx.closePath(); ctx.fill();
          pxf(sx+2.4+q*5.4, sy+3, .5, 5, '#6a7280');
        }
      }
      continue;
    }
    if(ch==='c'){
      px(sx,sy,T,T,'#221f19');
      px(sx+2,sy+3,T-5,1,'#3a352a'); px(sx+5,sy+8,1,6,'#3a352a'); px(sx+9,sy+2,1,9,'#3a352a');
      ctx.globalAlpha=.5+Math.sin(G.t/24)*.2; px(sx+3,sy+6,T-7,1,C.goldDim); ctx.globalAlpha=1;
      if(!SOLID(tileAt(R,x,y-1))) px(sx,sy,T,1,C.goldDim);
      continue;
    }

    // solid ground
    px(sx,sy,T,T,P0.base);
    const sv=(x*73856093 ^ y*19349663)&0xff;
    if(sv%4===0) px(sx+(sv%11), sy+((sv>>3)%12), 2,2, P0.fleck);
    if(sv%7===0) px(sx+((sv>>2)%13), sy+((sv>>5)%13), 1,3, P0.side);
    // strata and grit at half-pixel
    pxf(sx, sy+4+((sv>>1)%9), T, .5, '#00000022');
    for(let q=0;q<3;q++){
      const h1=((sv*(q+3))&0x1f)/2, h2=((sv>>(q+1))&0x1f)/2;
      pxf(sx+h1*0.5, sy+h2*0.5, .5, .5, q%2?P0.fleck:P0.lit);
    }
    if(G.room===5 && sv%5===0) pxf(sx+((sv>>1)%13), sy+((sv>>4)%13), .5, .5, '#4f8f9c');

    const open = !SOLID(tileAt(R,x,y-1));
    if(open){
      px(sx,sy,T,2,P0.lit);
      px(sx,sy,T,1,P0.top);
      if(sv%3===0) px(sx+(sv%12),sy-2,2,2,P0.moss);
      if(sv%5===0){ px(sx+((sv>>1)%13),sy-1,1,1,P0.moss); }
      // hanging growth on the lip
      if(sv%6===0){ const l=2+(sv%4); px(sx+((sv>>3)%12), sy+2, 1, l, P0.moss); }
      // blades of grass on the edge, half-pixel thin
      for(let bI=0;bI<3;bI++){
        if(((sv>>bI)&3)!==1) continue;
        const gx2=sx+2+bI*5+((sv>>2)%3), gh=1.5+((sv>>bI)%3);
        pxf(gx2, sy-gh, .5, gh, P0.moss);
        pxf(gx2+.5, sy-gh+.5, .5, .5, P0.top);
      }
      pxf(sx, sy+2, T, .5, '#00000033');
    }
    // roots and drips under an overhang
    if(!SOLID(tileAt(R,x,y+1)) && sv%4===1){
      const l=3+(sv%6);
      px(sx+((sv>>2)%12), sy+T-1, 1, l, P0.side);
      if(G.room===5 && sv%8===1) px(sx+((sv>>2)%12), sy+T-1+((G.t/3+sv)%22), 1,2, C.glass);
    }
    if(!SOLID(tileAt(R,x-1,y))) px(sx,sy,1,T,P0.side);
    if(!SOLID(tileAt(R,x+1,y))) px(sx+T-1,sy,1,T,P0.side);
    // corner ambient occlusion into open air
    ctx.globalAlpha=.25;
    if(open && !SOLID(tileAt(R,x-1,y))) px(sx,sy,2,2,'#000');
    if(open && !SOLID(tileAt(R,x+1,y))) px(sx+T-2,sy,2,2,'#000');
    ctx.globalAlpha=1;
  }
}

// ── carved things ────────────────────────────────────────────────────────────
// A masquerade face, cut the way a carver cuts one: heavy brow, sunken sockets,
// a ridge down the nose, a wide mouth, and rows of ichi marks across the cheeks.
function maskFace(cx,cy,w,h,o){
  o=o||{};
  const wood = o.wood || ['#efe6cc','#cbbe9e','#8e8268','#4e4636'];
  ctx.save(); ctx.translate(cx,cy);
  const hw=w/2, hh=h/2;

  // skull of the mask
  const g=ctx.createLinearGradient(-hw,-hh,hw*0.6,hh);
  g.addColorStop(0,wood[0]); g.addColorStop(.42,wood[1]);
  g.addColorStop(.8,wood[2]); g.addColorStop(1,wood[3]);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(0,-hh);
  ctx.bezierCurveTo(hw*.92,-hh*.92, hw, -hh*.1, hw*.72, hh*.42);
  ctx.bezierCurveTo(hw*.46, hh*.94, -hw*.46, hh*.94, -hw*.72, hh*.42);
  ctx.bezierCurveTo(-hw, -hh*.1, -hw*.92, -hh*.92, 0,-hh);
  ctx.closePath(); ctx.fill();

  // the lit side and the shadowed side
  ctx.save(); ctx.clip();
  ctx.fillStyle='rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.ellipse(-hw*.34,-hh*.24, hw*.42, hh*.5, -.3, 0, 7); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.30)';
  ctx.beginPath(); ctx.moveTo(hw*.18,-hh); ctx.lineTo(hw,-hh); ctx.lineTo(hw,hh); ctx.lineTo(hw*.02,hh);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // brow ridge, thrown forward
  ctx.fillStyle='rgba(0,0,0,0.42)';
  ctx.beginPath();
  ctx.moveTo(-hw*.80,-hh*.20); ctx.quadraticCurveTo(0,-hh*.52, hw*.80,-hh*.20);
  ctx.lineTo(hw*.80,-hh*.06); ctx.quadraticCurveTo(0,-hh*.36, -hw*.80,-hh*.06);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.beginPath();
  ctx.moveTo(-hw*.78,-hh*.24); ctx.quadraticCurveTo(0,-hh*.56, hw*.78,-hh*.24);
  ctx.lineTo(hw*.78,-hh*.19); ctx.quadraticCurveTo(0,-hh*.50, -hw*.78,-hh*.19);
  ctx.closePath(); ctx.fill();

  // sockets
  const ex=hw*.40, ey=hh*.02, ew=hw*.30, eh=hh*.19;
  for(const sgn of [-1,1]){
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.ellipse(sgn*ex, ey+hh*.03, ew*1.18, eh*1.5, 0,0,7); ctx.fill();
    ctx.fillStyle=o.socket||'#120d0a';
    ctx.beginPath(); ctx.ellipse(sgn*ex, ey, ew, eh, 0,0,7); ctx.fill();
    if(o.eye){
      ctx.fillStyle=o.eye;
      ctx.beginPath(); ctx.ellipse(sgn*ex, ey, ew*.42, eh*.62, 0,0,7); ctx.fill();
      ctx.globalAlpha=.35;
      ctx.beginPath(); ctx.ellipse(sgn*ex, ey, ew*1.5, eh*2.1, 0,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
  }

  // nose ridge
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.moveTo(-hw*.07,-hh*.16); ctx.lineTo(hw*.07,-hh*.16);
  ctx.lineTo(hw*.11, hh*.34); ctx.lineTo(-hw*.11, hh*.34); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.34)';
  ctx.fillRect(hw*.05,-hh*.16, hw*.06, hh*.5);
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(-hw*.11, hh*.36, hw*.055, hh*.045,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( hw*.11, hh*.36, hw*.055, hh*.045,0,0,7); ctx.fill();

  // mouth
  const my=hh*.60, mw=hw*.50;
  ctx.fillStyle='rgba(0,0,0,0.72)';
  ctx.beginPath();
  ctx.moveTo(-mw,my); ctx.quadraticCurveTo(0,my+hh*.20, mw,my);
  ctx.quadraticCurveTo(0,my+hh*.05, -mw,my); ctx.closePath(); ctx.fill();
  if(o.teeth!==false){
    ctx.fillStyle=o.tooth||'#efe8d2';
    const n=6;
    for(let i=0;i<n;i++){
      const t=(i+.5)/n, tx=-mw+t*mw*2, dip=Math.sin(t*Math.PI)*hh*.11;
      ctx.fillRect(tx-mw*.055, my+hh*.01, mw*.11, dip);
    }
  }

  // ichi: rows of scarification across brow and cheeks
  ctx.strokeStyle=o.ichi||'rgba(40,28,18,0.6)'; ctx.lineWidth=Math.max(.4,w*.018);
  for(let i=0;i<5;i++){
    const yy=-hh*.72+i*hh*.055;
    ctx.beginPath(); ctx.moveTo(-hw*.42,yy); ctx.lineTo(hw*.42,yy); ctx.stroke();
  }
  for(const sgn of [-1,1]) for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.moveTo(sgn*hw*(.30+i*.10), hh*.26);
    ctx.lineTo(sgn*hw*(.42+i*.10), hh*.52); ctx.stroke();
  }
  // edge light
  ctx.strokeStyle='rgba(255,255,255,0.20)'; ctx.lineWidth=Math.max(.4,w*.02);
  ctx.beginPath();
  ctx.moveTo(-hw*.90,-hh*.4); ctx.bezierCurveTo(-hw*.94,-hh*.9, -hw*.4,-hh*1.02, 0,-hh);
  ctx.stroke();
  ctx.restore();
}

// A skull. Cranium, sockets, nasal aperture, a row of teeth, and a jaw.
function skullShape(cx,cy,s,o){
  o=o||{};
  const bone=o.bone||['#e2d9bf','#b4a98c','#6d6450'];
  ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s);
  const g=ctx.createLinearGradient(-1,-1,1,1);
  g.addColorStop(0,bone[0]); g.addColorStop(.55,bone[1]); g.addColorStop(1,bone[2]);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(0,-1);
  ctx.bezierCurveTo(.95,-1, 1.02,.06, .66,.42);
  ctx.lineTo(.42,.42); ctx.lineTo(.40,.88);
  ctx.quadraticCurveTo(0,1.12, -.40,.88);
  ctx.lineTo(-.42,.42); ctx.lineTo(-.66,.42);
  ctx.bezierCurveTo(-1.02,.06, -.95,-1, 0,-1);
  ctx.closePath(); ctx.fill();
  // sockets
  ctx.fillStyle=o.socket||'#0b0806';
  for(const sg of [-1,1]){
    ctx.beginPath(); ctx.ellipse(sg*.40,-.14,.28,.30,sg*.12,0,7); ctx.fill();
  }
  if(o.eye){ ctx.fillStyle=o.eye;
    for(const sg of [-1,1]){ ctx.beginPath(); ctx.arc(sg*.40,-.10,.10,0,7); ctx.fill(); } }
  // nasal
  ctx.fillStyle=o.socket||'#0b0806';
  ctx.beginPath(); ctx.moveTo(0,.02); ctx.lineTo(.16,.34); ctx.lineTo(-.16,.34); ctx.closePath(); ctx.fill();
  // teeth
  ctx.fillStyle=bone[0];
  for(let i=0;i<6;i++) ctx.fillRect(-.36+i*.12,.50,.09,.30);
  ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=.04;
  ctx.beginPath(); ctx.moveTo(-.40,.50); ctx.lineTo(.40,.50); ctx.stroke();
  // cranial suture
  ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.lineWidth=.035;
  ctx.beginPath(); ctx.moveTo(0,-1);
  for(let i=0;i<6;i++) ctx.lineTo((i%2?.06:-.06), -.94+i*.13);
  ctx.stroke();
  ctx.restore();
}

// A pair of horns, ribbed and curling back.
function hornPair(cx,cy,s,o){
  o=o||{};
  const col=o.col||['#2a2118','#0e0b08'];
  ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s);
  for(const sg of [-1,1]){
    const g=ctx.createLinearGradient(0,-1.6,sg*1.6,.2);
    g.addColorStop(0,col[0]); g.addColorStop(1,col[1]);
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(sg*.22,0);
    ctx.bezierCurveTo(sg*.62,-.42, sg*1.28,-.68, sg*1.42,-1.52);
    ctx.bezierCurveTo(sg*1.02,-.92, sg*.72,-.62, sg*.62,-.10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.13)'; ctx.lineWidth=.05;
    for(let i=1;i<7;i++){
      const t=i/7;
      ctx.beginPath();
      ctx.moveTo(sg*(.24+t*.92), -t*.86);
      ctx.lineTo(sg*(.34+t*1.02), -t*1.02);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// An alusi figure: conical head, ichi across the brow, arms held out, on a base.
function idolStatue(cx,cy,s,o){
  o=o||{};
  const wood=o.wood||['#3a2c1e','#241a12','#120d09'];
  ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s);
  const g=ctx.createLinearGradient(-1,-3,1,1);
  g.addColorStop(0,wood[0]); g.addColorStop(.6,wood[1]); g.addColorStop(1,wood[2]);
  ctx.fillStyle=g;
  ctx.fillRect(-1.1,.72,2.2,.34);                     // base
  ctx.fillRect(-.34,-.5,.68,1.3);                     // legs / column
  ctx.fillRect(-.62,-1.5,1.24,1.05);                  // torso
  ctx.fillRect(-1.16,-1.36,.56,.24); ctx.fillRect(.60,-1.36,.56,.24);  // arms out
  ctx.fillRect(-1.16,-1.36,.22,.72); ctx.fillRect(.94,-1.36,.22,.72);
  ctx.fillRect(-.20,-1.78,.40,.34);                   // neck
  ctx.beginPath();                                    // conical head
  ctx.moveTo(0,-2.8); ctx.lineTo(.46,-1.72); ctx.lineTo(-.46,-1.72); ctx.closePath(); ctx.fill();
  // face
  ctx.fillStyle='rgba(0,0,0,.62)';
  ctx.beginPath(); ctx.ellipse(-.17,-2.02,.10,.07,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(.17,-2.02,.10,.07,0,0,7); ctx.fill();
  ctx.fillRect(-.14,-1.86,.28,.05);
  if(o.eye){ ctx.fillStyle=o.eye;
    ctx.beginPath(); ctx.arc(-.17,-2.02,.05,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(.17,-2.02,.05,0,7); ctx.fill(); }
  // ichi across the cone
  ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=.05;
  for(let i=0;i<4;i++){
    const t=i*.13;
    ctx.beginPath(); ctx.moveTo(-.34+t*.6,-2.24+t*.5); ctx.lineTo(.34-t*.6,-2.24+t*.5); ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=.06;
  ctx.beginPath(); ctx.moveTo(-.60,-1.46); ctx.lineTo(-.60,-.48); ctx.stroke();
  // nzu smeared on it by whoever still prays here
  if(o.chalk){ ctx.fillStyle='rgba(226,220,200,.5)';
    ctx.fillRect(-.46,-1.24,.92,.10); ctx.fillRect(-.30,-1.02,.60,.08); }
  ctx.restore();
}

function glyph(x,y,s,col,rot){ // small nsibidi-ish chalk mark
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
  ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(-s,0); ctx.lineTo(s,0);
  ctx.moveTo(0,-s); ctx.lineTo(0,s);
  ctx.moveTo(-s*.6,-s*.6); ctx.lineTo(s*.6,s*.6);
  ctx.stroke(); ctx.restore();
}

function groundY(ex,ey,eh){
  let ty=Math.floor((ey+eh+2)/T);
  for(let i=0;i<7;i++){ if(SOLID(tileAt(R,Math.floor(ex/T),ty+i))) return (ty+i)*T; }
  return ey+eh;
}
function shadow(ex,ey,ew,eh){
  const gy=groundY(ex+ew/2,ey,eh);
  const drop=clamp(1-(gy-(ey+eh))/70,0.15,1);
  ctx.globalAlpha=.34*drop;
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.ellipse(ex+ew/2-cam.x, gy-cam.y-1, (ew*0.62)*drop, 2.2*drop, 0, 0, 7);
  ctx.fill(); ctx.globalAlpha=1;
}
function drawShadows(){
  for(const e of enemies) if(!e.dead) shadow(e.x,e.y,e.w,e.h);
  if(boss && !boss.dead) shadow(boss.x,boss.y,boss.w,boss.h);
  if(!P.dead) shadow(P.x,P.y,P.w,P.h);
}
// leaves and stones passing in front of the camera
// the things people left behind in each place
function drawProps(){
  const keep=G.seed; G.seed=707+G.room*23;
  if(G.room===6){
    for(let i=0;i<12;i++){
      const bx=((i*151)%(R.w*T))-cam.x, by=16*T-cam.y;
      if(bx<-30||bx>W+30) continue;
      for(let j=0;j<3;j++)
        skullShape(bx+j*5-4, by-3-j*4, 3.2-j*0.5, {bone:['#b9ae90','#8a806a','#4e4739']});
    }
    for(let i=0;i<4;i++){
      const bx=((i*233+60)%(R.w*T))-cam.x, by=16*T-cam.y;
      if(bx<-40||bx>W+40) continue;
      hornPair(bx, by-16, 6, {col:['#3a2c1e','#120c07']});
      px(bx-5, by-16, 10, 16, '#1a1310');
    }
  }
  if(G.room===7){
    for(let i=0;i<9;i++){
      const bx=((i*127+30)%(R.w*T))-cam.x, by=16*T-cam.y;
      if(bx<-40||bx>W+40) continue;
      idolStatue(bx, by, 6.5+((i*7)%3), {eye:'#8fe6ff', chalk:i%2===0});
      ctx.globalAlpha=.10; ctx.fillStyle=C.glass;
      ctx.beginPath(); ctx.arc(bx, by-14, 22, 0, 7); ctx.fill(); ctx.globalAlpha=1;
    }
  }
  if(G.room===3){
    for(let i=0;i<3;i++){
      const bx=60+i*140-cam.x*0.9, by=16*T-cam.y;
      idolStatue(bx, by, 5, {eye:'#a01c2c'});
    }
  }
  if(G.room===4){
    for(let i=0;i<5;i++){
      const bx=((i*181+40)%(R.w*T))-cam.x, by=16*T-cam.y;
      skullShape(bx, by-6, 4, {bone:['#cdc0a0','#9a8f74','#5a5342'], eye:'#d8922e'});
    }
  }
  ctx.globalAlpha=1; G.seed=keep;
}

function windAt(t){ return Math.sin(t/97)*0.6 + Math.sin(t/31)*0.3 + Math.sin(t/13)*0.12; }
function drawForeground(){
  const keep=G.seed; G.seed=311+G.room*17;
  const gust=windAt(G.t);
  const k=1.5;

  // branches reaching in from the top of the frame
  if(G.room===0||G.room===1||G.room===6){
    ctx.globalAlpha=.95;
    for(let i=0;i<5;i++){
      const bx=((i*263+G.room*91)%(R.w*T)) - cam.x*(k*0.9);
      if(bx<-160||bx>W+160) continue;
      const side = (i%2)?1:-1;
      const by = -6 - cam.y*0.25 + ((i*23)%22);
      ctx.strokeStyle='#040605'; ctx.lineCap='round';
      (function bough(x0,y0,ang,len,wid,d){
        if(d<=0||len<3) return;
        const ex=x0+Math.cos(ang)*len, ey=y0+Math.sin(ang)*len;
        ctx.lineWidth=wid;
        ctx.beginPath(); ctx.moveTo(x0,y0);
        ctx.quadraticCurveTo(x0+Math.cos(ang-0.3)*len*0.55, y0+Math.sin(ang-0.3)*len*0.55, ex,ey);
        ctx.stroke();
        bough(ex,ey,ang+0.5*side,len*0.62,wid*0.55,d-1);
        bough(ex,ey,ang-0.34*side,len*0.58,wid*0.5,d-1);
      })(bx, by, side>0?0.42:2.72, 44+((i*17)%26), 5, 4);
      if(G.room!==6){
        // leaf clusters hanging off the bough
        ctx.fillStyle='#060b07';
        for(let j=0;j<10;j++){
          const a=(i*3+j)*0.71, rr=5+((j*5)%7);
          ctx.beginPath();
          ctx.ellipse(bx+side*(14+j*7)+gust*4, by+10+((j*11)%16)+Math.sin(G.t/50+j)*1.5+gust*1.6, rr, rr*0.6, a+gust*0.1, 0, 7);
          ctx.fill();
        }
      }
      // vines
      ctx.strokeStyle='#050806'; ctx.lineWidth=1;
      for(let v=0;v<3;v++){
        const vx=bx+side*(20+v*18), vl=18+((i*v*7)%34);
        ctx.beginPath(); ctx.moveTo(vx, by+8);
        ctx.quadraticCurveTo(vx+Math.sin(G.t/60+v)*4, by+8+vl*0.6, vx+Math.sin(G.t/44+v)*6, by+8+vl);
        ctx.stroke();
        pxf(vx+Math.sin(G.t/44+v)*6, by+8+vl, 1.5, 1.5, '#0a1109');
      }
    }
  }

  ctx.globalAlpha=.85;
  for(let i=0;i<9;i++){
    const bx=((i*211+G.room*67)%(R.w*T)) - cam.x*k;
    const by=H-24-((i*53)%40) - cam.y*(k*0.3);
    if(bx<-60||bx>W+60) continue;
    ctx.fillStyle='#050706';
    if(G.room===5){
      for(let b=0;b<7;b++){
        const sw=Math.sin(G.t/30+i+b*0.5)*2;
        pxf(bx+b*3+sw, by+((b*7)%14)-10, 1.5, 34-((b*3)%12), '#05090b');
        pxf(bx+b*3+sw, by+((b*7)%14)-12, 1.5, 3, '#0b1a1e');
      }
    }
    else if(G.room===4){
      px(bx,by+8,16,26,'#06070a'); px(bx-2,by+6,20,3,'#080a0d');
      for(let b=0;b<5;b++) pxf(bx-1+b*4, by+9, 2, 4+((i+b)%5), '#06070a');
    }
    else if(G.room===6){
      // ribs and shards standing out of the bone road
      for(let b=0;b<4;b++){
        ctx.save(); ctx.translate(bx+b*6, by+18); ctx.rotate(-0.3+b*0.16);
        ctx.fillStyle='#080706'; ctx.fillRect(-1, -26-((b*5)%12), 2, 30);
        ctx.restore();
      }
    }
    else {
      // low grass and root arcs
      for(let b=0;b<7;b++){
        const gh=6+((i*b*5)%13), sw=Math.sin(G.t/38+i+b)*1.2;
        pxf(bx+b*3+sw, by+22-gh, 1, gh, '#050806');
      }
      for(let b=0;b<3;b++){
        const a=-1.0+b*0.55;
        ctx.save(); ctx.translate(bx,by+16); ctx.rotate(a);
        ctx.fillStyle='#050706'; ctx.fillRect(0,-1.5,22+((i*b)%14),3);
        ctx.restore();
      }
    }
  }
  ctx.globalAlpha=1; G.seed=keep;
}

function drawDecals(){
  for(const d of decals){
    if(d.room!==G.room) continue;
    ctx.globalAlpha=d.a*0.55;
    px(d.x-cam.x, d.y-cam.y, d.s, d.s, C.uhie);
  }
  ctx.globalAlpha=1;
}

function drawShrines(){
  for(const s of shrines){
    const x=s.x-cam.x, y=s.y-cam.y;
    if(s.kind==='rest'){
      // an ikenga: carved wood, horned, with a small fire at its feet
      px(x+4,y+7,8,15,'#221a12');
      pxf(x+4,y+7,8,.5,'#3a2c1c'); pxf(x+11.5,y+7,.5,15,'#150f0a');
      px(x+5,y+2,6,6,'#2c2116');                 // head
      pxf(x+5,y+2,6,.5,'#463420');
      pxf(x+4,y-1,1.5,3.5,'#2c2116'); pxf(x+10.5,y-1,1.5,3.5,'#2c2116');   // horns
      pxf(x+6,y+4,1,1,'#0d0a06'); pxf(x+9,y+4,1,1,'#0d0a06');
      pxf(x+6.5,y+6,3,.5,'#0d0a06');
      pxf(x+2.5,y+9,2,7,'#221a12'); pxf(x+11.5,y+9,2,7,'#221a12');         // arms
      for(let i=0;i<3;i++) pxf(x+5,y+11+i*3,6,.5,'#3a2c1c');
      // offering bowl and flame
      px(x+5,y+21,6,2,'#1a1410');
      const fl=Math.sin(G.t/6)*1.2;
      px(x+7,y+18.5+fl*0.2,2,3, G.checkpoint.room===G.room?C.gold:'#7a5a20');
      pxf(x+7.5,y+17.5+fl*0.3,1,1.5,'#f4d488');
      if(G.t%5===0) parts.push({x:s.x+8,y:s.y+18,vx:(rnd()-.5)*.4,vy:-.5-rnd()*.4,
        life:20,max:26,col:C.gold,g:-0.01,sz:1});
      ctx.globalAlpha=.22+Math.sin(G.t/26)*.10;
      ctx.fillStyle=C.gold; ctx.beginPath(); ctx.arc(x+8,y+16,15,0,7); ctx.fill(); ctx.globalAlpha=1;
    } else if(s.kind==='mirror'){
      const on=G.mirrors[s.id], dark=G.mirrorLock[s.id];
      ctx.globalAlpha=.30+(on?Math.sin(G.t/22)*.14:0);
      ctx.fillStyle=on?C.glass:(dark?'#241c22':'#2b2f36');
      ctx.beginPath(); ctx.arc(x+8,y+11,on?16:11,0,7); ctx.fill(); ctx.globalAlpha=1;
      px(x+1,y-1,14,24,'#241d16');
      px(x+3,y+1,10,20, on?'#12323a':(dark?'#0a0709':'#14171c'));
      if(on){
        for(let i=0;i<5;i++){
          const yy=y+2+((G.t/3+i*9)%18);
          ctx.globalAlpha=.5-Math.abs(yy-(y+11))/26;
          px(x+4,yy,8,1,C.glass); ctx.globalAlpha=1;
        }
        glyph(x+8,y+11,4,C.bone,G.t/50);
      } else if(!dark){
        ctx.globalAlpha=.45+Math.sin(G.t/9)*.2; glyph(x+8,y+11,4,C.chalkDim,-G.t/60); ctx.globalAlpha=1;
      }
      px(x+1,y-2,14,2,C.goldDim);
    } else {
      px(x+2,y,12,22,'#161a1c'); px(x+2,y,12,1,'#20262a');
      ctx.globalAlpha = G.knowsName?.9:.45+Math.sin(G.t/18)*.25;
      glyph(x+8,y+8,4,C.chalk,0); glyph(x+8,y+15,3,C.chalk,0.6);
      ctx.globalAlpha=1;
    }
  }
}

function drawPickups(){
  for(const p of pickups){
    if(p.kind==='cowrie'){
      const x=p.x-cam.x, y=p.y-cam.y;
      ctx.globalAlpha=.22; ctx.fillStyle=C.gold;
      ctx.beginPath(); ctx.arc(x+3,y+3,6,0,7); ctx.fill(); ctx.globalAlpha=1;
      px(x,y+1,6,4,C.bone); px(x+1,y,4,1,C.bone); px(x+1,y+5,4,1,'#8e8474');
      px(x+2,y+2,2,2,'#7a6a52');
      continue;
    }
    const x=p.x-cam.x, y=p.y-cam.y+Math.sin((G.t+p.t)/22)*2;
    ctx.globalAlpha=.3; ctx.fillStyle=C.blood; ctx.beginPath(); ctx.arc(x+4,y+4,9,0,7); ctx.fill(); ctx.globalAlpha=1;
    px(x+1,y+1,6,6,C.blood); px(x+2,y+2,2,2,'#e6706a');
  }
}

function drawPlayer(){
  if(P.dead) return;
  const x=Math.round(P.x-cam.x), y=Math.round(P.y-cam.y), f=P.face;
  const rolling = P.st==='roll';
  if(P.inv>0 && Math.floor(G.t/4)%2===0) ctx.globalAlpha=.55;

  // charge: the blade drinks light before the heavy
  if(P.charge>0){
    const full = P.charge>=CHARGE_AT;
    ctx.globalAlpha = full ? .55+Math.sin(G.t/3)*.25 : Math.min(.4, P.charge/CHARGE_AT*.4);
    ctx.strokeStyle = full ? C.gold : C.goldDim; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(x+5, y+9, full? 13+Math.sin(G.t/4)*1.5 : 4+P.charge*0.3, 0, 7); ctx.stroke();
    ctx.globalAlpha=1;
    if(full && G.t%4===0) px(x+(f>0?11:-2), y+4+((G.t/4)%6), 1,1, C.gold);
  }
  // ward glow
  if(P.st==='ward'){
    ctx.globalAlpha = P.t<=9?.55:.2;
    ctx.strokeStyle = P.t<=9?C.chalk:C.chalkDim; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(x+5+f*6,y+9,11,0,7); ctx.stroke(); ctx.globalAlpha=1;
  }
  if(P.st==='call'){
    const r = 6+P.t*0.5;
    ctx.globalAlpha=.6; ctx.strokeStyle=C.gold; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(x+5,y+9,r,0,7); ctx.stroke();
    glyph(x+5,y+9,4+Math.sin(G.t/6),C.gold,G.t/20); ctx.globalAlpha=1;
  }

  const bob = (P.onGround && Math.abs(P.vx)>0.3 && !rolling) ? (Math.floor(P.anim/6)%2) : 0;
  if(rolling){
    const r=Math.floor(P.t/4)%4;
    px(x,y+8,10,10,'#14181c'); px(x+2,y+10,6,6,'#0e1114');
    px(x+ (r%2?1:6), y+9, 3,3, C.uhie);
    ctx.globalAlpha=1; return;
  }
  // cloth trailing behind
  ctx.globalAlpha=.85;
  for(let i=0;i<3;i++){
    const sw=Math.sin(G.t/7 - i*0.8)*2.2 - P.vx*1.6;
    px(x + (f>0?-2:9) + sw*0.4, y+8+bob+i*3, 4-i*0+3, 3, i?'#0f1216':'#141a1e');
  }
  ctx.globalAlpha=1;
  const B=y+bob, step=(P.onGround&&Math.abs(P.vx)>0.3)?Math.floor(P.anim/6)%2:0;
  // legs
  px(x+1.5, B+14, 3, 4, '#0d1013'); px(x+5.5, B+14, 3, 4, '#0d1013');
  pxf(x+1.5+(step?0.5:0), B+17, 3.5, 1.5, '#1a1512');
  pxf(x+5.5-(step?0.5:0), B+17, 3.5, 1.5, '#1a1512');
  // robe body with folds
  px(x, B+7, 10, 11, '#161b20');
  pxf(x+(f>0?0:1), B+13, 9, 5, '#101317');
  pxf(x+2.5, B+8, .5, 9, '#0e1216');
  pxf(x+6, B+9, .5, 8, '#0e1216');
  pxf(x+(f>0?9:0), B+7, 1, 11, '#1e242a');       // lit edge
  // hem fringe
  for(let i=0;i<5;i++) pxf(x+0.5+i*2, B+17.5, .5, 1.5+((i*3)%2), '#0b0e11');
  // sash and knot
  px(x+1, B+11, 8, 2, C.uhie);
  pxf(x+1, B+11, 8, .5, '#b83a3a');
  pxf(x+(f>0?6.5:2), B+11, 2, 3.5, '#7d1a1a');
  // cowrie beads at the throat
  pxf(x+3, B+6.5, 1, 1, C.bone); pxf(x+5, B+6.5, 1, 1, C.bone);
  pxf(x+4, B+5.5, 1, 1, '#c9bfa4');
  // mantle over the shoulders, raffia at its edge
  px(x-1, B+6, 12, 3, '#1d232a');
  pxf(x-1, B+6, 12, .5, '#2b333c');
  for(let i=0;i<6;i++) pxf(x-1+i*2, B+9, .5, 1+((i*5)%2), '#151a20');
  // head
  px(x+2, B, 6, 7, '#0d1014');
  // the mask: nzu-white, carved
  const mx=x+(f>0?2.5:1.5);
  maskFace(mx+2.5, B+3.6, 8.4, 9.6, {
    wood:['#f6efd8','#ded3b4','#a2967a','#5c5342'],
    socket:'#100c08', tooth:'#f4eed8',
    ichi:'rgba(60,42,26,0.55)'
  });
  ctx.globalAlpha=0; px(mx, B+1, 5, 5.5, C.bone); ctx.globalAlpha=1;
  pxf(mx, B+1, 5, .5, '#f2ead4');            // top light
  pxf(mx, B+6, 5, .5, '#8f866e');            // under shade
  pxf(mx+(f>0?4.5:0), B+1, .5, 5.5, '#a89d80');
  pxf(mx+0.5, B+2.5, 1.5, .5, '#241c14');    // brow
  pxf(mx+3, B+2.5, 1.5, .5, '#241c14');
  pxf(mx+1, B+3, 1, 1, '#12100c');           // eyes
  pxf(mx+3, B+3, 1, 1, '#12100c');
  pxf(mx+(f>0?2.5:2), B+3.5, .5, 1.5, '#a89d80');   // nose ridge
  pxf(mx+1.5, B+5, 2, .5, '#241c14');        // mouth slit
  // nine strokes of nzu across the brow
  for(let i=0;i<4;i++) pxf(mx+0.5+i*1.2, B+1.5, .5, .5, '#7d7460');
  // ochre crown mark
  px(x+2, B-1, 6, 1, C.gold);
  pxf(x+3.5, B-2, 1, 1, C.gold);
  pxf(x+2, B-1, 6, .5, '#f0c268');
  // rim light, thrown from whatever is burning nearby
  ctx.globalAlpha=.4; px(x+(f>0?-1:10), y+6+bob, 1, 11, C.goldDim); ctx.globalAlpha=1;

  // blade
  if(P.st==='atk'){
    const a=CHAIN()[Math.min(P.combo,CHAIN().length-1)], act = P.t>a.wind && P.t<=a.wind+a.act;
    const prog = clamp((P.t-a.wind)/a.act,0,1);
    if(P.t<=a.wind){
      px(x+(f>0?-2:10), y+2, 2, 8, C.chalkDim);          // wind-up: blade back
    } else if(act){
      ctx.save(); ctx.translate(x+5,y+9);
      ctx.rotate(f>0 ? -0.9+prog*2.0 : Math.PI+0.9-prog*2.0);
      ctx.strokeStyle=C.chalk; ctx.lineWidth= P.combo===2?3:2; ctx.globalAlpha=.95-prog*.5;
      ctx.beginPath(); ctx.arc(0,0, a.reach*0.8, -0.7, 0.7); ctx.stroke();
      ctx.globalAlpha=1; ctx.restore();
      px(x+(f>0?9:-1), y+6, 3, 3, C.bone);
    } else {
      px(x+(f>0?10:-2), y+10, 3, 2, C.chalkDim);          // recovery: blade low
    }
  } else if(P.st==='heavy'){
    const prog = clamp((P.t-WA().heavy.wind)/WA().heavy.act,0,1);
    if(P.t<=WA().heavy.wind){
      px(x+(f>0?-4:10), y-2, 3, 12, C.gold);
      ctx.globalAlpha=.3; ctx.fillStyle=C.gold;
      ctx.beginPath(); ctx.arc(x+5,y+9,10,0,7); ctx.fill(); ctx.globalAlpha=1;
    } else if(prog<1){
      ctx.save(); ctx.translate(x+5,y+9);
      ctx.rotate(f>0 ? -1.2+prog*2.6 : Math.PI+1.2-prog*2.6);
      ctx.strokeStyle=C.gold; ctx.lineWidth=4; ctx.globalAlpha=.95-prog*.45;
      ctx.beginPath(); ctx.arc(0,0, WA().heavy.reach*0.85, -0.85, 0.85); ctx.stroke();
      ctx.strokeStyle=C.chalk; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(0,0, WA().heavy.reach*0.85, -0.85, 0.85); ctx.stroke();
      ctx.globalAlpha=1; ctx.restore();
    } else {
      px(x+(f>0?11:-3), y+12, 4, 2, C.goldDim);
    }
  } else if(P.st==='thrust'){
    px(x+4, y+P.h-2, 3, 8, C.chalk);
    ctx.globalAlpha=.4; ctx.strokeStyle=C.gold; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+5,y+P.h); ctx.lineTo(x+5,y+P.h+10); ctx.stroke(); ctx.globalAlpha=1;
  } else if(P.st==='exec'){
    const pr=clamp(P.t/15,0,1);
    ctx.save(); ctx.translate(x+5,y+9);
    ctx.rotate(f>0? -1.4+pr*2.2 : Math.PI+1.4-pr*2.2);
    ctx.strokeStyle=P.t>15?C.uhie:C.bone; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,26,-0.6,0.6); ctx.stroke(); ctx.restore();
  } else if(P.st==='pray'){
    ctx.globalAlpha=.7; ctx.strokeStyle=C.gold; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(x+5,y+9, 6+P.t*0.7, 0, 7); ctx.stroke(); ctx.globalAlpha=1;
    glyph(x+5,y+9,5+Math.sin(G.t/5),C.gold,G.t/12);
  } else if(P.st==='slam'){
    px(x+3,y+P.h-2,4,6,C.chalk);
    ctx.globalAlpha=.5; ctx.strokeStyle=C.gold; ctx.beginPath();
    ctx.arc(x+5,y+P.h+2,10,0,Math.PI); ctx.stroke(); ctx.globalAlpha=1;
  } else if(P.st==='heal'){
    px(x+(f>0?9:-2),y+8,3,4,C.bone);
  } else {
    px(x+(f>0?9:-2), y+9, 2, 7, '#6d6553');               // sheathed staff-blade
  }
  ctx.globalAlpha=1;
}

function drawEnemy(e){
  if(e.burn>0){
    for(let i=0;i<3;i++){
      const fy=e.y-cam.y-((G.t*0.6+i*9)%14);
      ctx.globalAlpha=.55-((G.t*0.6+i*9)%14)/26;
      pxf(e.x-cam.x+2+i*(e.w/3)+Math.sin(G.t/6+i)*1.5, fy+e.h*0.4, 1, 2, i%2?'#ffcf7a':'#e8862a');
    }
    ctx.globalAlpha=1;
  }
  if(e.dead) return;
  const x=Math.round(e.x-cam.x), y=Math.round(e.y-cam.y);
  // telegraph: white can be turned, gold cannot
  if(e.tell){
    const gold = e.tell==='gold';
    ctx.globalAlpha=.35+Math.abs(Math.sin(G.t/(gold?3:4)))*.45;
    ctx.strokeStyle = gold?C.gold:C.chalk; ctx.lineWidth=1;
    ctx.strokeRect(x-2.5,y-2.5,e.w+5,e.h+5);
    if(gold){ ctx.strokeRect(x-4.5,y-4.5,e.w+9,e.h+9); }
    ctx.globalAlpha=1;
  }
  // guard broken: he is open, and he is gold
  if(e.broken>0){
    ctx.globalAlpha=.22+Math.abs(Math.sin(G.t/7))*.2;
    ctx.fillStyle=C.gold;
    ctx.beginPath(); ctx.arc(x+e.w/2,y+e.h/2, e.w+6, 0, 7); ctx.fill();
    ctx.globalAlpha=1;
    if(G.t%30<18){ ctx.font='7px ui-sans-serif,system-ui'; ctx.fillStyle=C.gold;
      ctx.textAlign='center'; ctx.fillText('Z', x+e.w/2, y-6); ctx.textAlign='left'; }
  } else if(e.poise < e.poiseMax*0.999){
    const w=e.w+4, fr=clamp(e.poise/e.poiseMax,0,1);
    ctx.globalAlpha=.55; px(x-2, y-5, w, 1, '#2a2a24');
    px(x-2, y-5, Math.max(1,Math.round(w*fr)), 1, fr<0.35?C.gold:C.chalkDim);
    ctx.globalAlpha=1;
  }
  const flash = e.flash>0;
  const stag = e.stagger>0;

  if(e.kind==='walker'){
    px(x,y+4,e.w,e.h-4, flash?C.chalk:'#191d19');
    px(x+1,y+e.h-4,e.w-2,4, flash?C.chalk:'#12150f');
    px(x+3,y, 8,7, flash?C.chalk:'#0e110d');
    const wm = x+(e.face>0?5:3);
    px(wm, y+1, 6,5, stag?C.chalkDim:C.bone);       // raffia mask
    pxf(wm, y+1, 6, .5, '#f0e8d2');
    pxf(wm, y+5.5, 6, .5, '#8b8268');
    pxf(wm+1, y+3, 1,1,'#1a1410'); pxf(wm+4, y+3,1,1,'#1a1410');
    pxf(wm+2.5, y+3.5, .5, 1.5, '#a29878');
    pxf(wm+1.5, y+4.5, 3, .5, '#241c14');
    for(let i=0;i<5;i++) pxf(wm-0.5+i*1.4, y-1.5, .5, 2.5, '#6b5f3f');  // raffia crown
    px(x, y+2, e.w, 1, C.uhie);
    pxf(x, y+2, e.w, .5, '#c04a4a');
    for(let i=0;i<4;i++) pxf(x+1+i*3.5, y+e.h-4, .5, 3, '#0c0f0b');
    if(e.st==='swing'&&e.t<=9){
      ctx.save(); ctx.translate(x+e.w/2,y+10); ctx.rotate(e.face>0?-0.6+e.t*0.18:Math.PI+0.6-e.t*0.18);
      ctx.strokeStyle=C.blood; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,18,-0.5,0.5); ctx.stroke(); ctx.restore();
    }
  }
  if(e.kind==='lunger'){
    px(x,y+2,e.w,e.h-2, flash?C.chalk:'#171c1a');
    px(x+(e.face>0?e.w-6:0), y, 6,6, flash?C.chalk:'#101413');
    px(x+(e.face>0?e.w-4:2), y+2, 2,2, e.st==='crouch'?C.chalk:C.blood);
    for(let i=0;i<3;i++) px(x+3+i*5, y+e.h, 2, 3, '#0f1211');
  }
  if(e.kind==='warden'){
    px(x,y+4,e.w,e.h-4, flash?C.chalk:'#1d1a18');
    px(x+2,y,e.w-4,7, flash?C.chalk:'#121110');
    px(x+(e.face>0?6:3),y+1,6,5, stag?C.chalkDim:C.bone);
    px(x, y+3, e.w, 1, C.goldDim);
    // the shield he hides behind
    const sx = e.face>0 ? x+e.w-1 : x-4;
    ctx.globalAlpha = (e.broken>0||stag)?.3:1;
    px(sx, y+3, 5, e.h-6, '#2a2018');
    pxf(sx, y+3, 5, .5, '#4a3a24');
    px(sx+(e.face>0?4:0), y+3, 1, e.h-6, C.goldDim);
    for(let i=0;i<4;i++) pxf(sx+2, y+5+i*3.5, 1, 1, C.gold);
    pxf(sx+1, y+3, .5, e.h-6, '#1a130e');
    ctx.globalAlpha=1;
    if(e.st==='chop'&&e.t<=9){
      ctx.save(); ctx.translate(x+e.w/2,y+6); ctx.rotate(e.face>0?-1.1+e.t*0.2:Math.PI+1.1-e.t*0.2);
      ctx.strokeStyle=C.blood; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,26,-0.5,0.5); ctx.stroke(); ctx.restore();
    }
  }
  if(e.kind==='chalk'){
    const sw=Math.sin(e.sway||0)*1.2;
    // raffia skirt
    for(let i=0;i<14;i++){
      const fx=x-3+i*1.8, sh=Math.sin((e.sway||0)+i*0.6)*0.9;
      pxf(fx+sh, y+16, .5, 9+((i*5)%6), i%2?'#b9ac86':'#8e8264');
    }
    // chalk body
    px(x+2+sw*0.3, y+5, e.w-4, 13, flash?'#ffffff':'#d9d1b8');
    pxf(x+2+sw*0.3, y+5, e.w-4, .5, '#f6f0dc');
    pxf(x+2+sw*0.3, y+17, e.w-4, .5, '#9a917a');
    // nine bands of nzu
    for(let i=0;i<4;i++) pxf(x+3, y+7+i*2.5, e.w-6, .5, '#8e8567');
    // tall carved head
    px(x+4+sw*0.4, y-6, 12, 12, flash?'#ffffff':'#e8e0c6');
    pxf(x+4+sw*0.4, y-6, 12, .5, '#fdf7e4');
    pxf(x+4+sw*0.4, y+5.5, 12, .5, '#a29a80');
    pxf(x+6+sw*0.4, y-3, 3, .5, '#2a2318'); pxf(x+11+sw*0.4, y-3, 3, .5, '#2a2318');
    px(x+6.5+sw*0.4, y-2, 2, 2, '#141009'); px(x+11.5+sw*0.4, y-2, 2, 2, '#141009');
    pxf(x+9.5+sw*0.4, y-2, .5, 4, '#b4ab8e');
    pxf(x+7+sw*0.4, y+2.5, 6, .5, '#2a2318');
    // crest
    px(x+8+sw*0.4, y-11, 4, 5, C.uhie);
    pxf(x+9+sw*0.4, y-13, 2, 2, C.gold);
    if(e.live){ ctx.globalAlpha=.3; ctx.fillStyle=C.uhie;
      ctx.beginPath(); ctx.arc(x+e.w/2,y+8,e.w,0,7); ctx.fill(); ctx.globalAlpha=1; }
    if(e.st==='cut'&&e.t<=10){
      ctx.save(); ctx.translate(x+e.w/2,y+8); ctx.rotate(e.face>0?-1.0+e.t*0.19:Math.PI+1.0-e.t*0.19);
      ctx.strokeStyle=C.bone; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(0,0,28,-0.5,0.5); ctx.stroke();
      ctx.restore();
    }
  }
  if(e.kind==='roller'){
    ctx.save(); ctx.translate(x+e.w/2, y+e.h/2);
    if(e.st==='roll') ctx.rotate(e.spin||0);
    skullShape(0,0, e.w*0.52, {
      bone: flash?['#ffffff','#e8e0c8','#b0a68a']:['#ded3b2','#a89c7e','#655c47'],
      eye: e.st==='rise'||e.st==='bite' ? '#e5414a' : null
    });
    ctx.restore();
    if(e.st==='rise'||e.st==='bite'){
      ctx.globalAlpha=.25; ctx.fillStyle=C.uhie;
      ctx.beginPath(); ctx.arc(x+e.w/2,y+e.h/2, e.w*0.9,0,7); ctx.fill(); ctx.globalAlpha=1;
    }
  }
  if(e.kind==='ember'){
    const pulse=0.75+Math.sin(G.t/6+e.x)*0.25, hot=e.st==='gather'||e.st==='dive';
    ctx.globalAlpha=.16*pulse; ctx.fillStyle=hot?'#ffb347':'#d8922e';
    ctx.beginPath(); ctx.arc(x+e.w/2,y+e.h/2, 15+pulse*4, 0, 7); ctx.fill();
    ctx.globalAlpha=1;
    // a knot of fire with a small skull inside it
    const g2=ctx.createRadialGradient(x+e.w/2,y+e.h/2,0,x+e.w/2,y+e.h/2,e.w*0.8);
    g2.addColorStop(0,'#fff0c0'); g2.addColorStop(.35,hot?'#ffb347':'#e8862a');
    g2.addColorStop(.75,'#a03a12'); g2.addColorStop(1,'rgba(60,16,6,0)');
    ctx.fillStyle=g2;
    ctx.beginPath(); ctx.arc(x+e.w/2,y+e.h/2, e.w*0.8, 0, 7); ctx.fill();
    px(x+3.5,y+3.5,5,4.5, flash?'#ffffff':'#2a1008');
    pxf(x+4.5,y+5,1,1.5,'#ffe9a8'); pxf(x+6.5,y+5,1,1.5,'#ffe9a8');
    for(let i=0;i<4;i++){
      const fy=y-2-((G.t/2+i*7)%12);
      ctx.globalAlpha=.6-((G.t/2+i*7)%12)/22;
      pxf(x+3+i*2+Math.sin(G.t/7+i)*1.5, fy, 1, 1.5, i%2?'#ffcf7a':'#e8862a');
    }
    ctx.globalAlpha=1;
  }

  if(e.kind==='crawler'){
    const gait=Math.sin(G.t/4+e.x)*1.2;
    // low slung body
    ctx.fillStyle = flash?C.chalk:'#1b1a20';
    ctx.beginPath(); ctx.ellipse(x+e.w/2, y+e.h*0.6, e.w*0.55, e.h*0.5, 0,0,7); ctx.fill();
    pxf(x+2, y+2.5, e.w-4, .6, '#33313c');
    // legs
    ctx.strokeStyle='#0d0c11'; ctx.lineWidth=1;
    for(let i=0;i<4;i++){
      const lx=x+3+i*3.4, ph=gait*(i%2?1:-1);
      ctx.beginPath(); ctx.moveTo(lx, y+e.h*0.7);
      ctx.lineTo(lx-2+ph, y+e.h+3); ctx.stroke();
    }
    // head end, teeth
    const hx2 = e.face>0 ? x+e.w-4 : x;
    px(hx2, y+3, 5, 6, flash?C.chalk:'#26242c');
    pxf(hx2+(e.face>0?3.5:0), y+5, 1, 1, C.uhie);
    if(e.st==='bite'||e.st==='bite2'){
      for(let i=0;i<4;i++) pxf(hx2+(e.face>0?4:-1), y+4+i*1.5, 1.5, 1, C.bone);
    }
  }

  if(e.kind==='effigy'){
    // a carved post that watches; its eyes are cowries
    px(x+2, y+4, e.w-4, e.h-4, flash?C.chalk:'#241c14');
    pxf(x+2, y+4, e.w-4, .6, '#3d3020');
    pxf(x+e.w-3, y+4, .6, e.h-4, '#100c08');
    for(let i=0;i<4;i++) pxf(x+3, y+9+i*3.5, e.w-6, .6, '#150f0a');
    maskFace(x+e.w/2, y+9, e.w-3, 11, {
      wood:['#6a5334','#4c3b23','#33271a','#1c1610'],
      eye: e.st==='wake'||e.st==='volley' ? '#ffd27a' : '#cfc6ad',
      chalk:true
    });
    hornPair(x+e.w/2, y+3, 4, {col:['#4a3a22','#1a1209']});
    if(e.broken>0){ ctx.globalAlpha=.4; px(x+2,y+4,e.w-4,e.h-4,C.gold); ctx.globalAlpha=1; }
    if(e.st==='wake'||e.st==='volley'){
      ctx.globalAlpha=.14+Math.sin(G.t/5)*.06; ctx.fillStyle='#ffd27a';
      ctx.beginPath(); ctx.arc(x+e.w/2, y+9, 20, 0, 7); ctx.fill(); ctx.globalAlpha=1;
    }
  }

  if(e.kind==='horned'){
    const hy=y+e.h*0.42;
    px(x+1, y+8, e.w-2, e.h-8, flash?C.chalk:'#211a16');
    pxf(x+1, y+8, e.w-2, .6, '#3a2e26');
    for(let i=0;i<5;i++) pxf(x+2+i*4, y+e.h-6, .6, 5, '#0d0a08');
    // shoulders of hide
    px(x-1, y+7, e.w+2, 4, flash?C.chalkDim:'#2b211a');
    hornPair(x+e.w/2, y+6, e.w*0.30, {col: flash?['#ffffff','#cbbfa4']:['#3a2c1e','#0e0a07']});
    maskFace(x+e.w/2, y+5, e.w*0.62, e.h*0.42, {
      wood: flash?['#ffffff','#efe6cc','#b6ab8e','#6a6150']:['#8e7a58','#6b5942','#43382a','#221c15'],
      socket:'#0a0705',
      eye: (e.st==='lower'||e.st==='charge') ? '#ff7a3a' : '#c2402c',
      ichi:'rgba(0,0,0,0.55)'
    });
    if(e.st==='charge'){
      ctx.globalAlpha=.4;
      for(let i=1;i<5;i++) pxf(x-e.face*i*4, y+8, 3, e.h-10, '#1a1210');
      ctx.globalAlpha=1;
    }
  }
  if(e.kind==='thrower'){
    px(x+2,y+6,8,e.h-6, flash?C.chalk:'#1a1a20');
    px(x+2,y,8,7, flash?C.chalk:'#0f0f14');
    px(x+(e.face>0?4:3),y+1,5,4,C.bone);
    px(x+(e.face>0?10:-2), y+8, 4,4, C.gold);
    ctx.globalAlpha=.4; ctx.fillStyle=C.gold;
    ctx.beginPath(); ctx.arc(x+(e.face>0?12:0), y+10, 7,0,7); ctx.fill(); ctx.globalAlpha=1;
  }
}

function drawEkwensu(b){
  const x=b.x-cam.x, y=b.y-cam.y, flash=b.flash>0;
  ctx.globalAlpha=.34; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(x+b.w/2, y+b.h, b.w*.7, 4, 0,0,7); ctx.fill(); ctx.globalAlpha=1;
  // body: hide and iron
  px(x+2, y+14, b.w-4, b.h-14, flash?C.chalk:'#241a16');
  pxf(x+2, y+14, b.w-4, .6, '#40302a');
  for(let i=0;i<7;i++) pxf(x+3+i*4, y+b.h-9, .6, 8, '#0e0a08');
  px(x-2, y+12, b.w+4, 6, flash?C.chalkDim:'#301f1a');
  // arms
  px(x-4, y+18, 6, 16, '#1d1512'); px(x+b.w-2, y+18, 6, 16, '#1d1512');
  // an iron blade in the right hand
  const sw = (b.st==='cleave1'||b.st==='cleave2') ? clamp((b.t-2)/9,0,1) : 0;
  ctx.save(); ctx.translate(x+b.w/2, y+22);
  ctx.rotate(b.face>0 ? -1.5+sw*2.6 : Math.PI+1.5-sw*2.6);
  const gg=ctx.createLinearGradient(0,-3,40,3);
  gg.addColorStop(0,'#6b6357'); gg.addColorStop(.5,'#bdb4a2'); gg.addColorStop(1,'#4a4238');
  ctx.fillStyle=gg; ctx.fillRect(6,-2.2,36,4.4);
  ctx.fillStyle='#2a2018'; ctx.fillRect(0,-3.2,7,6.4);
  ctx.restore();
  hornPair(x+b.w/2, y+8, b.w*0.34, {col: flash?['#ffffff','#d8ccae']:['#4a3524','#120c07']});
  maskFace(x+b.w/2, y+8, b.w*0.66, b.h*0.34, {
    wood: flash?['#ffffff','#f0e7cd','#b8ad90','#6c6352']:['#7e2f24','#5a2119','#341410','#190a08'],
    socket:'#080404', eye:'#ff8a2a', tooth:'#efe4c8', ichi:'rgba(0,0,0,0.6)'
  });
  if(b.phase===2){
    ctx.globalAlpha=.20+Math.sin(G.t/9)*.08; ctx.fillStyle=C.uhie;
    ctx.beginPath(); ctx.arc(x+b.w/2,y+b.h/2,b.w*1.1,0,7); ctx.fill(); ctx.globalAlpha=1;
  }
  bossTell(b,x,y);
  bossBar(b,'EKWENSU','he who was paid');
}
function drawOnwe(b){
  const x=b.x-cam.x, y=b.y-cam.y, flash=b.flash>0;
  ctx.globalAlpha=.30; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(x+b.w/2, y+b.h, b.w*.7, 3.5, 0,0,7); ctx.fill(); ctx.globalAlpha=1;
  // it is built exactly like you, in the wrong colours
  ctx.globalAlpha=.92;
  px(x+1.5, y+13, 3, 4, '#0a0c14'); px(x+b.w-4.5, y+13, 3, 4, '#0a0c14');
  px(x, y+7, b.w, 12, flash?C.chalk:'#12142a');
  pxf(x, y+7, b.w, .6, '#232a4c');
  for(let i=0;i<5;i++) pxf(x+1+i*3.6, y+18.5, .6, 2, '#080a14');
  px(x+1, y+11, b.w-2, 2, '#3a2a6a');
  px(x-1, y+6, b.w+2, 3, '#1b1e3a');
  ctx.globalAlpha=1;
  maskFace(x+b.w/2, y+3.6, b.w*0.62, b.h*0.34, {
    wood: flash?['#ffffff','#e8e2ff','#a8a2c8','#5c5880']:['#cfd4f0','#a6abd0','#6b6f96','#33364e'],
    socket:'#05060c', eye:'#8fe6ff', tooth:'#e8ecff', ichi:'rgba(20,24,50,0.6)'
  });
  // it drags a copy of itself half a second behind
  if(b.st==='mirror'||b.st==='mirrorWind'){
    ctx.globalAlpha=.22;
    px(x-b.face*7, y+7, b.w, 12, C.glass);
    ctx.globalAlpha=1;
  }
  const sw=(b.st==='chain1'||b.st==='chain2'||b.st==='chain3')?clamp((b.t-1)/8,0,1):0;
  if(sw>0){
    ctx.save(); ctx.translate(x+b.w/2,y+14);
    ctx.rotate(b.face>0?-1.3+sw*2.4:Math.PI+1.3-sw*2.4);
    ctx.strokeStyle=C.glass; ctx.lineWidth=2.4; ctx.globalAlpha=.9-sw*.4;
    ctx.beginPath(); ctx.arc(0,0,30,-0.7,0.7); ctx.stroke();
    ctx.globalAlpha=1; ctx.restore();
  }
  if(b.st==='reach' && b.t>14 && b.reachX!=null){
    const rx=b.reachX-cam.x, ry=P.y-cam.y;
    ctx.globalAlpha=.9; ctx.fillStyle='#12142a';
    ctx.fillRect(rx-3, ry+P.h-2, 6, -(Math.min(b.t-14,16))*1.6);
    ctx.fillStyle=C.glass; ctx.fillRect(rx-4, ry+P.h-2-(Math.min(b.t-14,16))*1.6, 8, 3);
    ctx.globalAlpha=1;
  }
  bossTell(b,x,y);
  bossBar(b, b.phase>=3?'ONWE':'???', b.phase>=3?'yourself, kept':'the ninth child');
}
function bossTell(b,x,y){
  if(!b.tell) return;
  const gold=b.tell==='gold';
  ctx.globalAlpha=.4+Math.abs(Math.sin(G.t/(gold?3:4)))*.45;
  ctx.strokeStyle=gold?C.gold:C.chalk; ctx.lineWidth=1;
  ctx.strokeRect(x-4.5,y-4.5,b.w+9,b.h+9);
  if(gold) ctx.strokeRect(x-7.5,y-7.5,b.w+15,b.h+15);
  ctx.globalAlpha=1;
  if(b.broken>0){
    ctx.globalAlpha=.22+Math.abs(Math.sin(G.t/7))*.2; ctx.fillStyle=C.gold;
    ctx.beginPath(); ctx.arc(x+b.w/2,y+b.h/2,b.w+10,0,7); ctx.fill(); ctx.globalAlpha=1;
  }
}
function bossBar(b,name,sub){
  const w=160, bx=(W-w)/2, by=H-22;
  px(bx-1,by-1,w+2,7,'#0a0a0c');
  px(bx,by, Math.max(0,Math.round(w*b.hp/b.maxhp)), 5, C.blood);
  pxf(bx,by,Math.max(0,Math.round(w*b.hp/b.maxhp)),1,'#e5414a');
  px(bx, by+6, w, 1, '#151318');
  px(bx, by+6, Math.max(1,Math.round(w*clamp(b.poise/b.poiseMax,0,1))), 1, C.chalkDim);
  ctx.textAlign='center'; ctx.font='8px ui-sans-serif,system-ui'; ctx.fillStyle=C.bone;
  ctx.fillText(name, W/2, by-4);
  ctx.font='7px ui-serif,Georgia,serif'; ctx.fillStyle=C.chalkDim;
  ctx.fillText(sub, W/2, by-13);
  if(b.lineT>0 && b.line){
    ctx.globalAlpha=Math.min(1,b.lineT/30);
    ctx.font='9px ui-serif,Georgia,serif'; ctx.fillStyle=C.bone;
    ctx.fillText(b.line, W/2, 42); ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}
function drawBoss(b){
  if(b.who==='ekwensu'){ drawEkwensu(b); return; }
  if(b.who==='onwe'){ drawOnwe(b); return; }
  if(b.dead) return;
  const x=Math.round(b.x-cam.x), y=Math.round(b.y-cam.y);
  const bound = b.bound>0;
  ctx.globalAlpha = bound ? 1 : 0.34 + Math.sin(G.t/20)*0.06;

  // shroud
  ctx.fillStyle = bound ? '#12101a' : '#0b0c12';
  ctx.beginPath();
  ctx.moveTo(x+b.w/2, y-6);
  ctx.lineTo(x+b.w+6, y+b.h);
  ctx.lineTo(x-6, y+b.h);
  ctx.closePath(); ctx.fill();
  if(b.flash>0){ ctx.fillStyle=C.chalk; ctx.fill(); }

  // eyes — nine of them
  ctx.globalAlpha = bound?1:0.75;
  for(let i=0;i<9;i++){
    const ex = x+5 + ((i*7+ i*i*3)%(b.w-8));
    const ey = y+6 + ((i*11)%18);
    const blink = ((G.t+i*17)%160)<8;
    if(!blink) px(ex,ey,1,1, b.phase===2?C.blood:C.gold);
  }
  // chalk bindings when named
  if(bound){
    ctx.globalAlpha=.85; ctx.strokeStyle=C.chalk; ctx.lineWidth=1;
    for(let i=0;i<3;i++){
      const yy = y+10+i*12;
      ctx.beginPath(); ctx.moveTo(x-4,yy); ctx.lineTo(x+b.w+4,yy-3); ctx.stroke();
    }
    glyph(x+b.w/2, y+b.h/2, 7, C.gold, G.t/40);
  }
  // raffia fringe along the hem
  ctx.globalAlpha = bound?.9:.45;
  for(let i=0;i<16;i++){
    const fx=x-5+i*2.4, sw=Math.sin(G.t/11+i)*0.8;
    pxf(fx+sw, y+b.h-7, .5, 5+((i*7)%5), bound?'#3a2f1e':'#141419');
  }
  // mask
  ctx.globalAlpha = bound?1:0.5;
  const bmx=x+(b.face>0?9:5);
  maskFace(bmx+6, y+9, 13.5, 12.5, {
    wood: bound?['#f4ecd6','#d6caa8','#94886c','#4e4636']:['#5a5648','#43402f','#2a2820','#16150f'],
    socket:'#0a0806', eye: bound?null:'#a01c2c', tooth: bound?'#efe8d2':'#8a8270',
    ichi:'rgba(30,20,12,0.6)'
  });
  ctx.globalAlpha=0; px(bmx, y+4, 12, 10, bound?C.bone:'#4a4638');
  pxf(bmx, y+4, 12, .5, bound?'#f4ecd6':'#5a5646');
  pxf(bmx, y+13.5, 12, .5, '#6e6551');
  pxf(bmx+(b.face>0?11.5:0), y+4, .5, 10, '#8c8368');
  pxf(bmx+1.5, y+6.5, 3.5, .5, '#120e0c');       // carved brows
  pxf(bmx+7, y+6.5, 3.5, .5, '#120e0c');
  px(bmx+2, y+8, 2,1,'#120e0c'); px(bmx+7, y+8, 2,1,'#120e0c');
  pxf(bmx+5.5, y+8, .5, 3, '#9a9078');
  px(bmx+2, y+12, 7,1,'#120e0c');
  for(let i=0;i<6;i++) pxf(bmx+1+i*1.8, y+11, .5, .5, '#3a3226');
  // nine scars of chalk down the chest
  if(bound){ ctx.globalAlpha=.5;
    for(let i=0;i<9;i++) pxf(x+4+((i*5)%18), y+18+((i*7)%16), .5, 2, C.chalkDim); }

  // attack tells
  if(b.tell){
    const gold = b.tell==='gold';
    ctx.globalAlpha=.4+Math.abs(Math.sin(G.t/(gold?3:4)))*.45;
    ctx.strokeStyle=gold?C.gold:C.chalk; ctx.lineWidth=1;
    ctx.strokeRect(x-4.5,y-4.5,b.w+9,b.h+9);
    if(gold) ctx.strokeRect(x-7.5,y-7.5,b.w+15,b.h+15);
  }
  if(b.broken>0){
    ctx.globalAlpha=.22+Math.abs(Math.sin(G.t/7))*.2; ctx.fillStyle=C.gold;
    ctx.beginPath(); ctx.arc(x+b.w/2,y+b.h/2,b.w+10,0,7); ctx.fill(); ctx.globalAlpha=1;
    if(G.t%30<18){ ctx.font='8px ui-sans-serif,system-ui'; ctx.fillStyle=C.gold;
      ctx.textAlign='center'; ctx.fillText('Z', x+b.w/2, y-8); ctx.textAlign='left'; }
  }
  if(b.st==='slash1'||b.st==='slash2'){
    ctx.globalAlpha=.9; ctx.strokeStyle=C.blood; ctx.lineWidth=3;
    ctx.save(); ctx.translate(x+b.w/2,y+20);

    px(bx, by+6, w, 1, '#151318');

function drawShots(){
  for(const s of shots){
    const x=s.x-cam.x, y=s.y-cam.y;
    ctx.globalAlpha=.35; ctx.fillStyle=s.wave?C.earthLit:C.gold;
    ctx.beginPath(); ctx.arc(x+3,y+3, s.wave?9:7,0,7); ctx.fill(); ctx.globalAlpha=1;
    px(x,y, s.w, s.h, s.wave?'#4a4436':C.gold);
    px(x+1,y+1,2,2,C.bone);
  }
}

function drawParts(){
  for(const p of parts){
    const a=Math.max(0,p.life/p.max);
    const x=p.x-cam.x, y=p.y-cam.y;
    const sp=Math.hypot(p.vx,p.vy);
    if(sp>1.4){
      ctx.globalAlpha=a*.45;
      const n=Math.min(4,(sp/1.1)|0);
      for(let i=1;i<=n;i++) pxf(x-p.vx*i*0.5, y-p.vy*i*0.5, p.sz*0.5, p.sz*0.5, p.col);
    }
    ctx.globalAlpha=a;
    px(x, y, p.sz, p.sz, p.col);
    if(a>.7 && p.sz>1) pxf(x, y, .5, .5, '#ffffff');
  }
  ctx.globalAlpha=1;
}

function drawShade(){
  if(!shade || shade.room!==G.room) return;
  shade.t=(shade.t||0)+1;
  const x=shade.x-cam.x, y=shade.y-cam.y+Math.sin(shade.t/24)*2;
  ctx.globalAlpha=.25; ctx.fillStyle=C.gold;
  ctx.beginPath(); ctx.arc(x+5,y+6,12,0,7); ctx.fill(); ctx.globalAlpha=.75;
  px(x+2,y+2,6,9,'#20242a'); px(x+3,y+3,4,3,C.bone); ctx.globalAlpha=1;
}

function wrapText(t,cx,cy,maxw,lh){
  const words=t.split(' '); let line='', lines=[];
  for(const w of words){ const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxw){ lines.push(line); line=w; } else line=test; }
  lines.push(line);
  const start = cy - (lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,cx,start+i*lh));
}

function drawVignette(){
  const g=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,W*0.62);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.72)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function render(){
  ctx.save();
  if(G.shake>0.2){ ctx.translate((rnd()-.5)*G.shake*2,(rnd()-.5)*G.shake*2); }
  drawBG(); drawTiles(); drawProps(); drawDecals(); drawShrines(); drawPickups(); drawShade(); drawShadows();
  for(const e of enemies) drawEnemy(e);
  if(boss) drawBoss(boss);
  drawShots(); drawPlayer(); drawParts();
  drawAmbient(true);
  drawForeground();
  drawLights();
  ctx.restore();
  drawVignette(); drawGrain(); drawTutorial();
  if(G.flash>0){ ctx.globalAlpha=G.flash/22; ctx.fillStyle=C.chalk; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(G.fade>0){ ctx.globalAlpha=G.fade; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  drawHUD();
}

const TITLE={sel:0, page:0};
function titleOpts(){ return (hasSave() ? ['continue','new'] : ['new']).concat(['speedrun','codex','controls']); }
function titleUpdate(){
  const o=titleOpts();
  if(tap('ArrowUp')||tap('KeyW')){ TITLE.sel=(TITLE.sel-1+o.length)%o.length; tone(540,.05,'square',.02); }
  if(tap('ArrowDown')||tap('KeyS')){ TITLE.sel=(TITLE.sel+1)%o.length; tone(540,.05,'square',.02); }
  if(tap('KeyX')&&TITLE.page){ TITLE.page=0; return; }
  if(tap('KeyZ')||tap('Enter')||tap('Space')){
    if(TITLE.page){ TITLE.page=0; return; }
    const c=o[TITLE.sel];
    if(c==='controls'){ TITLE.page=1; return; }
    if(c==='codex'){ if(hasSave()) loadGame(); openCodex('title'); return; }
    if(c==='speedrun'){ G.cheat=true; G.mode='play'; startSpeedrun(); return; }
    G.cheat=false;
    if(c==='continue'){ loadGame(); G.mode='play'; if(G.cheat) unlockAll(); startFrom(); }
    else { wipeSave(); G.mode='play'; startNew(); }
  }
}

// -- cutscenes ---------------------------------------------------------------
const CUT={beats:[],i:0,t:0,chars:0,after:null};
function playCut(beats,after){ CUT.beats=beats; CUT.i=0; CUT.t=0; CUT.chars=0; CUT.after=after||null; G.mode='cut'; }
function endCut(){ const f=CUT.after; CUT.after=null; CUT.beats=[]; G.mode='play'; if(f) f(); }
function cutUpdate(){
  const b=CUT.beats[CUT.i];
  if(!b){ endCut(); return; }
  CUT.t++;
  if(CUT.chars < b.text.length){
    if(CUT.t%2===0){
      CUT.chars++;
      const ch=b.text[CUT.chars-1];
      if(ch && ch!==' ' && CUT.chars%3===0) voiceBlip(b.voice||'narr', CUT.chars);
    }
  }
  if(tap('KeyZ')||tap('Enter')||tap('Space')){
    if(CUT.chars<b.text.length) CUT.chars=b.text.length;
    else { CUT.i++; CUT.chars=0; CUT.t=0; if(CUT.i>=CUT.beats.length) endCut(); }
  }
  if(tap('KeyX')) endCut();
}

function cutArt(name,cx,cy){

    ctx.globalAlpha=1;
    for(let i=0;i<14;i++){
      const a=(i*0.73), r=20+((i*23)%54);
      skullShape(cx+Math.cos(a)*r*1.5, cy+30-Math.abs(Math.sin(a))*r*0.4, 5+((i*5)%4),
        {bone:['#cdc2a4','#988e74','#544c3c']});
    }
    ctx.globalAlpha=.18; ctx.fillStyle=C.bone;
    ctx.beginPath(); ctx.ellipse(cx,cy+34,120,22,0,0,7); ctx.fill(); ctx.globalAlpha=1;
    return;
  }
  if(name==='horn'){
    ctx.globalAlpha=.16; ctx.fillStyle=C.uhie;
    ctx.beginPath(); ctx.arc(cx,cy,70,0,7); ctx.fill(); ctx.globalAlpha=1;
    hornPair(cx, cy-4, 26, {col:['#4a3524','#100a06']});
    maskFace(cx, cy-2, 54, 60, {wood:['#7e2f24','#5a2119','#341410','#190a08'],

  }
  if(name==='idols'){
    for(let i=0;i<7;i++){
      const ix=cx-140+i*46, sc=9+((i*3)%4);
      idolStatue(ix, cy+40, sc, {eye:'#8fe6ff', chalk:i%2===0});
    }
    ctx.globalAlpha=.10; ctx.fillStyle=C.glass;
    ctx.beginPath(); ctx.ellipse(cx,cy+10,150,60,0,0,7); ctx.fill(); ctx.globalAlpha=1;

  }
  if(name==='twin'){

function openRiddle(m){
  if(!m || !RIDDLES.length) return;              // never open a riddle with no mirror behind it

  RID.idx = G.riddleIdx % RIDDLES.length;
  G.riddleIdx++;
  RID.sel=0; RID.mirror=m; RID.wrong=0;
  G.mode='riddle';
  voiceBlip('mirror',7); tone(660,.3,'sine',.04,990);
}
function riddleUpdate(){
  const r=RIDDLES[RID.idx];
  // a riddle with nothing behind it is an authoring bug, not a player state —
  // hand control back rather than working with undefined
  if(!r || !RID.mirror){ G.mode='play'; return; }
  if(RID.wrong>0){
    RID.wrong--;
    if(RID.wrong===0){
      G.mode='play';
      G.mirrorLock[RID.mirror.id]=true;
      say("The glass goes black. Walk away from this room and come back to it.",190);

  if(tap('ArrowUp')||tap('KeyW')){ RID.sel=(RID.sel+2)%3; tone(520,.05,'square',.02); }
  if(tap('ArrowDown')||tap('KeyS')){ RID.sel=(RID.sel+1)%3; tone(520,.05,'square',.02); }
  if(tap('KeyX')){ G.mode='play'; return; }
  if(tap('KeyZ')||tap('Enter')){
    if(RID.sel===r.c){
      G.mirrors[RID.mirror.id]=true;
      G.mode='play';
      S.name(); G.flash=12;

      RID.wrong=60; S.wrong?S.wrong():tone(120,.4,'sawtooth',.06,60);
