<style>

  html,body{height:100%;background:#07090a;overflow:hidden;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:#e8e2d0}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;
    box-shadow:0 0 0 1px #2a2620,0 0 60px rgba(0,0,0,.9);touch-action:none;outline:none}
  canvas:focus-visible{box-shadow:0 0 0 2px #c8952e,0 0 60px rgba(0,0,0,.9)}
  #touch{position:fixed;inset:0;display:none;pointer-events:none;z-index:5;
    font-family:ui-sans-serif,system-ui,sans-serif}
  #touch.on{display:block}
  .tb{position:absolute;pointer-events:auto;border-radius:50%;
    border:1px solid rgba(232,226,208,.22);background:rgba(10,13,12,.42);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
    color:#e8e2d0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;touch-action:none;line-height:1}
  .tb:active{background:rgba(200,149,46,.42);border-color:rgba(200,149,46,.7)}
  .tb .n{font-size:9px;font-weight:600;letter-spacing:.02em}
  .tb .k{font-size:7px;color:#c8952e;margin-top:2px;font-weight:700}
  .act{width:46px;height:46px}
  .act .n{font-size:9px}
  .mini{width:36px;height:36px;border-color:rgba(232,226,208,.16)}
  .mini .n{font-size:7px}
  .mini .k{font-size:6px;margin-top:1px}
  #menuBtn{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:9px;
    pointer-events:auto;border:1px solid rgba(232,226,208,.22);background:rgba(10,13,12,.45);
    color:#e8e2d0;display:flex;align-items:center;justify-content:center;font-size:15px;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #menuBtn:active{background:rgba(200,149,46,.4)}
  #stickZone{position:absolute;left:0;bottom:0;width:44%;height:38%;pointer-events:auto;
    touch-action:none;border-top-right-radius:28px}
  #stickZone::after{content:'';position:absolute;left:22px;bottom:22px;width:96px;height:96px;
    border-radius:50%;border:1px dashed rgba(232,226,208,.10);pointer-events:none}
  #stickZone.live::after{opacity:0}
  #stickBase,#stickKnob{position:absolute;border-radius:50%;pointer-events:none;opacity:0;
    transition:opacity .12s}
  #stickBase{width:96px;height:96px;margin:-48px 0 0 -48px;
    border:1px solid rgba(232,226,208,.20);background:radial-gradient(circle,rgba(200,149,46,.10),rgba(0,0,0,0) 70%)}
  #stickKnob{width:44px;height:44px;margin:-22px 0 0 -22px;

// ─────────────────────────────────────────────────────────────────────────────
// Ọdịnala — a vertical slice.  Palette drawn from nzu (chalk), uhie (camwood),
// ogilisi green and night-indigo.  No external assets: everything is drawn.
// ─────────────────────────────────────────────────────────────────────────────
const cvs = document.getElementById('g');
let ctx = cvs.getContext('2d');
// buildBackLayers() swaps ctx for an offscreen context and swaps it back. If it
// throws in between, the swap-back never happens and every later frame paints
// into a discarded canvas — a black screen that looks exactly like a freeze.
// The crash guard in frame() restores from here.
const baseCtx = ctx;
ctx.imageSmoothingEnabled = false;
const W = 480, H = 270, T = 16, SC = 3;   // logical space stays 480x270; we paint it at 3x
ctx.setTransform(SC,0,0,SC,0,0);

const C = {
  night:'#0a0d0e', deep:'#111a1b', earth:'#1b1f1a', earthLit:'#2a2f24',
  moss:'#2f3b2c', chalk:'#e8e2d0', chalkDim:'#9a9483',
  gold:'#c8952e', goldDim:'#8a6620', uhie:'#8e2323', blood:'#c0392b',

const keys = {}, pressed = {};
const MENU_MODES=['title','map','pause','inv','shop','travel','riddle','cut'];
const heldFor={};
// in a menu, holding a direction should keep stepping instead of stopping dead
function menuRepeat(){
  if(MENU_MODES.indexOf(G.mode)<0){ for(const k in heldFor) heldFor[k]=0; return; }
  for(const c of ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyS','KeyA','KeyD']){
    if(keys[c]){
      heldFor[c]=(heldFor[c]||0)+1;
      if(heldFor[c]>20 && (heldFor[c]-20)%6===0) pressed[c]=true;
    } else heldFor[c]=0;
  }
}
const CODES = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyZ','KeyX','KeyC','KeyV','KeyF','KeyN','KeyG','KeyM','KeyP','KeyE','KeyK','KeyB','Tab','Escape','Space','Enter','KeyA','KeyD','KeyW','KeyS','KeyR'];
function down(c){ if(!keys[c]) pressed[c]=true; keys[c]=true; }
function up(c){ keys[c]=false; }
addEventListener('keydown',e=>{ initAudio(); if(CODES.includes(e.code)){ e.preventDefault(); down(e.code);} });
addEventListener('pointerdown', initAudio, {passive:true});
addEventListener('touchstart', initAudio, {passive:true});
addEventListener('mousedown', initAudio, {passive:true});
addEventListener('keyup',  e=>{ if(CODES.includes(e.code)){ e.preventDefault(); up(e.code);} });
cvs.addEventListener('pointerdown',(e)=>{
  cvs.focus(); initAudio();
  if(G.mode!=='play') return;
  const q=toLogical(e.clientX,e.clientY);
  for(const b of HUDBTN){
    if(q.x>=b.x && q.x<=b.x+b.w && q.y>=b.y && q.y<=b.y+b.h){ b.fn(); e.preventDefault(); return; }
  }
});
// touch
const touchbar = document.getElementById('touch');
const isTouch = matchMedia('(pointer:coarse)').matches || (typeof window!=='undefined' && 'ontouchstart' in window);
if (isTouch){
  touchbar.classList.add('on');
  touchbar.querySelectorAll('.tb').forEach(b=>{
    const k=b.dataset.k;
    b.addEventListener('pointerdown',e=>{e.preventDefault(); initAudio(); down(k);});
    b.addEventListener('pointerup',  e=>{e.preventDefault(); up(k);});
    b.addEventListener('pointercancel',()=>up(k));
    b.addEventListener('pointerleave',()=>up(k));
  });
  const mb=document.getElementById('menuBtn');
  mb.addEventListener('pointerdown',e=>{e.preventDefault(); initAudio(); down('Escape');});
  mb.addEventListener('pointerup',  e=>{e.preventDefault(); up('Escape');});

  // ---- floating joystick ----
  const zone=document.getElementById('stickZone'),
        base=document.getElementById('stickBase'),
        knob=document.getElementById('stickKnob');
  let sid=null, ox=0, oy=0;
  const DIRS=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
  function clearDirs(){ DIRS.forEach(d=>up(d)); }
  function place(el,x,y){ el.style.left=x+'px'; el.style.top=y+'px'; }
  let lastDir='';
  function setFrom(dx,dy){
    const menu = MENU_MODES.indexOf(G.mode)>=0;
    const dead = menu ? 7 : 9;
    const r=Math.hypot(dx,dy);
    const ang=Math.atan2(dy,dx);
    const cl=Math.min(r,34);
    place(knob, ox+Math.cos(ang)*cl, oy+Math.sin(ang)*cl);

    if(r<dead){ if(lastDir){ clearDirs(); lastDir=''; } return; }

    if(menu){
      // one direction at a time: picking things should never be a wrestling match
      const d = Math.abs(dx)>Math.abs(dy)
        ? (dx>0?'ArrowRight':'ArrowLeft')
        : (dy>0?'ArrowDown':'ArrowUp');
      if(d!==lastDir){ clearDirs(); down(d); lastDir=d; }
      return;
    }

    // in play: walking is the priority, crouch/look only on a deliberate push
    clearDirs(); lastDir='xy';
    if(Math.abs(dx)>dead*0.55) down(dx>0?'ArrowRight':'ArrowLeft');
    if(Math.abs(dy)>dead*1.6 && Math.abs(dy)>Math.abs(dx)*1.1) down(dy>0?'ArrowDown':'ArrowUp');
  }
  zone.addEventListener('pointerdown',e=>{
    e.preventDefault(); initAudio();
    sid=e.pointerId; zone.setPointerCapture(sid);
    const r=zone.getBoundingClientRect();
    ox=e.clientX-r.left; oy=e.clientY-r.top;
    place(base,ox,oy); place(knob,ox,oy);
    zone.classList.add('live'); lastDir='';
  });
  zone.addEventListener('pointermove',e=>{
    if(e.pointerId!==sid) return;
    e.preventDefault();
    const r=zone.getBoundingClientRect();
    setFrom(e.clientX-r.left-ox, e.clientY-r.top-oy);
  });
  const endStick=e=>{
    if(sid===null || (e && e.pointerId!==sid)) return;
    sid=null; clearDirs(); lastDir=''; zone.classList.remove('live');
  };
  zone.addEventListener('pointerup',endStick);
  zone.addEventListener('pointercancel',endStick);
  zone.addEventListener('lostpointercapture',endStick);
}
const LEFT =()=>keys.ArrowLeft||keys.KeyA, RIGHT=()=>keys.ArrowRight||keys.KeyD;
const DOWNK=()=>keys.ArrowDown||keys.KeyS, UPK  =()=>keys.ArrowUp||keys.KeyW;
function tap(c){ if(pressed[c]){ pressed[c]=false; return true;} return false; }

function fit(){
  const s = Math.min(innerWidth/W, innerHeight/H);
  cvs.style.width = Math.floor(W*s)+'px'; cvs.style.height = Math.floor(H*s)+'px';
}
// canvas pixel -> logical 480x270 point
function toLogical(clientX, clientY){
  const r = cvs.getBoundingClientRect();
  return { x:(clientX-r.left)/r.width*W, y:(clientY-r.top)/r.height*H };
}
addEventListener('resize',fit); fit();

// normalise + index
for (const r of ROOMS){
  r.w = Math.max(...r.map.map(s=>s.length));
  r.map = r.map.map(s=>s.padEnd(r.w,'#'));
  r.h = r.map.length;
  r.broken = {};           // cracked tiles that have been smashed
  r.taken  = false;        // heart shard collected
}

const SOLID = ch => ch==='#' || ch==='c';
function tileAt(r,tx,ty){
  if (tx<0||ty<0||tx>=r.w||ty>=r.h) return '#';
  if (r.broken[tx+','+ty]) return '.';
  return r.map[ty][tx];
}

const SAVEKEY_RUN='odinala.speedrun.v1';
function slot(){ return G.cheat ? SAVEKEY_RUN : SAVEKEY; }
let memSave={}, saveWarned=false;
function store(k,v){
  try{ if(typeof localStorage!=='undefined'){ localStorage.setItem(k,v); return 'disk'; } }catch(e){}
  memSave[k]=v; return 'memory';
}
function load(k){
  try{ if(typeof localStorage!=='undefined'){ const v=localStorage.getItem(k); if(v!=null) return v; } }catch(e){}
  return (k in memSave) ? memSave[k] : null;
}
function saveGame(){
  const d={ v:1, knowsName:G.knowsName, hasSlam:G.hasSlam, bossDead:G.bossDead,
    slain:G.slain, seen:G.seen, deaths:G.deaths, ending:G.ending, playT:G.playT,
    maxHP:G.maxHP, cowries:P.cowries, checkpoint:G.checkpoint, visited:G.visited,
    mirrors:G.mirrors, spells:G.spells, skills:G.skills, equipped:G.equipped,
    storyDone:G.storyDone, tutDone:G.tutDone, cheat:G.cheat, taken:ROOMS.map(r=>!!r.taken), taught:G.taught };
  const where=store(slot(), JSON.stringify(d));
  G.note = where==='disk' ? 'Saved.' : 'Saved for this session only.';
  G.noteT=110;
  return where;
}
function hasSave(){ return !!load(SAVEKEY); }
function hasRunSave(){ return !!load(SAVEKEY_RUN); }
function loadGame(){
  const raw=load(slot()); if(!raw) return false;
  let d; try{ d=JSON.parse(raw); }catch(e){ return false; }
  G.knowsName=!!d.knowsName; G.hasSlam=!!d.hasSlam; G.bossDead=!!d.bossDead;
  G.slain=d.slain||{}; G.seen=d.seen||{}; G.deaths=d.deaths||0; G.ending=d.ending||0; G.playT=d.playT||0;
  if(G.bossDead) G.slain.ogbunabali=1;
  G.maxHP=d.maxHP||100; G.checkpoint=d.checkpoint||{room:0,tx:9,ty:16};
  G.visited=d.visited||{}; G.mirrors=d.mirrors||{}; G.storyDone=!!d.storyDone; G.tutDone=!!d.tutDone;
  G.spells=Object.assign(G.spells,d.spells||{}); G.skills=Object.assign(G.skills,d.skills||{});
  G.equipped=d.equipped||'amadioha'; G.taught=d.taught||{};
  if(d.taken) d.taken.forEach((t,i)=>{ if(ROOMS[i]) ROOMS[i].taken=t; });
  P.cowries=d.cowries||0;
  return true;
}
function wipeSave(){ try{ if(typeof localStorage!=='undefined') localStorage.removeItem(slot()); }catch(e){} delete memSave[slot()]; }

function spawnRoom(){
  enemies=[]; shrines=[]; pickups=[]; boss=null; shots.length=0; parts.length=0;
  for(let y=0;y<R.h;y++) for(let x=0;x<R.w;x++){
    const ch = R.map[y][x];
    if(ch==='w') enemies.push(mkWalker(x,y));
    if(ch==='l') enemies.push(mkLunger(x,y));
    if(ch==='t') enemies.push(mkThrower(x,y));
    if(ch==='W') enemies.push(mkWarden(x,y));
    if(ch==='r') enemies.push(mkRoller(x,y));
    if(ch==='v') enemies.push(mkHorned(x,y));
    if(ch==='a') enemies.push(mkEmber(x,y));
    if(ch==='k') enemies.push(mkCrawler(x,y));
    if(ch==='i') enemies.push(mkEffigy(x,y));
    if(ch==='F' && !G.weapons.oku) pickups.push({kind:'weapon', w:'oku', x:x*T+2, y:y*T+4, t:0});
    if(ch==='S') shrines.push({x:x*T,y:y*T+10,w:16,h:22,kind:'rest'});
    if(ch==='N') shrines.push({x:x*T,y:y*T+10,w:16,h:22,kind:'name'});
    if(ch==='h' && !R.taken) pickups.push({x:x*T+4,y:y*T+4,w:8,h:8,kind:'heart',t:0});
    if(ch==='M') shrines.push({x:x*T,y:y*T+8,w:16,h:24,kind:'mirror',id:G.room});
    if(ch==='K' && !G.tutDone) enemies.push(mkChalk(x,y));
    if(ch==='B' && !G.slain.ogbunabali) boss = mkBoss(x,y,'ogbunabali');
    if(ch==='X' && !G.slain.ekwensu)     boss = mkBoss(x,y,'ekwensu');
    if(ch==='O' && !G.slain.onwe)        boss = mkBoss(x,y,'onwe');
  }
  seedAmbient();
  G.visited[G.room]=1;
  G.mirrorLock[G.room]=false;
  musicForRoom();
}

// ── collision ────────────────────────────────────────────────────────────────
function solidAt(px,py,ent,axis){
  const tx=Math.floor(px/T), ty=Math.floor(py/T), ch=tileAt(R,tx,ty);
  if(SOLID(ch)) return true;
  if(ch==='-' && axis==='y'){ // one-way: catches you only on the way down
    if(ent && ent.vy>0 && !(ent===P && DOWNK())){
      const feetPrev = ent.y+ent.h;
      if(feetPrev <= ty*T+3) return true;
    }
  }
  return false;
}
function hitsSolid(ent,x,y,axis){
  const pts=[[x+1,y+1],[x+ent.w-1,y+1],[x+1,y+ent.h-1],[x+ent.w-1,y+ent.h-1],
             [x+ent.w/2,y+1],[x+ent.w/2,y+ent.h-1],[x+1,y+ent.h/2],[x+ent.w-1,y+ent.h/2]];
  for(const p of pts) if(solidAt(p[0],p[1],ent,axis)) return true;
  return false;
}
function moveEnt(e){
  let n=Math.ceil(Math.max(Math.abs(e.vx),Math.abs(e.vy))/3)||1;
  const sx=e.vx/n, sy=e.vy/n;
  e.onGround=false;
  for(let i=0;i<n;i++){
    if(!hitsSolid(e,e.x+sx,e.y,'x')) e.x+=sx; else { e.vx=0; }
    if(!hitsSolid(e,e.x,e.y+sy,'y')) e.y+=sy;
    else { if(e.vy>0) e.onGround=true; e.vy=0; }
  }
  e.x = clamp(e.x, 0, R.w*T-e.w);
}

// -- the last line against a soft-lock ---------------------------------------
// Overlapping rock is asked about, not passed through: one-way platforms are
// deliberately excluded, because resting on one is normal and is not stuck.
function insideSolid(x,y){
  const pts=[[x+1,y+1],[x+P.w-1,y+1],[x+1,y+P.h-1],[x+P.w-1,y+P.h-1],
             [x+P.w/2,y+P.h/2]];
  for(const p of pts) if(SOLID(tileAt(R,Math.floor(p[0]/T),Math.floor(p[1]/T)))) return true;
  return false;
}
// Nothing should ever put the player inside geometry. A bad exit landing did
// once, and a player who cannot move in any direction has lost their run — it
// reads as a freeze, not a bug, so they do not even know to reload. Push out
// along the shortest axis, preferring up; if three tiles of searching finds
// nothing, put them back at the last charm. Silent either way: this is a net,
// not a feature, and the player should never learn it exists.
function unstickPlayer(){
  if(!insideSolid(P.x,P.y)) return false;
  for(let d=2; d<=T*3; d+=2){
    const tries=[[0,-d],[0,d],[-d,0],[d,0]];
    for(const t of tries){
      const nx=clamp(P.x+t[0],0,R.w*T-P.w), ny=P.y+t[1];
      if(!insideSolid(nx,ny)){ P.x=nx; P.y=ny; P.vx=0; P.vy=0; return true; }
    }
  }
  const c=G.checkpoint||{room:0,tx:9,ty:16};
  resetPlayerAt(c.room,c.tx,c.ty);
  return true;
}

const AMBIENT=['dust','leaf','grit','ash','spark','bubble','ash','dust','spark','leaf'];
function seedAmbient(){
  amb=[];
  const kind=AMBIENT[G.room]||'dust';
  const n = kind==='bubble'?46 : kind==='ash'?54 : 40;
  for(let i=0;i<n;i++) amb.push({
    kind:kind,

    vx:(rnd()-.5)*.35, vy:(kind==='bubble'?-(0.25+rnd()*.4):(kind==='ash'?.16+rnd()*.3:.1+rnd()*.22)),
    p:rnd()*6.28, sz:rnd()<.22?2:1, a:.18+rnd()*.5, k:.4+rnd()*.9
  });
}
function ambientUpdate(){
  for(const m of amb){
    m.p+=0.02*m.k;
    m.x += m.vx + Math.sin(m.p)*0.22;
    m.y += m.vy;
    if(m.y > R.h*T+8){ m.y=-8; m.x=rnd()*R.w*T; }
    if(m.y < -8){ m.y=R.h*T+8; m.x=rnd()*R.w*T; }
    if(m.x < -8) m.x=R.w*T+8; if(m.x > R.w*T+8) m.x=-8;
  }
}
function drawAmbient(front){
  for(const m of amb){
    if((m.sz>1)!==!!front) continue;
    const x=m.x-cam.x*(front?1:.92), y=m.y-cam.y*(front?1:.92);
    if(x<-10||x>W+10||y<-10||y>H+10) continue;
    let col=C.chalkDim;
    if(m.kind==='leaf') col= (m.sz>1)?'#3c4a32':C.moss;
    if(m.kind==='ash') col= (m.sz>1)?C.uhie:'#4a4038';
    if(m.kind==='spark') col= C.gold;
    if(m.kind==='bubble') col= C.glass;
    if(m.kind==='grit') col='#4a4438';
    ctx.globalAlpha=m.a*(front?.85:.5);
    px(x,y,m.sz,m.sz,col);
    if(m.kind==='spark'||m.kind==='bubble'){
      ctx.globalAlpha=m.a*.16; ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(x+m.sz/2,y+m.sz/2,3.5,0,7); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}
// warm points of light: charms, glass, market lamps
function roomLights(){
  const L=[];
  for(const sh of shrines){
    if(sh.kind==='rest') L.push({x:sh.x+8,y:sh.y+11,r:34,c:'216,164,66',i:.30});
    else if(sh.kind==='mirror') L.push({x:sh.x+8,y:sh.y+11,r:G.mirrors[sh.id]?40:22,
      c:G.mirrors[sh.id]?'111,183,200':'120,120,140',i:G.mirrors[sh.id]?.34:.16});
    else L.push({x:sh.x+8,y:sh.y+9,r:26,c:'232,226,208',i:.22});
  }
  if(G.room===4) for(let i=0;i<6;i++) L.push({x:80+i*120, y:96+((i*37)%40), r:44, c:'214,120,52', i:.26});
  if(G.room===3) L.push({x:cam.x+W/2, y:cam.y+H/2, r:120, c:'140,30,40', i:.10});
  if(G.room===5) for(let i=0;i<4;i++) L.push({x:110+i*150, y:70+((i*53)%60), r:52, c:'90,190,205', i:.16});
  return L;
}
function drawLights(){
  const L=roomLights();
  ctx.globalCompositeOperation='lighter';
  for(const l of L){
    const x=l.x-cam.x, y=l.y-cam.y;
    if(x<-l.r||x>W+l.r||y<-l.r||y>H+l.r) continue;
    const fl = 1 + Math.sin(G.t/13 + x*0.05)*0.07 + Math.sin(G.t/5.3)*0.03;
    const g=ctx.createRadialGradient(x,y,1,x,y,l.r*fl);
    g.addColorStop(0,'rgba('+l.c+','+(l.i*fl)+')');
    g.addColorStop(1,'rgba('+l.c+',0)');
    ctx.fillStyle=g; ctx.fillRect(x-l.r,y-l.r,l.r*2,l.r*2);
  }
  ctx.globalCompositeOperation='source-over';
}
function drawGrain(){
  ctx.globalAlpha=.05;
  const o=(G.t*7)%97;
  for(let i=0;i<130;i++){
    const h1=hash2(i*13+o, i*29+o);
    px((h1*W)|0, ((h1*7919)%H)|0, 1,1, i%3?'#ffffff':'#000000');
  }
  ctx.globalAlpha=1;
}
function hash2(a,b){ let h=(a*374761393+b*668265263)|0; h=(h^(h>>13))*1274126177; return ((h^(h>>16))>>>0)/4294967295; }
function decal(x,y){
  if(decals.length>110) decals.splice(0,6);
  for(let i=0;i<3;i++) decals.push({room:G.room, x:x+(rnd()-.5)*11, y:y-rnd()*5,
    s:1+(rnd()<.35?1:0), a:.35+rnd()*.35});
}

// ── sound ───────────────────────────────────────────────────────────────
let AC=null, audioReady=false, audioTried=false;
function initAudio(){
  if(!AC){
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; }
    audioTried=true;
    if(AC){
      // a one-sample silent buffer is the handshake iOS and Chrome want
      try{
        const b=AC.createBuffer(1,1,22050), src=AC.createBufferSource();
        src.buffer=b; src.connect(AC.destination); src.start(0);
      }catch(e){}
    }
  }
  if(AC){
    if(AC.state!=='running'){
      try{ AC.resume().then(()=>{ audioReady=(AC.state==='running'); afterAudio(); }).catch(()=>{}); }catch(e){}
    }
    if(AC.state==='running' && !audioReady){ audioReady=true; afterAudio(); }
  }
}
// once sound is genuinely alive, start the room's music
function afterAudio(){
  if(!AC || AC.state!=='running') return;
  musBus();
  if(G && G.mode!=='title') musicForRoom();
}
function audioState(){
  if(!AC) return audioTried ? 'blocked' : 'off';
  return AC.state==='running' ? (MUS.on?'on':'muted') : 'blocked';
}
function tone(f,dur,type,vol,to){ if(!AC)return; try{
  const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(to) o.frequency.exponentialRampToValueAtTime(Math.max(30,to), t+dur);
  g.gain.setValueAtTime(vol==null?.04:vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
}catch(e){} }
function nz(dur,vol,hp){ if(!AC)return; try{
  const n=Math.max(1,(AC.sampleRate*dur)|0), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource(), g=AC.createGain(), f=AC.createBiquadFilter();
  s.buffer=b; g.gain.value=vol==null?.05:vol; f.type='highpass'; f.frequency.value=hp||300;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}catch(e){} }

function musBus(){
  if(!AC || MUS.bus) return;
  MUS.bus=AC.createGain(); MUS.bus.gain.value=MUS.vol;
  MUS.delay=AC.createDelay(1.0); MUS.delay.delayTime.value=0.24;
  const fb=AC.createGain(); fb.gain.value=0.28;
  const wet=AC.createGain(); wet.gain.value=0.30;
  MUS.delay.connect(fb); fb.connect(MUS.delay); MUS.delay.connect(wet);
  wet.connect(MUS.bus); MUS.bus.connect(AC.destination);
}
function env(t,g,peak,dur,atk){
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(peak,t+(atk||.006));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
}
// ogene: hand-struck iron bell, two tones, lots of upper partials
function mOgene(t,f,vol){
  if(!AC) return; try{
    const g=AC.createGain(), bp=AC.createBiquadFilter();
    bp.type='bandpass'; bp.frequency.value=f*4; bp.Q.value=1.6;
    [1,2.76,5.4,8.9].forEach((r,i)=>{
      const o=AC.createOscillator();
      o.type=i?'square':'triangle'; o.frequency.setValueAtTime(f*r,t);
      const og=AC.createGain(); og.gain.value=[1,.42,.22,.1][i];
      o.connect(og); og.connect(bp); o.start(t); o.stop(t+.42);
    });
    env(t,g,vol,.4,.003);
    bp.connect(g); g.connect(MUS.bus); g.connect(MUS.delay);
  }catch(e){}
}
// udu: clay pot. Palm on the mouth, pitch falls away fast.
function mUdu(t,hi){
  if(!AC) return; try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(hi,t);
    o.frequency.exponentialRampToValueAtTime(46,t+.19);
    env(t,g,.55,.26,.004);
    o.connect(g); g.connect(MUS.bus); o.start(t); o.stop(t+.28);
    const n=(AC.sampleRate*.02)|0, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
    const src=AC.createBufferSource(), lp=AC.createBiquadFilter(), gg=AC.createGain();
    src.buffer=b; lp.type='lowpass'; lp.frequency.value=900; gg.gain.value=.20;
    src.connect(lp); lp.connect(gg); gg.connect(MUS.bus); src.start(t);
  }catch(e){}
}
// ekwe: hollowed log, two lips, two pitches
function mEkwe(t,f){
  if(!AC) return; try{
    const n=(AC.sampleRate*.045)|0, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,6);
    const src=AC.createBufferSource(), bp=AC.createBiquadFilter(), g=AC.createGain();
    src.buffer=b; bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=9; g.gain.value=.26;
    src.connect(bp); bp.connect(g); g.connect(MUS.bus); src.start(t);
    const o=AC.createOscillator(), og=AC.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(f*.52,t);
    env(t,og,.10,.07,.002); o.connect(og); og.connect(MUS.bus); o.start(t); o.stop(t+.09);
  }catch(e){}
}
// ichaka / oyo: the gourd rattle
function mShaker(t,vol){
  if(!AC) return; try{
    const n=(AC.sampleRate*.055)|0, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.6);
    const src=AC.createBufferSource(), hp=AC.createBiquadFilter(), g=AC.createGain();
    src.buffer=b; hp.type='highpass'; hp.frequency.value=5200; g.gain.value=vol;
    src.connect(hp); hp.connect(g); g.connect(MUS.bus); src.start(t);
  }catch(e){}
}
// opi: the horn/flute that carries the tune, with breath and a little vibrato
function mOpi(t,f,dur,vol){
  if(!AC) return; try{
    const o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();
    o.type='triangle'; o.frequency.setValueAtTime(f,t);
    const vib=AC.createOscillator(), vg=AC.createGain();
    vib.type='sine'; vib.frequency.value=5.2; vg.gain.value=f*.012;
    vib.connect(vg); vg.connect(o.frequency); vib.start(t); vib.stop(t+dur+.1);
    lp.type='lowpass'; lp.frequency.setValueAtTime(f*5,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.045);
    g.gain.setValueAtTime(vol,t+dur*.6);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(lp); lp.connect(g); g.connect(MUS.bus); g.connect(MUS.delay);
    o.start(t); o.stop(t+dur+.05);
    // breath
    const n=(AC.sampleRate*.05)|0, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const src=AC.createBufferSource(), bp=AC.createBiquadFilter(), bg=AC.createGain();
    src.buffer=b; bp.type='bandpass'; bp.frequency.value=f*2.2; bp.Q.value=1.2; bg.gain.value=vol*.35;
    src.connect(bp); bp.connect(bg); bg.connect(MUS.bus); src.start(t);
  }catch(e){}
}
// palm-wine guitar: the two-finger highlife figure
function mGuitar(t,f,vol){
  if(!AC) return; try{
    const o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();
    o.type='sawtooth'; o.frequency.setValueAtTime(f,t);
    lp.type='lowpass'; lp.frequency.setValueAtTime(f*7,t);
    lp.frequency.exponentialRampToValueAtTime(f*2,t+.22);
    env(t,g,vol,.3,.004);
    o.connect(lp); lp.connect(g); g.connect(MUS.bus); g.connect(MUS.delay);
    o.start(t); o.stop(t+.34);
  }catch(e){}
}
// the string bed under a Nollywood scene
function mPad(t,f,dur,kind){
  if(!AC) return; try{
    const g=AC.createGain(), lp=AC.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=kind===2?520:380;
    [1,1.005,1.5,2.0].forEach((r,i)=>{
      const o=AC.createOscillator(), og=AC.createGain();
      o.type=i<2?'sawtooth':'triangle'; o.frequency.setValueAtTime(f*r,t);
      og.gain.value=[.5,.5,.22,.14][i];
      o.connect(og); og.connect(lp); o.start(t); o.stop(t+dur+.2);
    });
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(kind===2?.055:.038, t+dur*.35);
    g.gain.linearRampToValueAtTime(.0001, t+dur);
    lp.connect(g); g.connect(MUS.bus);
  }catch(e){}
}
function musicSetDrone(f){
  if(!AC) return; musBus();
  try{
    if(!MUS.drone){
      MUS.drone=AC.createOscillator(); MUS.droneG=AC.createGain();
      const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=260;
      MUS.drone.type='sawtooth'; MUS.droneG.gain.value=0;
      MUS.drone.connect(lp); lp.connect(MUS.droneG); MUS.droneG.connect(MUS.bus);
      MUS.drone.start();
    }
    MUS.drone.frequency.setTargetAtTime(f, AC.currentTime, .6);
    MUS.droneG.gain.setTargetAtTime(MUS.on?0.042:0, AC.currentTime, .7);
  }catch(e){}
}
function musicStep(t,i){
  const tr=MUS.track; if(!tr) return;
  const k=i%12, bar=(i/12)|0, sc=SCALES[tr.sc], m=tr.mix;
  if(tr.bell[k]) mOgene(t, sc[(tr.bell[k]-1)%5]*2, (tr.bell[k]===3?.085:.055)*m);
  if(tr.udu[k])  mUdu(t, tr.udu[k]===2?205:150);
  if(tr.ekwe[k]) mEkwe(t, tr.ekwe[k]===2?1250:1950);
  if(tr.shk[k])  mShaker(t, (tr.shk[k]===2?.05:.026)*m);
  if(tr.gtr && tr.gtr[k]) mGuitar(t, sc[(tr.gtr[k]-1)%5]*2, .055*m);
  const phrase = tr.opi[bar % tr.opi.length];
  if(phrase && phrase[k]){
    const deg=phrase[k];
    mOpi(t, sc[(deg-1)%5]*(deg>5?4:2), tr.spb*(2+(k%3)), .055*m);
  }
  if(k===0 && tr.pad) mPad(t, sc[0], tr.spb*12, tr.pad);
  // answering voice, low, on the far side of the bar
  if(k===6 && phrase && !phrase[6] && Math.random()<.4)
    mOpi(t, sc[1]*2, tr.spb*3, .03*m);
}
function musicSched(){
  if(!AC || AC.state!=='running' || !MUS.track || !MUS.on) return;
  const now=AC.currentTime;
  if(MUS.next < now) MUS.next = now + .06;
  while(MUS.next < now + .35){ musicStep(MUS.next, MUS.step++); MUS.next += MUS.track.spb; }
}
function musicPlay(name){
  if(!AC || AC.state!=='running') return;
  musBus();
  const tr=TRACKS[name]; if(!tr || MUS.track===tr) return;
  MUS.track=tr; MUS.step=0; MUS.next=AC.currentTime+.08;
  musicSetDrone(SCALES[tr.sc][0]/2);
  if(!MUS.timer && typeof setInterval!=='undefined') MUS.timer=setInterval(musicSched,60);
}
function musicForRoom(){
  if(boss && !boss.dead) musicPlay('boss');
  else musicPlay(ROOM_TRACK[G.room]||'night');
}
function musicToggle(){
  MUS.on=!MUS.on;
  if(AC && MUS.bus) try{ MUS.bus.gain.setTargetAtTime(MUS.on?MUS.vol:0, AC.currentTime, .2); }catch(e){}
  if(AC && MUS.droneG) try{ MUS.droneG.gain.setTargetAtTime(MUS.on?.042:0, AC.currentTime, .2); }catch(e){}
  say(MUS.on?'Sound on.':'Sound off.',70);
}

// Not recordings: a shaped blip per syllable, tuned per speaker.
const VOICE = {
  narr:  {f:118, type:'triangle', vol:.055, jit:14, dur:.075, growl:0},
  boss:  {f:74,  type:'sawtooth', vol:.075, jit:9,  dur:.105, growl:1},
  you:   {f:186, type:'sine',     vol:.042, jit:22, dur:.055, growl:0},
  mirror:{f:520, type:'sine',     vol:.038, jit:60, dur:.09,  growl:0},
  ala:   {f:96,  type:'square',   vol:.05,  jit:10, dur:.09,  growl:0}
};
function voiceBlip(kind,seedv){
  if(!AC) return;
  const v=VOICE[kind]||VOICE.narr;
  const f=v.f + ((seedv*37)%v.jit) - v.jit/2;
  try{
    const t=AC.currentTime;
    const o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.setValueAtTime(v.growl?900:2400,t);
    o.type=v.type; o.frequency.setValueAtTime(f,t);
    o.frequency.linearRampToValueAtTime(f*(1+((seedv%5)-2)*.04), t+v.dur);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(v.vol,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+v.dur);
    o.connect(lp); lp.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+v.dur+.02);
    if(v.growl){
      const n=(AC.sampleRate*v.dur)|0, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
      const src=AC.createBufferSource(), bf=AC.createBiquadFilter(), gg=AC.createGain();
      src.buffer=b; bf.type='bandpass'; bf.frequency.value=320; bf.Q.value=2; gg.gain.value=.05;
      src.connect(bf); bf.connect(gg); gg.connect(AC.destination); src.start(t);
    }
  }catch(e){}
}

};
const WEAPON_ORDER=['mma','nkwu','ogu','oku'];
function WA(){ return WEAPONS[G.weapon] || WEAPONS.mma; }
function CHAIN(){ return WA().chain; }
function ownedWeapons(){ return WEAPON_ORDER.filter(k=>G.weapons[k]); }
function cycleWeapon(d){
  const own=ownedWeapons();
  if(own.length<2){ say('You are carrying only the one.',80); return; }
  let i=own.indexOf(G.weapon); if(i<0) i=0;
  i=(i+(d||1)+own.length)%own.length;
  G.weapon=own[i]; P.combo=0; P.comboWin=0; P.charge=0;
  say(WA().name,110); S.pick();
  burst(P.x+5,P.y+9,10,WA().tint,1.8,22);
}
const ATK = [ {wind:5, act:5, rec:12, dmg:9,  poise:10, reach:22, kb:1.6},
              {wind:5, act:5, rec:13, dmg:10, poise:12, reach:22, kb:1.8},
              {wind:9, act:7, rec:20, dmg:18, poise:24, reach:28, kb:3.4} ];
const HEAVY  = {wind:14, act:8, rec:26, dmg:34, poise:56, reach:34, kb:5.2};
const AIRCUT = {wind:4,  act:6, rec:10, dmg:9,  poise:10, reach:24, kb:1.4};
const CHARGE_AT = 26, EXEC_REACH = 24;

function zHeld(){ return !!keys.KeyZ; }
function teach(k,msg,dur){ if(!G.taught[k]){ G.taught[k]=1; say(msg,dur||200); } }

function brokenTarget(){
  let best=null, bd=1e9; const cx=P.x+P.w/2;
  for(const e of enemies){
    if(e.dead || e.broken<=0) continue;
    const d=Math.abs((e.x+e.w/2)-cx);
    if(d < EXEC_REACH+e.w/2 && Math.abs(e.y-P.y)<26 && d<bd){ best=e; bd=d; }
  }
  if(boss && !boss.dead && boss.broken>0){
    const d=Math.abs((boss.x+boss.w/2)-cx);
    if(d < EXEC_REACH+boss.w/2 && Math.abs(boss.y-P.y)<44 && d<bd) best=boss;
  }
  return best;
}
function startExec(e){
  P.st='exec'; P.t=0; P.execTarget=e; P.vx=0; P.inv=48;
  P.face = ((e.x+e.w/2) > (P.x+P.w/2)) ? 1 : -1;
  e.stagger = Math.max(e.stagger, 46);
}

function playerUpdate(){
  unstickPlayer();          // before anything reads P.x/P.y this frame
  P.anim++;
  if(P.inv>0) P.inv--;
  if(P.hurtT>0) P.hurtT--;
  if(P.rollCd>0) P.rollCd--;
  if(P.ikenga>0) P.ikenga--;
  if(G.cheat){ P.ofo=100; P.hp=G.maxHP; P.flasks=G.skills.flasks; }
  if(P.veilT>0){ P.veilT--; if(P.veilT===0) P.veil=0; }
  if(P.comboWin>0) P.comboWin--; else P.combo=0;

  const busy = ['atk','heavy','aircut','thrust','roll','ward','heal','call','hurt','pray','exec'].indexOf(P.st)>=0;
  const a0 = CHAIN()[Math.min(P.combo,CHAIN().length-1)];
  const inRec = (P.st==='atk') && (P.t > a0.wind + a0.act);

  // ---- charge: hold CUT through a swing's recovery, release for the heavy ----
  if(zHeld() && (P.st==='idle' || inRec)){
    P.charge = Math.min(P.charge+1, CHARGE_AT+90);
    if(P.charge===CHARGE_AT){ S.charge(); burst(P.x+5,P.y+9,10,C.gold,1.8,22); }
  } else if(!zHeld()){
    if(P.charge>=CHARGE_AT && !busy){
      P.st='heavy'; P.t=0; P.hitOnce=false; P.charge=0; P.swingId++; S.heavy();
    } else if(!busy){ P.charge=0; }
  }

  // ---- run ----
  const acc = P.onGround?0.55:0.34, max = P.charge>0 ? 1.05 : 1.75;
  if(!busy){
    if(LEFT()){ P.vx-=acc; P.face=-1; }
    if(RIGHT()){ P.vx+=acc; P.face=1; }
    if(!LEFT()&&!RIGHT()) P.vx *= P.onGround?0.72:0.9;
    P.vx = clamp(P.vx,-max,max);
    if(P.onGround && Math.abs(P.vx)>1.2 && P.anim%13===0) S.step();
    if(P.onGround && Math.abs(P.vx)>0.6) P.tut.moved++;
  } else if(P.st!=='roll'){
    P.vx *= P.onGround?0.6:0.94;
  }

  // ---- jump ----
  if(P.onGround){ P.coyote=7; P.airJumps = G.cheat?1:0; } else if(P.coyote>0) P.coyote--;
  if(tap('Space')||tap('ArrowUp')||tap('KeyW')) P.buffer=8;
  if(P.buffer>0) P.buffer--;
  // in a speedrun you also get one jump out of thin air
  if(G.cheat && P.buffer>0 && P.coyote<=0 && P.airJumps>0 && (!busy || P.st==='ward')){
    P.vy=-10.4; P.airJumps--; P.buffer=0; P.st='idle'; P.t=0;
    burst(P.x+5,P.y+P.h,10,C.gold,2,20); nz(.06,.02,800);
  }
  else if(P.buffer>0 && P.coyote>0 && (!busy || P.st==='ward')){
    P.vy = G.cheat ? -11.2 : -7.4;
    if(G.cheat) P.airJumps=1;
    P.buffer=0; P.coyote=0; P.onGround=false; P.st='idle'; P.t=0;
    burst(P.x+5,P.y+P.h,4,C.chalkDim,1,14); nz(.05,.018,700); P.tut.jumps++;
  }
  if(P.vy<0 && !keys.Space && !UPK()) P.vy += 0.42;

  // ---- roll-cancel out of recovery: the one escape from commitment ----
  if((inRec || (P.st==='ward' && P.t>10)) && tap('KeyX') && P.rollCd<=0){
    P.st='roll'; P.t=0; P.vx=P.face*3.1; P.rollCd=16; S.roll(); P.tut.rolls++;
  }

  if(!busy){
    if(tap('KeyZ')){
      const mark = brokenTarget();
      if(mark) startExec(mark);
      else if(!P.onGround && DOWNK()){ P.st='thrust'; P.t=0; P.hitOnce=false; P.swingId++; P.vy=1.2; S.swing(); }
      else if(!P.onGround){ P.st='aircut'; P.t=0; P.hitOnce=false; P.swingId++; S.swing(); }
      else { P.st='atk'; P.t=0; P.hitOnce=false; P.swingId++; S.swing(); }
    }
    else if(tap('KeyX') && P.rollCd<=0){ P.st='roll'; P.t=0; P.vx=P.face*3.1; P.rollCd=16; S.roll(); P.tut.rolls++; }
    else if(tap('KeyC')){ P.st='ward'; P.t=0; }
    else if(tap('KeyG')) cycleSpell(1);
    else if(tap('KeyB')) cycleWeapon(1);
    else if(tap('KeyF')){
      const k=G.equipped, lv=spellLv(k);
      if(!lv) say("You have not learned that word yet. Ala's ledger, at a charm.",110);
      else if(P.ofo < SPELLS[k].cost) say(SPELLS[k].name+' needs '+SPELLS[k].cost+' \u1ecdf\u1ecd.',80);
      else { P.st='pray'; P.t=0; P.castKey=k; P.ofo-=SPELLS[k].cost; P.tut.casts++; }
    }
    else if(tap('KeyN')){
      if(G.knowsName && boss && !boss.dead) { P.st='call'; P.t=0; }
      else if(!G.knowsName) say("No name on your tongue.",90);
      else say("There is no one here worth naming.",90);
    }
    else if(tap('KeyV')){
      if(P.flasks>0 && P.hp<G.maxHP){ P.st='heal'; P.t=0; }
      else if(P.flasks<=0) say("The gourd is dry. Rest at a charm.",80);
    }
  }

  switch(P.st){
    case 'atk': {
      const a = CHAIN()[Math.min(P.combo,CHAIN().length-1)]; P.t++;
      if(P.t===1 && P.combo===CHAIN().length-1 && P.onGround) P.vx = P.face*1.9;
      if(P.t>a.wind && P.t<=a.wind+a.act) swing(a,'light');
      const rec=G.skills.swift?Math.round(a.rec*0.75):a.rec;
      if(P.t>=a.wind+a.act+rec){ P.combo=(P.combo+1)%CHAIN().length; P.comboWin=26; P.st='idle'; P.t=0; P.swingId++; }
      break; }

    case 'heavy': {
      P.t++;
      if(P.t<WA().heavy.wind){ P.vx = P.face*0.35; }
      if(P.t===WA().heavy.wind){ P.vx = P.face*2.7; S.swing(); shake(2); }
      if(P.t>WA().heavy.wind && P.t<=WA().heavy.wind+WA().heavy.act) swing(WA().heavy,'heavy');
      if(P.t>=WA().heavy.wind+WA().heavy.act+WA().heavy.rec){ P.st='idle'; P.t=0; P.combo=0; }
      break; }

    case 'aircut': {
      P.t++;
      if(P.t>WA().air.wind && P.t<=WA().air.wind+WA().air.act) swing(WA().air,'light');
      if(P.t>=WA().air.wind+WA().air.act+WA().air.rec){ P.st='idle'; P.t=0; }
      break; }

    case 'thrust': {
      P.t++; P.vy = Math.min(P.vy+0.52, 7.6);
      const foot = {x:P.x-2, y:P.y+P.h-4, w:P.w+4, h:9};
      let bounced=false;
      for(const e of enemies) if(!e.dead && rects(foot,e) && e.hitId!==P.swingId){
        e.hitId=P.swingId; damage(e,12,P.face,1.2,false,16); bounced=true; }
      if(boss && !boss.dead && rects(foot,boss) && boss.hitId!==P.swingId){
        boss.hitId=P.swingId;
        const bd = boss.bound>0;
        damage(boss, bd?12:1.2, P.face, .4, !bd, bd?16:0); bounced=true;
      }
      if(G.hasSlam){
        for(let i=-1;i<=1;i++){
          const tx=Math.floor((P.x+P.w/2)/T)+i, ty=Math.floor((P.y+P.h+3)/T);
          if(tileAt(R,tx,ty)==='c'){ R.broken[tx+','+ty]=1; shake(6); stop(8); nz(.26,.07,220);
            burst(tx*T+8,ty*T+8,14,C.earthLit,2.6,30); }
        }
      }
      if(bounced){ P.vy=-5.4; P.st='idle'; P.t=0; stop(8); shake(4); }
      else if(P.onGround){
        P.st='idle'; P.t=0; shake(G.hasSlam?6:2); stop(G.hasSlam?6:2);
        burst(P.x+5,P.y+P.h,G.hasSlam?14:5,C.chalkDim,2.4,24);
        if(G.hasSlam){
          for(const e of enemies) if(!e.dead && Math.abs((e.x+e.w/2)-(P.x+P.w/2))<38 && Math.abs(e.y-P.y)<26)
            damage(e,15,(e.x>P.x?1:-1),2.4,false,28);
        }
      }
      break; }

    case 'roll': P.t++; P.vx = P.face*3.1*(1-P.t/26); if(P.t>=22){P.st='idle';P.t=0;} break;

    case 'ward': P.t++;
      if(P.t>=14 && !keys.KeyC){ P.st='idle'; P.t=0; }
      if(P.t>=110){ P.st='idle'; P.t=0; }
      break;

    case 'heal': P.t++;
      if(P.t===26){ P.flasks--; P.hp=Math.min(G.maxHP,P.hp+45); S.heal(); P.tut.heals++;
                    burst(P.x+5,P.y+8,16,C.chalk,1.6,34); }
      if(P.t>=44){P.st='idle';P.t=0;} break;

    case 'pray': {
      P.t++;
      const k=P.castKey, st=spellStat(k)||{};
      if(P.t===1){ S.pray(); voiceBlip('ala',3); }
      if(P.t<16 && P.t%3===0) burst(P.x+5,P.y+16,3,C.gold,1.4,22);

      if(k==='amadioha' && P.t===18){
        G.flash=16; shake(9); stop(12); G.slow=10;
        for(const e of enemies) if(!e.dead && Math.abs(e.y-P.y)<130) damage(e,st.dmg,(e.x>P.x?1:-1),2.2,false,st.poise);
        if(boss && !boss.dead){ const bd=boss.bound>0; damage(boss, bd?st.dmg*1.4:6, 1, 1, !bd, bd?st.poise*1.2:0); }
        for(let i=0;i<9;i++) burst(P.x+5+(i-4)*32, P.y-10, 10, C.gold, 3.2, 42);
      }
      if(k==='ala' && P.t===16){
        G.flash=8; shake(7); stop(8);
        for(const e of enemies) if(!e.dead && Math.abs(e.y-P.y)<140 && Math.abs(e.x-P.x)<190){
          e.stagger=Math.max(e.stagger,st.hold); e.st='stagger'; e.t=0; e.tell='';
          damage(e,6,(e.x>P.x?1:-1),0,false,st.poise);
          burst(e.x+e.w/2,e.y+e.h,12,C.earthLit,2,34);
        }
        if(boss && !boss.dead && boss.bound>0){ boss.stagger=Math.max(boss.stagger,Math.round(st.hold*0.45));
          damage(boss,6,1,0,false,st.poise); }
        for(let i=0;i<7;i++) burst(P.x+5+(i-3)*34, P.y+P.h, 8, C.earthLit, 2.6, 36);
      }
      if(k==='idemili' && P.t===14){
        P.veil=st.shield; P.veilT=560; G.flash=6; S.heal();
        burst(P.x+5,P.y+8,26,C.glass,2.2,44);
      }
      if(k==='ikenga' && P.t===12){
        P.ikenga=st.dur; G.flash=6; shake(3);
        burst(P.x+5,P.y+9,22,C.uhie,2.6,38);
      }
      if(P.t>=42){ P.st='idle'; P.t=0; }
      break; }

    case 'call': {
      P.t++;
      if(P.t===1) S.name();
      if(P.t%6===0) burst(P.x+5,P.y+P.h-2,2,C.gold,1.2,26);
      if(P.t>=48){
        if(boss && !boss.dead){
          boss.bound = 420; boss.stagger=26; shake(7); stop(14); G.flash=12;
          say("OGBUNABALI. He is seen. Now he can bleed.",130);
          burst(boss.x+boss.w/2,boss.y+boss.h/2,40,C.gold,3.2,44);
        }
        P.st='idle'; P.t=0;
      }
      break; }

    case 'exec': {
      P.t++;
      const e = P.execTarget;
      if(P.t===1){ stop(16); G.slow=26; shake(5); S.exec(); }
      if(P.t===15 && e && !e.dead){
        if(e.kind==='boss'){
          damage(e, 130, P.face, 1, false, 0); e.broken=0; e.poise=e.poiseMax; e.stagger=46;
          e.bound = Math.min(900, e.bound+260);
        } else {
          damage(e, 9999, P.face, 3.2, false, 0);
        }
        P.ofo = Math.min(100, P.ofo+25);
        P.hp  = Math.min(G.maxHP, P.hp+8);
        P.tut.execs++;
        if(e.trainer && !e.live){ e.hp=e.maxhp; e.poise=e.poiseMax; e.broken=0; e.stagger=40; }
        G.flash=9; shake(8); stop(14); G.slow=14;
        burst(e.x+e.w/2, e.y+e.h/2, 36, C.uhie, 3.6, 46);
        decal(e.x+e.w/2, e.y+e.h); decal(e.x+e.w/2, e.y+e.h-6);
      }
      if(P.t>=34){ P.st='idle'; P.t=0; P.execTarget=null; }
      break; }

    case 'hurt': P.t++; if(P.t>=16){P.st='idle';P.t=0;} break;
  }

  P.vy = Math.min(P.vy+0.46, 9);
  moveEnt(P);

  // standing in what should not be stood in
  if(!G.cheat && P.inv<=0){
    const ft=tileAt(R, Math.floor((P.x+P.w/2)/T), Math.floor((P.y+P.h-2)/T));
    if(ft==='^'){
      hurtPlayer(G.room===8?22:16, P.vx>0?-1:1, true);
      P.vy=-6.4; P.vx=(P.x<R.w*T/2?1:-1)*2.4;
      if(G.room===8) burst(P.x+5,P.y+P.h,16,'#ffb347',2.6,30);
    }
  }
  for(const ex of R.exits){
    const box={x:ex.tx*T,y:ex.ty*T,w:ex.tw*T,h:ex.th*T};
    if(ex.needs && !G.slain[ex.needs]){
      if(rects(P,box) && !G.msg) say('The way is shut while he still stands.',60);
      continue;
    }
    if(rects(P,box)){ G.fade=1; resetPlayerAt(ex.to,ex.sx,ex.sy); say(ROOMS[ex.to].name,150); return; }
  }
  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i]; pk.t++;
    if(pk.kind==='cowrie'){
      pk.vy=Math.min(pk.vy+0.34,6); pk.x+=pk.vx; pk.y+=pk.vy; pk.vx*=0.94;
      if(solidAt(pk.x+3,pk.y+7,null)){ pk.vy=-pk.vy*0.34; pk.y-=1; pk.vx*=0.7; }
      const dxp=(P.x+P.w/2)-(pk.x+3), dyp=(P.y+P.h/2)-(pk.y+3);
      const d=Math.hypot(dxp,dyp);
      if(pk.t>16 && d<44){ pk.vx+=dxp/d*0.9; pk.vy+=dyp/d*0.9-0.34; }
      if(d<9 || rects(P,pk)){
        P.cowries+=pk.amt; pickups.splice(i,1);
        tone(880+((pk.amt*13)%220),.07,'triangle',.03,1300);
        continue;
      }
      if(pk.t>900) pickups.splice(i,1);
      continue;
    }
    if(pk.kind==='weapon'){
      pk.y += Math.sin((G.t+pk.t)/26)*0.12;
      if(rects(P,{x:pk.x-4,y:pk.y-4,w:16,h:26})){
        G.weapons[pk.w]=1; G.weapon=pk.w; P.combo=0;
        pickups.splice(i,1); S.name(); G.flash=12; shake(4);
        burst(P.x+5,P.y+9,32,WEAPONS[pk.w].tint,2.6,46);
        say('You take up the '+WEAPONS[pk.w].ig+'. '+WEAPONS[pk.w].blurb,300);
        saveGame();
      }
      continue;
    }
    if(rects(P,pk)){
      if(pk.kind==='heart'){ G.maxHP+=30; P.hp=G.maxHP; R.taken=true; S.heal();
        say("A shard of your own heart, returned.",180); burst(pk.x,pk.y,26,C.blood,2.4,40); shake(4); saveGame(); }
      pickups.splice(i,1);
    }
  }
  // not on the frame you fell: die() drops the shade on your own hitbox from
  // inside this same function, a few lines up, and without this guard you take
  // it straight back and death costs nothing
  if(shade && !P.dead && shade.room===G.room && rects(P,shade)){
    P.cowries += shade.amt; say("You take back what you dropped. +"+shade.amt,110);
    burst(shade.x,shade.y,20,C.gold,2,34); shade=null;
  }
  for(const sh of shrines){
    if(rects(P,sh)){
      if(sh.kind==='rest'){
        if(tap('ArrowDown')||tap('KeyS')){
          P.hp=G.maxHP; P.flasks=G.skills.flasks; P.ofo=0;
          G.checkpoint={room:G.room, tx:Math.floor(sh.x/T), ty:Math.floor((sh.y+sh.h)/T)};
          spawnRoom(); say("You press your palm to the charm. It remembers you.",150);
          S.heal(); burst(sh.x+8,sh.y+8,22,C.gold,1.8,40); saveGame();
        } else if(tap('KeyE')){ openShop(); return; }
        else if(!G.msg) say("\u2193 rest and save      E  Ala's ledger",40);
      } else if(sh.kind==='mirror'){
        if(tap('ArrowDown')||tap('KeyS')||tap('KeyE')){
          if(G.mirrors[sh.id]) openTravel();
          else if(G.mirrorLock[sh.id]) say("It stays black. Leave this room and come back.",120);
          else openRiddle(sh);
          return;
        } else if(!G.msg) say(G.mirrors[sh.id]?"\u2193 step through":"\u2193 the glass wants a riddle",40);
      } else if(sh.kind==='name' && !G.knowsName){
        if(tap('ArrowDown')||tap('KeyS')){
          G.knowsName=true; G.flash=10; shake(3); S.name();
          say("Nzu on stone, nine strokes: OGBUNABALI \u2014 he who kills at night. He cannot be fought. Only named. [N]",340);
          burst(sh.x+8,sh.y+6,30,C.chalk,2,46);
        } else if(!G.msg) say("\u2193 read the chalk",30);
      }
    }
  }

  if(P.hp<=0 && !P.dead) die();
}

// -- resolving a swing -------------------------------------------------------
function swing(a,kind){
  const box={x: P.face>0 ? P.x+P.w-2 : P.x-a.reach+2, y:P.y-4, w:a.reach, h:P.h+6};
  const boon = P.ikenga>0 ? (spellStat('ikenga')||{mult:1}).mult : 1;
  let connected=false, anyClean=false, anyMuff=false;

  for(const e of enemies){
    if(e.dead || !rects(box,e)) continue;
    if(e.hitId===P.swingId) continue;      // one swing, one hit
    e.hitId = P.swingId;
    let mult=1, blocked=false;
    const infront = ((P.x+P.w/2) > (e.x+e.w/2)) === (e.face>0);
    if(e.kind==='warden' && e.broken<=0 && e.stagger<=0 && infront && kind!=='heavy'){
      blocked=true; mult=0.15;
    }
    damage(e, a.dmg*mult*boon, P.face, blocked?0.5:a.kb, blocked, blocked?3:a.poise*boon);
    if(!blocked && WA().burn) e.burn=Math.max(e.burn||0, WA().burn);
    if(blocked){ S.block(); burst(e.x+(e.face>0?e.w:0), e.y+9, 7, C.gold, 2.2, 18); anyMuff=true; }
    else anyClean=true;
    connected=true;
  }

  if(boss && !boss.dead && rects(box,boss) && boss.hitId!==P.swingId){
    boss.hitId = P.swingId;
    const bound = boss.bound>0;
    damage(boss, a.dmg*boon*(bound?1:0.10), P.face, bound?a.kb*0.5:0.2, !bound, bound?a.poise*boon:0);
    connected=true; if(bound) anyClean=true; else anyMuff=true;
  }

  for(let i=shots.length-1;i>=0;i--) if(rects(box,shots[i])){
    burst(shots[i].x,shots[i].y,8,C.gold,2,20); shots.splice(i,1); connected=true; anyClean=true;
  }

  if(connected && !P.hitOnce){
    P.hitOnce=true;
    const hv = kind==='heavy';
    if(anyClean){
      P.tut.hits++;
      if(hv) P.tut.heavy++;
      if(!hv && P.combo===2) P.tut.chain++;
      stop(hv?14:(a.dmg>12?9:6));
      shake(hv?7:(a.dmg>12?4.5:2.6));
      S.hit();
      P.ofo = Math.min(100, P.ofo + (hv?9:3)*WA().ofo);
    } else if(anyMuff){
      stop(3); shake(1.4); S.muffle();
    }
    burst(P.x+P.face*15+5, P.y+8, hv?13:7, hv?C.gold:C.chalk, hv?3.4:2.4, hv?26:18);
  }
}

// -- damage ------------------------------------------------------------------
function damage(e,amt,dir,kb,muffled,poiseDmg){
  if(e.hp<=0) return;
  if(G.cheat){ amt = 1e9; poiseDmg = 1e9; muffled = false; }   // one touch is enough
  e.hp -= amt; e.flash=8; e.vx = dir*kb; if(kb>2) e.vy=-1.4;
  if(e.trainer && !e.live && e.hp<1) e.hp=1;
  e.lastHit = G.t;

  if(poiseDmg && e.broken<=0){
    e.poise -= poiseDmg;
    if(e.poise<=0){
      e.poise = e.poiseMax;
      e.broken = (e.kind==='boss') ? 170 : 220;
      e.stagger = Math.max(e.stagger, e.kind==='boss'?60:52);
      S.brk(); stop(11); shake(5.5); G.flash=7;
      burst(e.x+e.w/2, e.y+e.h/2, 28, C.gold, 3, 42);
      teach('exec', "Guard broken. Stand close and press Z while he is gold.", 200);
    }
  }

  burst(e.x+e.w/2, e.y+e.h/2, muffled?4:9, muffled?C.indigo:C.uhie, muffled?1.2:2.6, muffled?16:26);
  if(!muffled && amt>=4) decal(e.x+e.w/2, e.y+e.h);

  if(e.hp<=0){
    e.dead=true; dropCowries(e);
    P.ofo = Math.min(100, P.ofo + (e.kind==='boss'?0:6));
    burst(e.x+e.w/2,e.y+e.h/2, e.kind==='boss'?70:22, C.uhie, 3.2, 46);
    burst(e.x+e.w/2,e.y+e.h/2, e.kind==='boss'?40:10, C.chalk, 2.4, 40);
    decal(e.x+e.w/2, e.y+e.h);
    shake(e.kind==='boss'?10:3); stop(e.kind==='boss'?26:6);
    if(e.kind!=='boss') S.hit(); else S.die();
    G.slain[e.kind==='boss'?e.who:e.kind] = (G.slain[e.kind==='boss'?e.who:e.kind]||0)+1;
    if(e.kind==='boss'){
      if(e.who==='ogbunabali'){
        G.bossDead=true; G.hasSlam=true; G.outroT=110; G.outroWho='ogbunabali';
        say("He falls quiet. Something heavy settles into your hand \u2014 ALA'S FALL. In the air, hold \u2193 and CUT.",400);
      } else if(e.who==='ekwensu'){
        G.outroT=110; G.outroWho='ekwensu'; P.ofo=100;
        say("The horns come apart in the air like smoke off a doused fire.",300);
      } else if(e.who==='onwe'){
        G.outroT=130; G.outroWho='onwe'; G.ending=1;
      }
      saveGame();
    }
  }
}

function hurtPlayer(dmg,dir,unblockable){
  if(G.cheat) return;                                          // nothing lands
  if(P.inv>0 || (P.st==='roll' && P.t>=4 && P.t<=15) || P.st==='exec') return;
  if(P.veil>0){
    const eaten=Math.min(P.veil,dmg); P.veil-=eaten; dmg-=eaten;
    burst(P.x+5,P.y+9,10,C.glass,2.4,24); tone(700,.12,'sine',.035,1200);
    if(P.veil<=0){ P.veilT=0; burst(P.x+5,P.y+9,18,C.glass,3,32); }
    P.inv=Math.max(P.inv,14);
    if(dmg<=0){ shake(2); return; }
  }

  // late ward = a block: cheaper than a hit, but you eat chip and keep the stun
  if(P.st==='ward' && P.t>9 && !unblockable){
    P.hp -= Math.max(1, Math.round(dmg*0.3));
    P.vx = dir*1.7; P.inv=22; shake(2.6); stop(5); S.block();
    burst(P.x+5+P.face*8, P.y+9, 9, C.gold, 2.2, 20);
    if(P.hp<=0 && !P.dead) die();
    return;
  }

  P.hp-=dmg; P.inv=64; P.st='hurt'; P.t=0; P.vx=dir*2.4; P.vy=-2.2; P.charge=0;
  shake(5); stop(8); G.flash=6; S.hurt();
  burst(P.x+5,P.y+8,14,C.blood,2.6,28);
  decal(P.x+5, P.y+P.h);
  if(P.hp<=0 && !P.dead) die();
}

function die(){
  P.dead=true; P.st='dead'; S.die(); G.deaths++;
  shade = {room:G.room, x:P.x, y:P.y+6, w:10, h:12, amt:P.cowries, t:0};
  P.cowries=0;
  say("You die again. You have always died again.",180);
  setTimeout(()=>{
    const c=G.checkpoint;
    P.hp=G.maxHP; P.flasks=G.skills.flasks; P.ofo=0; P.charge=0;
    resetPlayerAt(c.room,c.tx,c.ty);
  }, 1400);
}

// -- parry -------------------------------------------------------------------
function parryWindow(){ return P.st==='ward' && P.t<=9; }
function tryParry(e,fromX,unblockable){
  if(unblockable) return false;
  if(!parryWindow()) return false;
  const facingIt = (fromX > P.x) === (P.face>0);
  if(!facingIt) return false;

  e.stagger = 84; e.st='stagger'; e.t=0; e.tell=''; e.vx = (e.x>P.x?1:-1)*2.2;
  const guardable = !(e.kind==='boss' && e.bound<=0);
  if(guardable && e.broken<=0){
    e.poise -= 58;
    if(e.poise<=0){
      e.poise=e.poiseMax; e.broken = (e.kind==='boss')?170:220;
      S.brk(); G.flash=9;
      teach('exec', "Guard broken. Stand close and press Z while he is gold.", 200);
    }
  }
  if(e.kind==='boss' && e.bound>0){ e.bound = Math.min(900, e.bound+140); }
  stop(13); shake(6); G.slow=14; G.flash=9; S.parry();
  burst(P.x+P.face*10+5,P.y+8,22,C.chalk,3.4,30);
  burst(P.x+P.face*10+5,P.y+8,10,C.gold,2.6,26);
  P.ofo = Math.min(100, P.ofo+18);
  P.cowries += 4;
  P.tut.parries++;
  if(G.skills.riposte){
    const rp = e.kind==='boss' ? (e.bound>0?22:2) : 20;
    damage(e, rp, (e.x>P.x?1:-1), 1.2, e.kind==='boss'&&e.bound<=0, e.kind==='boss'&&e.bound<=0?0:18);
    burst(P.x+P.face*14+5,P.y+8,10,C.uhie,2.8,24);
  }
  return true;
}

// -- enemies -----------------------------------------------------------------
function enemyUpdate(e){
  if(e.dead) return;
  G.seen[e.kind]=1;
  if(e.flash>0) e.flash--;
  if(e.burn>0){
    e.burn--;
    if(e.burn%12===0){ e.hp -= 3; e.flash=3;
      burst(e.x+e.w/2, e.y+e.h*0.4, 2, '#e8862a', 1.2, 18);
      if(e.hp<=0){ damage(e, 0.01, 1, 0, false, 0); } }
  }

  if(e.broken>0){
    e.broken--;
    if(e.broken===0){ e.poise=e.poiseMax; e.stagger=Math.max(e.stagger,12); e.st='idle'; e.t=0; }
  } else if(G.t - e.lastHit > 150 && e.poise < e.poiseMax){
    e.poise = Math.min(e.poiseMax, e.poise + 0.3);
  }

  const dx = (P.x+P.w/2)-(e.x+e.w/2), adx=Math.abs(dx), ady=Math.abs(P.y-e.y);

  if(e.stagger>0 || e.broken>0){
    e.stagger = Math.max(0, e.stagger-1);
    e.vx*=0.86; e.vy=Math.min(e.vy+0.46,9); e.tell=''; moveEnt(e);
    if(e.stagger===0 && e.broken<=0){ e.st='idle'; e.t=0; }
    return;
  }

  e.t++;

  if(e.kind==='walker'){
    if(e.st==='idle'){
      e.vx = e.face*0.45;
      if(Math.abs(e.x-e.home)>52) e.face*=-1;
      if(!solidAt(e.x+(e.face>0?e.w+2:-2), e.y+e.h+2, null)) e.face*=-1;
      if(adx<36 && ady<26 && e.cd<=0){ e.st='wind'; e.t=0; e.tell='white'; e.face = dx>0?1:-1; e.vx=0; }
      if(e.cd>0) e.cd--;
    }
    else if(e.st==='wind'){ e.vx=0; e.tell='white'; if(e.t>=28){ e.st='swing'; e.t=0; e.tell=''; } }
    else if(e.st==='wind2'){ e.vx=0; e.tell='white'; if(e.t>=15){ e.st='swing2'; e.t=0; e.tell=''; } }
    else if(e.st==='swing' || e.st==='swing2'){
      e.vx = e.face*0.7;
      if(e.t<=9){
        const box={x: e.face>0?e.x+e.w-2:e.x-20, y:e.y+2, w:22, h:16};
        if(rects(box,P)){ if(!tryParry(e,e.x)) hurtPlayer(12,e.face); }
      }
      if(e.t>=11){
        if(e.st==='swing' && rnd()<0.5){ e.st='wind2'; e.t=0; }
        else { e.st='rec'; e.t=0; }
      }
    }
    else if(e.st==='rec'){ e.vx*=0.8; if(e.t>=34){ e.st='idle'; e.t=0; e.cd=40; } }
  }

  if(e.kind==='lunger'){
    if(e.st==='idle'){
      e.vx*=0.8;
      if(adx<96 && ady<40 && e.cd<=0){ e.st='crouch'; e.t=0; e.face=dx>0?1:-1; }
      if(e.cd>0) e.cd--;
    }
    else if(e.st==='crouch'){ e.tell='gold'; e.vx*=0.7; if(e.t>=26){ e.st='dash'; e.t=0; e.tell=''; e.vx=e.face*3.4; } }
    else if(e.st==='dash'){
      if(e.t<=22){ if(rects(e,P)){ hurtPlayer(16,e.face,true); e.st='rec'; e.t=0; } }
      else { e.st='rec'; e.t=0; }
      e.vx = e.face*3.4*(1-e.t/30);
    }
    else if(e.st==='rec'){ e.vx*=0.82; if(e.t>=42){ e.st='idle'; e.t=0; e.cd=36; } }
  }

  if(e.kind==='thrower'){
    e.face = dx>0?1:-1; e.vx=0;
    if(e.cd>0) e.cd--;
    else if(adx<190 && ady<90){
      shots.push({x:e.x+e.w/2, y:e.y+6, w:6,h:6, vx:e.face*1.9, vy:-1.9, t:0});
      e.cd=110; e.st='throw'; e.t=0; nz(.07,.02,600);
    }
    e.tell = (e.st==='throw' && e.t<20) ? 'white' : '';
    if(e.st==='throw' && e.t>26) e.st='idle';
  }

  if(e.kind==='chalk'){
    e.sway=(e.sway||0)+0.05;
    if(e.mode==='watch'){ e.vx=0; e.face=dx>0?1:-1; e.tell=''; }
    else {
      const slow = e.live?1:1.55;
      if(e.st==='idle'){
        e.face=dx>0?1:-1;
        e.vx = e.live ? (dx>0?1:-1)*(adx>44?0.72:0.2) : 0;
        if(e.cd>0) e.cd--;
        else if(adx<(e.live?150:120)){
          const pick = e.live ? rnd() : 0;
          if(pick<0.62){ e.st='wind'; e.t=0; e.tell='white'; }
          else { e.st='coil'; e.t=0; e.tell='gold'; }
          e.vx=0;
        }
      }
      else if(e.st==='wind'){ e.tell='white'; e.vx=0; if(e.t>=Math.round(34*slow)){ e.st='cut'; e.t=0; e.tell=''; } }
      else if(e.st==='cut'){
        e.vx=e.face*0.8;
        if(e.t<=10){
          const box={x:e.face>0?e.x+e.w-4:e.x-26,y:e.y+4,w:30,h:24};
          if(rects(box,P)){ if(!tryParry(e,e.x)) hurtPlayer(e.live?15:9,e.face); }
        }
        if(e.t>=13){ e.st='rec'; e.t=0; }
      }
      else if(e.st==='coil'){ e.tell='gold'; e.vx*=0.8; if(e.t>=Math.round(30*slow)){ e.st='leap'; e.t=0; e.tell=''; e.vy=-6.4; e.vx=e.face*2.6; } }
      else if(e.st==='leap'){
        if(rects(e,P) && e.t>3) hurtPlayer(e.live?18:11,e.face,true);
        if(e.onGround && e.t>6){ shake(5); e.st='rec'; e.t=0; burst(e.x+e.w/2,e.y+e.h,14,'#cfc6ad',2.4,26); }
      }
      else if(e.st==='rec'){ e.vx*=0.82; if(e.t>=Math.round(40*slow)){ e.st='idle'; e.t=0; e.cd=Math.round((e.live?38:72)); } }
    }
  }

  if(e.kind==='roller'){
    // a skull that rolls at you, then sits up and bites
    if(e.st==='idle'){
      e.vx*=0.86;
      if(e.cd>0) e.cd--;
      else if(adx<150 && ady<50){ e.st='roll'; e.t=0; e.face=dx>0?1:-1; }
    }
    else if(e.st==='roll'){
      e.spin += e.face*0.34;
      e.vx = e.face*2.5;
      if(rects(e,P)) hurtPlayer(11,e.face);
      if(e.t>=54 || (adx<20 && ady<20)){ e.st='rise'; e.t=0; }
    }
    else if(e.st==='rise'){ e.tell='white'; e.vx*=0.7; if(e.t>=22){ e.st='bite'; e.t=0; e.tell=''; } }
    else if(e.st==='bite'){
      if(e.t<=8){
        const box={x:e.face>0?e.x+e.w-2:e.x-16,y:e.y+2,w:18,h:14};
        if(rects(box,P)){ if(!tryParry(e,e.x)) hurtPlayer(13,e.face); }
      }
      if(e.t>=14){ e.st='rec'; e.t=0; }
    }
    else if(e.st==='rec'){ e.vx*=0.8; if(e.t>=30){ e.st='idle'; e.t=0; e.cd=44; } }
  }

  if(e.kind==='ember'){
    // a wisp of the fire that does not go out: it hovers, then falls on you
    e.vy = 0; e.vx = 0;
    if(e.st==='idle'){
      const tx = P.x+P.w/2 - e.w/2, ty = P.y - 44;
      e.x += clamp((tx-e.x)*0.02, -1.5, 1.5);
      e.y += clamp((ty-e.y)*0.03, -1.3, 1.3) + Math.sin((G.t+e.x)/16)*0.35;
      if(e.cd>0) e.cd--;
      else if(adx<40 && P.y>e.y){ e.st='gather'; e.t=0; }
    }
    else if(e.st==='gather'){
      e.tell='gold';
      e.y += Math.sin(G.t/3)*0.6;
      if(e.t>=26){ e.st='dive'; e.t=0; e.tell=''; e.dvx=clamp(dx*0.06,-2.2,2.2); }
    }
    else if(e.st==='dive'){
      e.y += 4.2; e.x += e.dvx;
      if(rects(e,P)){ hurtPlayer(15, e.x<P.x?1:-1, true); e.st='cool'; e.t=0; }
      if(solidAt(e.x+e.w/2, e.y+e.h+2, null) || e.t>44){
        e.st='cool'; e.t=0; burst(e.x+e.w/2, e.y+e.h, 12, C.gold, 2.4, 22);
      }
    }
    else if(e.st==='cool'){
      e.y -= 1.4;
      if(e.t>=50){ e.st='idle'; e.t=0; e.cd=54; }
    }
    if(G.t%7===0) burst(e.x+e.w/2, e.y+e.h-2, 1, e.st==='gather'?'#ffd27a':'#d8922e', .8, 16);
    return;
  }

  if(e.kind==='crawler'){
    // low, fast, and it bites twice
    if(e.st==='idle'){
      e.vx = e.face*0.42;
      if(Math.abs(e.x-e.home)>70) e.face*=-1;
      if(!solidAt(e.x+(e.face>0?e.w+2:-2), e.y+e.h+2, null)) e.face*=-1;
      if(adx<120 && ady<30){ e.st='run'; e.t=0; e.face = dx>0?1:-1; }
      if(e.cd>0) e.cd--;
    }
    else if(e.st==='run'){
      e.face = dx>0?1:-1; e.vx = e.face*1.9;
      if(adx<26 && e.cd<=0){ e.st='wind'; e.t=0; e.vx=0; }
      if(e.t>110){ e.st='idle'; e.t=0; }
    }
    else if(e.st==='wind'){ e.tell='white'; e.vx=0; if(e.t>=17){ e.st='bite'; e.t=0; e.tell=''; } }
    else if(e.st==='bite' || e.st==='bite2'){
      e.vx = e.face*1.3;
      if(e.t<=7){
        const box={x: e.face>0?e.x+e.w-2:e.x-16, y:e.y, w:18, h:e.h};
        if(rects(box,P)){ if(!tryParry(e,e.x)) hurtPlayer(10,e.face); }
      }
      if(e.t>=9){
        if(e.st==='bite'){ e.st='wind2'; e.t=0; }
        else { e.st='rec'; e.t=0; }
      }
    }
    else if(e.st==='wind2'){ e.tell='white'; e.vx*=0.7; if(e.t>=11){ e.st='bite2'; e.t=0; e.tell=''; } }
    else if(e.st==='rec'){ e.vx*=0.8; if(e.t>=30){ e.st='idle'; e.t=0; e.cd=34; } }
    e.vy=Math.min(e.vy+0.46,9); moveEnt(e); return;
  }

  if(e.kind==='effigy'){
    // carved, rooted, and it will not stop until it is broken
    e.vx=0; e.face = dx>0?1:-1;
    if(e.cd>0) e.cd--;
    if(e.st==='idle'){
      if(adx<210 && ady<80 && e.cd<=0){ e.st='wake'; e.t=0; }
    }
    else if(e.st==='wake'){ e.tell='white'; if(e.t>=34){ e.st='volley'; e.t=0; e.tell=''; e.shots=0; } }
    else if(e.st==='volley'){
      if(e.t%9===0 && e.shots<3){
        e.shots++;
        const ang=Math.atan2((P.y+P.h/2)-(e.y+9), (P.x+P.w/2)-(e.x+e.w/2));
        shots.push({x:e.x+e.w/2, y:e.y+8, w:6,h:6,
          vx:Math.cos(ang)*2.3, vy:Math.sin(ang)*2.3, t:0, ember:true});
        nz(.06,.02,700);
      }
      if(e.t>=34){ e.st='rec'; e.t=0; }
    }
    else if(e.st==='rec'){ if(e.t>=40){ e.st='idle'; e.t=0; e.cd=90; } }
    e.vy=Math.min(e.vy+0.46,9); moveEnt(e); return;
  }

  if(e.kind==='horned'){
    // it lowers the horns; the horns cannot be turned aside
    if(e.st==='idle'){
      e.face = dx>0?1:-1;
      e.vx = (adx>40 && adx<180) ? e.face*0.5 : 0;
      if(e.cd>0) e.cd--;
      if(adx<44 && ady<30 && e.cd<=0){ e.st = rnd()<.45 ? 'gore' : 'lower'; e.t=0; e.vx=0; }
      else if(adx<170 && ady<34 && e.cd<=0 && rnd()<.02){ e.st='lower'; e.t=0; }
    }
    else if(e.st==='lower'){ e.tell='gold'; e.vx*=0.8; if(e.t>=32){ e.st='charge'; e.t=0; e.tell=''; e.vx=e.face*3.6; } }
    else if(e.st==='charge'){
      e.vx = e.face*3.6;
      if(rects(e,P)) hurtPlayer(22,e.face,true);
      if(e.t>=40 || solidAt(e.x+(e.face>0?e.w+2:-2), e.y+e.h/2, null)){
        e.st='rec'; e.t=0; shake(5); nz(.2,.06,260);
        burst(e.x+e.w/2,e.y+e.h,14,C.earthLit,2.4,26);
      }
    }
    else if(e.st==='gore'){
      e.tell = e.t<26 ? 'white' : '';
      if(e.t>26 && e.t<=36){
        const box={x:e.face>0?e.x+e.w-4:e.x-24,y:e.y-2,w:28,h:22};
        if(rects(box,P)){ if(!tryParry(e,e.x)) hurtPlayer(18,e.face); }
      }
      if(e.t>=42){ e.st='rec'; e.t=0; }
    }
    else if(e.st==='rec'){ e.vx*=0.82; if(e.t>=44){ e.st='idle'; e.t=0; e.cd=50; } }
  }

  if(e.kind==='warden'){
    if(e.st==='idle'){
      e.face = dx>0?1:-1;
      e.vx = (adx>34 && adx<160) ? e.face*0.4 : 0;
      e.face = dx>0?1:-1;
      e.vx = (adx>34 && adx<160) ? e.face*0.4 : 0;
      if(e.cd>0) e.cd--;
      if(adx<40 && ady<28 && e.cd<=0){ e.st='wind'; e.t=0; e.vx=0; }
    }
    else if(e.st==='wind'){ e.tell='white'; e.vx=0; if(e.t>=40){ e.st='chop'; e.t=0; e.tell=''; } }
    else if(e.st==='chop'){
      if(e.t<=9){
        const box={x: e.face>0?e.x+e.w-4:e.x-26, y:e.y, w:30, h:26};
        if(rects(box,P)){ if(!tryParry(e,e.x)) hurtPlayer(20,e.face); }
      }
      if(e.t>=12){ e.st='rec'; e.t=0; }
    }
    else if(e.st==='rec'){ e.vx*=0.8; if(e.t>=46){ e.st='idle'; e.t=0; e.cd=40; } }
  }

  e.vy = Math.min(e.vy+0.46, 9);
  moveEnt(e);
}

// -- boss --------------------------------------------------------------------
const LIES = [
  "I did not take her.",
  "You were never buried.",
  "There is no name under the chalk.",
  "Your mother sent me.",
  "Stop swinging. I am already gone."
];
function bossUpdate(b){
  if(b.dead) return;
  G.seen['boss_'+b.who]=1;
  if(b.flash>0) b.flash--;
  if(b.lineT>0) b.lineT--;
  if(b.who==='ekwensu'){ ekwensuUpdate(b); return; }
  if(b.who==='onwe'){ onweUpdate(b); return; }

  if(b.bound>0){
    b.bound--;
    if(b.bound===0){ say("The dark closes over him again. Call it again. [N]",110); b.poise=b.poiseMax; b.broken=0; }
    else if(b.bound===90) say("He is slipping back under.",70);
  } else {
    // unnamed, he simply refuses to stay wounded
    b.hp = Math.min(b.maxhp, b.hp + 0.30);
    b.broken = 0;
    if(b.hp > b.maxhp*0.94) teach('bound', "Your blade slides off him. He is closing faster than you can open him.", 220);
  }

  if(b.broken>0){
    b.broken--;
    if(b.broken===0){ b.poise=b.poiseMax; b.stagger=Math.max(b.stagger,14); b.st='idle'; b.t=0; }
  }

  if(b.hp < b.maxhp*0.5 && b.phase===1){
    b.phase=2; b.stagger=30; shake(8); G.flash=10; S.brk();
    say("\"You remember wrong.\"",140);
    burst(b.x+b.w/2,b.y+b.h/2,44,C.uhie,3,50);
  }

  if(b.stagger>0 || b.broken>0){
    b.stagger=Math.max(0,b.stagger-1);
    b.vx*=0.88; b.vy=Math.min(b.vy+0.46,9); b.tell=''; moveEnt(b); return;
  }

  const dx=(P.x+P.w/2)-(b.x+b.w/2), adx=Math.abs(dx);
  b.t++;
  const fast = b.phase===2?0.72:1;
  const F = n => Math.round(n*fast);

  if(b.st==='idle'){
    b.face = dx>0?1:-1;
    b.vx = (dx>0?1:-1)*(adx>60?0.9:0.35)*(b.phase===2?1.35:1);
    if(b.cd>0) b.cd--;
    else {
      const roll = rnd();
      if(adx<62 && roll<0.42) b.st='slashWind';
      else if(roll<0.62) b.st='leapWind';
      else if(b.phase===2 && roll<0.80) b.st='fanWind';
      else b.st='vanish';
      b.t=0;
      if(b.lineT<=0 && rnd()<0.5){ b.line = LIES[(b.said++)%LIES.length]; b.lineT=150; }
    }
  }
  else if(b.st==='slashWind'){ b.tell='white'; b.vx*=0.8; if(b.t>=F(26)){ b.st='slash1'; b.t=0; b.tell=''; } }
  else if(b.st==='slash1'||b.st==='slash2'||b.st==='slash3'){
    b.vx = b.face*1.1;
    if(b.t<=10){
      const box={x:b.face>0?b.x+b.w-4:b.x-30, y:b.y+8, w:34, h:30};
      if(rects(box,P)){ if(!tryParry(b,b.x)) hurtPlayer(18,b.face); }
    }
    if(b.t>=F(16)){
      if(b.st==='slash1'){ b.st='slash2'; b.t=0; }
      else if(b.st==='slash2' && b.phase===2){ b.st='slash3'; b.t=0; }
      else { b.st='rec'; b.t=0; }
    }
  }
  else if(b.st==='leapWind'){ b.tell='gold'; b.vx*=0.7; if(b.t>=F(24)){ b.st='leap'; b.t=0; b.tell=''; b.vy=-7.2; b.vx=(dx>0?1:-1)*2.2; } }
  else if(b.st==='leap'){
    if(rects(b,P) && b.t>4) hurtPlayer(20,b.face,true);
    if(b.onGround && b.t>6){
      shake(9); stop(7); nz(.3,.08,180); b.st='rec'; b.t=0;
      burst(b.x+b.w/2,b.y+b.h,26,C.earthLit,3,32);
      for(const d of [-1,1]) shots.push({x:b.x+b.w/2, y:b.y+b.h-8, w:10,h:10, vx:d*2.6, vy:0, wave:true, t:0});
    }
  }
  else if(b.st==='fanWind'){ b.tell='white'; b.vx*=0.8;
    if(b.t>=F(30)){
      b.st='rec'; b.t=0; b.tell=''; nz(.12,.04,700);
      for(let k=-2;k<=2;k++) shots.push({x:b.x+b.w/2, y:b.y+14, w:6,h:6, vx:b.face*2.2, vy:k*0.7, t:0, ember:true});
    }
  }
  else if(b.st==='vanish'){
    b.tell = b.t<F(28) ? 'gold' : '';
    if(b.t===1) burst(b.x+b.w/2,b.y+b.h/2,20,C.indigo,2.4,28);
    if(b.t===F(28)){
      b.x = clamp(P.x - (dx>0?1:-1)*34, 16, R.w*T-b.w-16);
      b.face = (P.x>b.x)?1:-1;
      burst(b.x+b.w/2,b.y+b.h/2,20,C.indigo,2.4,28); nz(.1,.04,900);
    }
    if(b.t>F(28) && b.t<=F(28)+14){
      const box={x:b.face>0?b.x+b.w-4:b.x-26, y:b.y+14, w:30, h:24};
      if(rects(box,P)) hurtPlayer(22,b.face,true);   // gold tell: roll it, do not ward it
    }
    if(b.t>=F(52)){ b.st='rec'; b.t=0; }
  }
  else if(b.st==='rec'){ b.tell=''; b.vx*=0.8; if(b.t>=F(38)){ b.st='idle'; b.t=0; b.cd=F(34); } }

  b.vy = Math.min(b.vy+0.46, 9);
  moveEnt(b);
}

// -- EKWENSU: he does not lie. He simply hits harder than you. -----------------
const EK_LINES=[
  "\"I am not the one who took her. I am the one who was paid.\"",
  "\"Nine of you have stood there. I kept all nine.\"",
  "\"You are not angry. You are only early.\""
];

    burst(b.x+b.w/2,b.y+b.h/2,50,C.uhie,3.2,52);
