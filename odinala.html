// ty is the floor row the mirror stands on
const MIRRORS={
  0:{room:0, tx:23, ty:16, name:'Mirror at the Charm'},
  2:{room:2, tx:5,  ty:35, name:'Mirror at the Foot of the Shaft'},
  4:{room:4, tx:5,  ty:16, name:'Mirror in the Night Market'},
  5:{room:5, tx:6,  ty:16, name:'Mirror under the Water'},
  6:{room:6, tx:7,  ty:16, name:'Mirror on the Bone Road'},
  7:{room:7, tx:8,  ty:16, name:'Mirror in the Land of Spirits'},
  8:{room:8, tx:7,  ty:16, name:'Mirror at the Forge'},
  9:{room:9, tx:10, ty:16, name:'Mirror under the Open Sky'}
};
// A room can carry an M tile and have no entry here — that is an authoring
// mistake, and it used to be a fatal one: reading .name off undefined threw out
// of frame() and the loop never restarted. Fall back to the room's own name and
// the floor under its M tile so the glass still works, and complain once so the
// mistake is findable. tools/audit.py fails on this statically.
const MIRROR_WARNED={};
function mirrorInfo(id){
  const m=MIRRORS[id];
  if(m) return m;
  if(!MIRROR_WARNED[id]){
    MIRROR_WARNED[id]=1;
    if(typeof console!=='undefined' && console.warn)
      console.warn('Ọdịnala: room '+id+' has a mirror but no MIRRORS entry. '+
                   'Using the room name. Add one — tools/audit.py checks for this.');
  }
  const r=ROOMS[id];
  let tx=2, ty=16;
  if(r){
    for(let y=0;y<r.h && ty===16;y++){
      const x=r.map[y].indexOf('M');
      if(x<0) continue;
      tx=x;
      for(let k=y;k<r.h;k++) if(SOLID(tileAt(r,tx,k))){ ty=k; break; }
      break;
    }
  }
  return {room:id, tx:tx, ty:ty, name:(r?r.name:'The glass'), fallback:true};
}
const TRV={sel:0};
function openTravel(){
  const keys=Object.keys(G.mirrors).filter(k=>G.mirrors[k]);
  if(!keys.length){ say("This is the only glass you have opened.",100); return; }
  TRV.sel=0; G.mode='travel';
}
function travelList(){ return Object.keys(MIRRORS).filter(k=>G.mirrors[k]); }
function travelUpdate(){
  const list=travelList();
  // an empty list would make the modulo below NaN and strand the player in a
  // menu with nothing in it
  if(!list.length){ if(tap('KeyX')||tap('KeyZ')||tap('Enter')) G.mode='play'; return; }
  if(TRV.sel>=list.length) TRV.sel=0;
  if(tap('ArrowUp')||tap('KeyW')){ TRV.sel=(TRV.sel-1+list.length)%list.length; tone(540,.05,'square',.02); }
  if(tap('ArrowDown')||tap('KeyS')){ TRV.sel=(TRV.sel+1)%list.length; tone(540,.05,'square',.02); }
  if(tap('KeyX')){ G.mode='play'; return; }
  if(tap('KeyZ')||tap('Enter')){
    const m=mirrorInfo(list[TRV.sel]);
    G.mode='play'; G.fade=1; S.name();
    resetPlayerAt(m.room, m.tx, m.ty);
    say(m.name,120); saveGame();
  }
}

function shopItems(){
  const it=[];
  for(const k of SPELL_ORDER){
    const lv=spellLv(k), cost=[70,170,340][lv];
    if(lv<3) it.push({kind:'spell', k:k, cost:cost,
      label:(lv===0?'LEARN  ':'DEEPEN ')+SPELLS[k].name+(lv?'  \u2192 '+(lv+1):''),
      desc:SPELLS[k].blurb+'   ['+SPELLS[k].cost+' \u1ecdf\u1ecd]'});
  }
  for(const wk of ['nkwu','ogu']){
    if(!G.weapons[wk]) it.push({kind:'weapon', k:wk, cost: wk==='nkwu'?190:260,
      label:'TAKE UP  '+WEAPONS[wk].name, desc:WEAPONS[wk].blurb});
  }
  if(G.skills.flasks<5) it.push({kind:'flask', cost:110*(G.skills.flasks-2),
    label:'ANOTHER GOURD  \u2192 '+(G.skills.flasks+1), desc:'One more draught of nzu between charms.'});
  if(G.skills.heartUps<3) it.push({kind:'heart', cost:130*(G.skills.heartUps+1),
    label:'DEEPEN THE VESSEL  +30 life', desc:'You were never meant to hold this much.'});
  if(!G.skills.riposte) it.push({kind:'riposte', cost:210,
    label:'RIPOSTE', desc:'A turned blade answers on its own. Parries strike back.'});
  if(!G.skills.swift) it.push({kind:'swift', cost:230,
    label:'SWIFT HAND', desc:'Recover from every swing a quarter faster.'});
  if(!G.skills.charm) it.push({kind:'charm', cost:160,
    label:'COWRIE CHARM', desc:'The dead drop half again as much.'});
  return it;
}
function openShop(){ G.mode='shop'; G.sel=0; }
function shopUpdate(){
  const it=shopItems();
  if(!it.length){ if(tap('KeyX')||tap('KeyZ')) G.mode='play'; return; }
  if(tap('ArrowUp')||tap('KeyW')){ G.sel=(G.sel-1+it.length)%it.length; tone(540,.05,'square',.02); }
  if(tap('ArrowDown')||tap('KeyS')){ G.sel=(G.sel+1)%it.length; tone(540,.05,'square',.02); }
  if(tap('KeyX')){ G.mode='play'; return; }
  if(tap('KeyZ')||tap('Enter')){
    const o=it[Math.min(G.sel,it.length-1)];
    if(P.cowries < o.cost){ tone(130,.25,'sawtooth',.05,80); G.note='Not enough cowries.'; G.noteT=90; return; }
    P.cowries-=o.cost;
    if(o.kind==='spell'){ G.spells[o.k]=spellLv(o.k)+1; G.equipped=o.k; }
    if(o.kind==='weapon'){ G.weapons[o.k]=1; G.weapon=o.k; P.combo=0; }
    if(o.kind==='flask'){ G.skills.flasks++; P.flasks=G.skills.flasks; }
    if(o.kind==='heart'){ G.skills.heartUps++; G.maxHP+=30; P.hp=G.maxHP; }
    if(o.kind==='riposte') G.skills.riposte=1;
    if(o.kind==='swift') G.skills.swift=1;
    if(o.kind==='charm') G.skills.charm=1;
    S.name(); G.flash=8; saveGame();
    G.sel=Math.min(G.sel, Math.max(0,shopItems().length-1));
  }
}

  const it=shopItems();

function endTutorial(skipped){

function tutUpdate(){
  if(!TUT.on) return;

  const st=TSTEPS[TUT.step];
  if(!st){ endTutorial(false); return; }
  if(st.ok()){
    TUT.step++;
    if(TUT.step>=TSTEPS.length){ endTutorial(false); return; }
    TUT.hold=34; tone(760,.1,'triangle',.04,1180); tone(1140,.14,'sine',.03,1520);

}

function wrapLeft(text,x,y,maxw,lh){
  const words=String(text).split(' '); let line='', yy=y;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxw && line){ ctx.fillText(line,x,yy); yy+=lh; line=w; }
    else line=test;
  }
  if(line){ ctx.fillText(line,x,yy); yy+=lh; }
  return yy;
}

// -- how far in you are -------------------------------------------------------
function storyProgress(){
  const steps=[
    [()=>true,                    'the charm, dug up'],
    [()=>G.tutDone,               'the teaching, done'],
    [()=>G.visited[1],            'on the path that watches'],
    [()=>G.visited[2],            'down the shaft'],
    [()=>G.knowsName,             'the name, read off the stone'],
    [()=>G.slain.ogbunabali,      'the one who kills at night, quiet'],
    [()=>G.visited[6],            'onto the bone road'],
    [()=>G.slain.ekwensu,         'the one who was paid, undone'],
    [()=>G.visited[7],            'in the land of spirits'],
    [()=>G.ending>0,              'finished']
  ];
  let n=0, label=steps[0][1];
  for(const [f,l] of steps){ let ok=false; try{ ok=!!f(); }catch(x){}
    if(ok){ n++; label=l; } }
  return {n:n, of:steps.length, pct:Math.round(n/steps.length*100), label:label};
}

    ctx.fillText(pauseLabel(r[i]), W/2, y);
    if(on && (r[i]==='spell'||r[i]==='weapon')){ ctx.fillStyle=C.goldDim; ctx.font='7px ui-sans-serif,system-ui';
      ctx.fillText('\u25c0  \u25b6', W/2, y+9); }
  }
  ctx.font='7px ui-sans-serif,system-ui'; ctx.fillStyle='#4a473f';
  ctx.fillText('\u2191 \u2193  choose      Z  take it      X / ESC  back', W/2, H-14);
  ctx.textAlign='left';
}

const ENDW={t:0};
function endingUpdate(){
  ENDW.t++;
  if(ENDW.t>90 && (tap('KeyZ')||tap('Enter')||tap('KeyX')||tap('Escape'))){
    saveGame(); G.mode='title'; TITLE.sel=0;
  }
}
function renderEnding(){
  ctx.fillStyle='#04050a'; ctx.fillRect(0,0,W,H);
  const t=ENDW.t;
  ctx.globalAlpha=Math.min(1,t/60);
  ctx.textAlign='center';
  ctx.font='22px ui-serif,Georgia,serif'; ctx.fillStyle=C.bone;
  ctx.fillText('\u1eccD\u1eaeNALA', W/2, 54);
  ctx.font='8px ui-serif,Georgia,serif'; ctx.fillStyle=C.goldDim;
  ctx.fillText('the \u1ecdgbanje who would not go back', W/2, 68);
  glyph(W/2-92,60,7,C.gold,G.t/70); glyph(W/2+92,60,7,C.gold,-G.t/70);
  ctx.globalAlpha=1;

  if(t>50){
    ctx.globalAlpha=Math.min(1,(t-50)/50);
    const mins=Math.floor(G.playT/3600), secs=Math.floor((G.playT/60)%60);
    const kills=Object.keys(G.slain).reduce((a,k)=>a+(G.slain[k]||0),0);
    const rows=[
      ['time on this side', mins+'m '+String(secs).padStart(2,'0')+'s'],
      ['times you died',    String(G.deaths)],
      ['things put down',   String(kills)],
      ['cowries kept',      String(P.cowries)],
      ['bestiary',          beastOpen().length+' of '+BEASTS.length],
      ['lore recovered',    loreOpen().length+' of '+LORE.length],
      ['ground walked',     Object.keys(G.visited).length+' of 8'],
      ['mirrors opened',    Object.keys(G.mirrors).filter(k=>G.mirrors[k]).length+' of 6']
    ];
    ctx.font='8px ui-sans-serif,system-ui';
    for(let i=0;i<rows.length;i++){
      const y=100+i*15;
      ctx.textAlign='right'; ctx.fillStyle=C.chalkDim; ctx.fillText(rows[i][0], W/2-8, y);
      ctx.textAlign='left';  ctx.fillStyle=C.bone;     ctx.fillText(rows[i][1], W/2+8, y);
    }
    ctx.globalAlpha=1;
  }
  if(t>90){
    ctx.textAlign='center';
    ctx.globalAlpha=.5+Math.sin(G.t/22)*.3;
    ctx.font='8px ui-sans-serif,system-ui'; ctx.fillStyle=C.gold;
    ctx.fillText('Z  \u2014  the charm remembers you', W/2, H-18);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}

function invUpdate(){ if(tap('KeyX')||tap('KeyZ')||tap('Escape')||tap('Enter')) G.mode='pause'; }

  ctx.globalAlpha=.93; px(0,0,W,H,'#06070b'); ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.font='9px ui-sans-serif,system-ui'; ctx.fillStyle=C.goldDim;
  ctx.fillText('WHAT YOU CARRY', W/2, 22); ctx.textAlign='left';

  ctx.font='7px ui-sans-serif,system-ui'; ctx.fillStyle=C.goldDim;

    const have=!!G.weapons[wk], eq=G.weapon===wk;

    ctx.fillStyle = have ? (eq?WEAPONS[wk].tint:C.chalkDim) : '#3f3b34';

  y+=6;
  ctx.font='7px ui-sans-serif,system-ui'; ctx.fillStyle=C.goldDim;
  ctx.fillText('THE FOUR WORDS', 26, y); y+=12;

    const lv=spellLv(k), eq=G.equipped===k;
    ctx.font='8px ui-sans-serif,system-ui';
    ctx.fillStyle = lv? (eq?C.bone:C.chalkDim) : '#3f3b34';
    ctx.fillText((eq?'\u25b8 ':'  ')+SPELLS[k].name, 26, y);
    ctx.textAlign='right';
    ctx.fillStyle = lv?C.gold:'#3f3b34';
    ctx.fillText(lv? 'I'.repeat(lv)+'   '+SPELLS[k].cost+' \u1ecdf\u1ecd' : 'not learned', W-26, y);
    ctx.textAlign='left';
    if(lv){ ctx.font='7px ui-serif,Georgia,serif'; ctx.fillStyle='#5b554a';
      ctx.fillText(SPELLS[k].blurb, 34, y+8); y+=8; }

  }
  y+=4; px(26,y-8,W-52,1,'#1b1f24');
  ctx.font='7px ui-sans-serif,system-ui'; ctx.fillStyle=C.goldDim;
  ctx.fillText('WHAT YOU HAVE TAKEN', 26, y+4); y+=16;
  const carried=[
    ['Cowries', String(P.cowries)],
    ['Life', G.maxHP+'  ('+G.skills.heartUps+' shards)'],
    ['Gourds of nzu', String(G.skills.flasks)],
    ['His name', G.knowsName?'OGBUNABALI':'not yet'],
    ["Ala's Fall", G.hasSlam?'yes \u2014 \u2193 + Z in the air':'not yet'],
    ['Riposte', G.skills.riposte?'yes':'\u2014'],
    ['Swift Hand', G.skills.swift?'yes':'\u2014'],
    ['Cowrie Charm', G.skills.charm?'yes':'\u2014'],
    ['Mirrors opened', String(Object.keys(G.mirrors).filter(k=>G.mirrors[k]).length)+' of 6'],
    ['Ground walked', String(Object.keys(G.visited).length)+' of 8'],
    ['Cheats', G.cheat?'ON':'\u2014']
  ];
  ctx.font='8px ui-sans-serif,system-ui';
  for(let i=0;i<carried.length;i++){
    const col=i%2, row=(i/2)|0;
    const bx=26+col*(W/2-16), by=y+row*13;
    ctx.fillStyle=C.chalkDim; ctx.fillText(carried[i][0], bx, by);
    ctx.fillStyle=carried[i][1]==='\u2014'||carried[i][1]==='not yet'?'#4a453d':C.bone;
    ctx.fillText(carried[i][1], bx+96, by);
  }
  ctx.textAlign='center'; ctx.font='7px ui-sans-serif,system-ui'; ctx.fillStyle='#4a473f';
  ctx.fillText('X  back', W/2, H-12); ctx.textAlign='left';
}

// -- the map -----------------------------------------------------------------
const MAPPOS=[[10,74],[92,74],[196,60],[236,176],[188,10],[292,10],[352,176],[300,132],[352,74],[400,132]];
function mapUpdate(){
  if(tap('KeyM')||tap('Tab')||tap('KeyX')||tap('Escape')) G.mode='play';
}
function renderMap(){
  ctx.globalAlpha=.9; px(0,0,W,H,'#05070b'); ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.font='8px ui-sans-serif,system-ui'; ctx.fillStyle=C.goldDim;
  ctx.fillText('ALA \u2014 what you have walked', W/2, 16); ctx.textAlign='left';
  // links
  ctx.strokeStyle='#20262c'; ctx.lineWidth=1;
  const link=(a,b)=>{ if(!G.visited[a]||!G.visited[b]) return;
    const pa=MAPPOS[a], pb=MAPPOS[b];
    ctx.beginPath(); ctx.moveTo(pa[0]+ROOMS[a].w, pa[1]+ROOMS[a].h);
    ctx.lineTo(pb[0]+ROOMS[b].w, pb[1]+ROOMS[b].h); ctx.stroke(); };
  link(0,1); link(1,2); link(2,3); link(1,4); link(4,5); link(5,2); link(3,6); link(6,8); link(8,9); link(9,7);
  for(let i=0;i<ROOMS.length;i++){
    if(!G.visited[i]) continue;
    const r=ROOMS[i], p=MAPPOS[i]||[0,0];
    for(let y=0;y<r.h;y++) for(let x=0;x<r.w;x++){
      const ch=tileAt(r,x,y);
      if(ch==='#'||ch==='c'){ px(p[0]+x*2, p[1]+y*2, 2,2, i===G.room?'#2e3a34':'#1e242a'); }
      else if(ch==='-'){ px(p[0]+x*2, p[1]+y*2, 2,1, '#2a3228'); }
      else if(ch==='E'){ px(p[0]+x*2, p[1]+y*2, 2,2, C.goldDim); }
      else if(ch==='M'){ px(p[0]+x*2, p[1]+y*2, 2,2, G.mirrors[i]?C.spirit||C.gold:'#3a3a44'); }
      else if(ch==='S'||ch==='N'){ px(p[0]+x*2, p[1]+y*2, 2,2, C.uhie); }
    }
    ctx.font='6px ui-sans-serif,system-ui';
    ctx.fillStyle = i===G.room?C.bone:'#5a5a52';
    ctx.fillText(r.name.split('\u2014')[0].trim(), p[0], p[1]-3);
  }
  // you
  const p=MAPPOS[G.room]||[0,0];
  const bx=p[0]+Math.round(P.x/T)*2, by=p[1]+Math.round(P.y/T)*2;
  if(G.t%30<20){ px(bx-1,by-1,4,4,C.gold); }
  ctx.font='7px ui-sans-serif,system-ui'; ctx.fillStyle=C.chalkDim; ctx.textAlign='center';
  ctx.fillText('M / X  close      gold squares are doorways, blue glass is a mirror', W/2, H-12);
  ctx.textAlign='left';
}

// ── loop ─────────────────────────────────────────────────────────────────────
let last=performance.now(), acc=0;
// The loop must never be able to die. A single bad property lookup inside any
// update or painter used to escape frame(), skip the requestAnimationFrame at
// the bottom, and stop the game permanently — the player sees a frozen picture
// and loses the run. Everything is wrapped: on a throw we log once, mark
// G.crashed, and keep scheduling. A game running with one broken system beats a
// game that has stopped.
function frame(now){
  try{ frameBody(now); }
  catch(err){
    if(!G.crashed){
      G.crashed = true;
      G.crashErr = (err && err.message) ? err.message : String(err);
      if(typeof console!=='undefined' && console.error)
        console.error('Ọdịnala: a frame threw and was contained. The loop keeps running.', err);
    }
    // ctx is a `let` that buildBackLayers() swaps; if the throw happened mid-bake
    // we would otherwise keep painting into the offscreen canvas forever
    if(ctx!==baseCtx) ctx=baseCtx;
    try{ drawCrashNotice(); }catch(e){}
  }
  requestAnimationFrame(frame);
}
// Small, non-blocking, and it does not stop the player playing.
function drawCrashNotice(){
  ctx.globalAlpha=.72; px(0,H-11,W,11,'#1a0d0d'); ctx.globalAlpha=1;
  ctx.font='7px ui-sans-serif,system-ui'; ctx.fillStyle='#c0603b'; ctx.textAlign='left';
  ctx.fillText('something went wrong here — the game is still running', 6, H-3);
  ctx.textAlign='left';
}
function frameBody(now){
  let dt = now-last; last=now; acc += Math.min(60,dt);
  const step = 1000/60;
  while(acc>=step){
    acc-=step;
    menuRepeat();
    let consumed=true;
    switch(G.mode){
      case 'title':  G.t++; titleUpdate();  break;
      case 'cut':    G.t++; cutUpdate();    break;
      case 'map':    G.t++; mapUpdate();    break;
      case 'riddle': G.t++; riddleUpdate(); break;
      case 'travel': G.t++; travelUpdate(); break;
      case 'shop':   G.t++; shopUpdate();   break;
      case 'pause':  G.t++; pauseUpdate();  break;
      case 'inv':    G.t++; invUpdate();    break;
      case 'codex':  G.t++; codexUpdate();  break;
      case 'ending': G.t++; endingUpdate(); break;
      default:
        // presses survive hitstop and slow-mo: a tap during a freeze frame still
        // lands on the next real frame instead of being eaten by it.
        if(G.hitstop>0){ G.hitstop--; consumed=false; }
        else if(G.slow>0 && G.t%2===0){ G.slow--; G.t++; consumed=false; }
        else update();
    }
    if(consumed) for(const k in pressed) pressed[k]=false;
  }
  if(G.mode==='title') renderTitle();
  else if(G.mode==='cut') renderCut();
  else {
    render();
    if(G.mode==='map') renderMap();
    else if(G.mode==='riddle') renderRiddle();
    else if(G.mode==='travel') renderTravel();
    else if(G.mode==='shop') renderShop();
    else if(G.mode==='pause') renderPause();
    else if(G.mode==='inv') renderInv();
    else if(G.mode==='codex') renderCodex();
    else if(G.mode==='ending') renderEnding();
  }
  if(G.crashed) drawCrashNotice();
}
// -- speedrun: everything open, nothing in the way ---------------------------
function unlockAll(){
  G.cheat = true;
  G.knowsName = true; G.hasSlam = true; G.tutDone = true; G.storyDone = true;
  G.maxHP = 190;                                  // base 100 + all three shards
  G.skills = {riposte:1, swift:1, charm:1, flasks:5, heartUps:3};
  G.spells = {amadioha:3, ala:3, idemili:3, ikenga:3};
  G.weapons = {mma:1, nkwu:1, ogu:1, oku:1};
  G.equipped = 'amadioha';
  for(let i=0;i<ROOMS.length;i++){ G.visited[i]=1; ROOMS[i].taken=true; }
  for(const k of Object.keys(MIRRORS)) G.mirrors[k]=true;
  G.taught = {exec:1, bound:1, bossIn:1, bossOut:1};
  P.hp = G.maxHP; P.flasks = 5; P.ofo = 100; P.cowries = Math.max(P.cowries, 99999);
}
function relock(){
  G.cheat=false;
  say('Cheats off. Everything you were given, you keep.',150);
}
function startSpeedrun(){
  unlockAll();
  resetPlayerAt(0,9,16);
  G.checkpoint={room:0,tx:9,ty:16};
  TUT.on=false;
  say("SPEEDRUN. Every mirror is open, every word is yours, and nothing here can touch you.",260);
  saveGame();
}
function startNew(){
  G.storyDone=false;
  resetPlayerAt(0,9,16);
  G.checkpoint={room:0,tx:9,ty:16};
  playCut(STORY, ()=>{
    G.storyDone=true;
    saveGame();
    if(!G.tutDone){ startTutorial(); say("Ala Iyi-uwa. You woke on top of your own charm.",150); }
    else say("Ala Iyi-uwa. You woke on top of your own charm.",200);
  });
}
function startFrom(){
  const c=G.checkpoint||{room:0,tx:9,ty:16};
  resetPlayerAt(c.room,c.tx,c.ty);
  P.hp=G.maxHP; P.flasks=G.skills.flasks;
  say(R.name,150);
}
function start(){ startNew(); }
if(globalThis.__ODINALA_TEST) globalThis.__ODINALA_TEST({
  get G(){return G}, get P(){return P}, get R(){return R},
  get enemies(){return enemies}, get boss(){return boss}, get shots(){return shots},
  get shade(){return shade},
  get pickups(){return pickups}, get shrines(){return shrines},
  down, up, update, start, ROOMS, tileAt, RIDDLES, SPELLS, MIRRORS,
  saveGame, loadGame, hasSave, wipeSave, shopItems, resetPlayerAt,
  get TUT(){return TUT}, startTutorial, endTutorial, TSTEPS,
  startSpeedrun, unlockAll, relock, titleOpts, PAUSE_SEL:()=>PAUSE.sel,
  PAUSE_LABEL:()=>pauseLabel(pauseRows()[PAUSE.sel]), LORE_OPEN:loreOpen, BEAST_OPEN:beastOpen,
  CDX:()=>CDX, storyProgress, LORE, BEASTS, openCodex, BG_ROOM:()=>bgRoom,
  WEAPONS, CHAIN, WA, cycleWeapon
});
cvs.focus();
requestAnimationFrame(frame);
})();
